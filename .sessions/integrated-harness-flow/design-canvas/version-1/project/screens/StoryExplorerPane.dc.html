<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Story explorer pane</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; height: 100%; box-sizing: border-box; background: #0B0B0B; color: #E8E8ED; font-family: 'Inter', system-ui, sans-serif; font-size: 12px; display: flex; flex-direction: column; gap: 8px; padding: 12px; overflow: hidden">
<div style="display: flex; align-items: center; gap: 8px; padding-right: 90px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #9B9BA8; flex-grow: 1">STORY EXPLORER · {{vals.story}}</span>
<button type="button" onClick="{{vals.playNext}}" style="font: inherit; font-weight: 700; color: #0B0B0B; background: #E5531A; border: 0; border-radius: 3px; padding: 1px 8px; cursor: pointer">▶ next step</button>
<button type="button" onClick="{{vals.close}}" aria-label="Close the story explorer" style="font: inherit; color: #9B9BA8; background: transparent; border: 1px solid #2A2A2A; border-radius: 3px; padding: 0 6px; cursor: pointer">✕</button>
</div>
<div style="flex-grow: 1; display: flex; gap: 10px; min-height: 0">
<div style="width: 46%; background: #111113; border: 1px solid #2A2A2A; border-radius: 4px; padding: 8px; display: flex; flex-direction: column; gap: 3px; overflow: hidden">
<sc-for list="{{vals.steps}}" as="step" hint-placeholder-count="6">
<span style="{{step.style}}">{{step.text}}</span>
</sc-for>
</div>
<div style="flex-grow: 1; background: #111113; border: 2px solid #E5531A; border-radius: 4px; padding: 10px; display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #9B9BA8">DESIGN CANVAS SCREEN · {{vals.screen}}</span>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{vals.cards}}" as="card" hint-placeholder-count="2">
<span style="{{card.style}}">{{card.label}}</span>
</sc-for>
</div>
<sc-if value="{{vals.dialogShown}}" hint-placeholder-val="{{false}}">
<span style="background: #1B1B20; border: 1px solid #2A2A2A; border-radius: 4px; padding: 8px">{{vals.dialog}}</span>
</sc-if>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"vals":{"editor":null},"$preview":{"width":800,"height":360}}'>
class Component extends DCLogic {
  renderVals() {
    return { vals: this.props.vals ?? { story: 'opened alone', screen: '', steps: [], cards: [], dialogShown: false } };
  }
}
</script>
</body>
</html>
