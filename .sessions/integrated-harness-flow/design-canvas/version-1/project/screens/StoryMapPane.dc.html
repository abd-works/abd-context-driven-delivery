<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Story map pane</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; height: 100%; box-sizing: border-box; background: #0B0B0B; color: #E8E8ED; font-family: 'Inter', system-ui, sans-serif; font-size: 12px; display: flex; flex-direction: column; gap: 8px; padding: 12px; overflow: hidden">
<div style="display: flex; align-items: center; gap: 8px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #9B9BA8; flex-grow: 1">STORY MAP · {{vals.scope}}</span>
<button type="button" onClick="{{vals.toggleIncrements}}" style="{{vals.incrementsStyle}}">{{vals.viewLabel}}</button>
<button type="button" onClick="{{vals.toggleFrames}}" style="{{vals.framesStyle}}">Screen frames</button>
</div>
<sc-if value="{{vals.isIncrements}}" hint-placeholder-val="{{false}}">
<div style="background: #2A1A12; border: 1px solid #5A3020; border-radius: 4px; padding: 6px 10px; font-weight: 700">{{vals.epic}}</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{vals.subEpics}}" as="sub" hint-placeholder-count="2"><div style="background: #12201A; border: 1px solid #24402F; border-radius: 4px; padding: 5px 10px; font-weight: 600">{{sub.name}}</div></sc-for>
</div>
<sc-for list="{{vals.increments}}" as="increment" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 6px; border-top: 1px dashed #2A2A2A; padding-top: 4px">
<div style="display: flex; align-items: center; gap: 8px"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.06em; color: #E5531A; text-transform: uppercase; border-left: 2px solid rgba(229,83,26,0.35); padding: 3px 8px; white-space: nowrap">{{increment.label}}</span><span style="flex-grow: 1"></span>
<sc-if value="{{increment.canCreate}}" hint-placeholder-val="{{true}}"><button type="button" onClick="{{increment.create}}" style="font: inherit; font-size: 11px; font-weight: 700; color: #0B0B0B; background: #E5531A; border: 1px solid #E5531A; border-radius: 3px; padding: 1px 8px; cursor: pointer">Create ticket</button></sc-if>
<sc-if value="{{increment.hasTicket}}" hint-placeholder-val="{{false}}"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #F2A07A">{{increment.ticket}}</span></sc-if></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{increment.columns}}" as="column" hint-placeholder-count="2"><div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; align-content: start">
<sc-for list="{{column.cards}}" as="card" hint-placeholder-count="2"><div style="background: #3A3220; border: 1px solid #6A5A30; border-radius: 3px; padding: 5px 6px; font-weight: 600; font-size: 11px">{{card.name}}</div></sc-for>
</div></sc-for>
</div>
</div>
</sc-for>
<div style="border: 1px dashed #2A2A2A; border-radius: 3px; padding: 4px 8px; color: #6B6B78; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.04em; text-align: center">UNASSIGNED</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{vals.unassigned}}" as="column" hint-placeholder-count="2"><div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; align-content: start">
<sc-for list="{{column.cards}}" as="card" hint-placeholder-count="1"><div style="background: #3A3220; border: 1px solid #6A5A30; border-radius: 3px; padding: 5px 6px; font-weight: 600; font-size: 11px">{{card.name}}</div></sc-for>
</div></sc-for>
</div>
</sc-if>
<sc-if value="{{vals.isStories}}" hint-placeholder-val="{{true}}">
<div style="background: #2A1A12; border: 1px solid #5A3020; border-radius: 4px; padding: 6px 10px; font-weight: 700">{{vals.epic}}</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; min-height: 0">
<sc-for list="{{vals.subEpics}}" as="sub" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="background: #12201A; border: 1px solid #24402F; border-radius: 4px; padding: 5px 10px; font-weight: 600">{{sub.name}}</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{sub.stories}}" as="story" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="{{story.style}}">{{story.name}}<span style="color: #FF6A6A; font-weight: 700"> {{story.count}}</span></div>
<sc-if value="{{story.showFrame}}" hint-placeholder-val="{{false}}">
<button type="button" onClick="{{story.play}}" style="{{story.frameStyle}}">{{story.frameLabel}}</button>
</sc-if>
</div>
</sc-for>
</div>
</div>
</sc-for>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"vals":{"editor":null},"$preview":{"width":800,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    return { vals: this.props.vals ?? { scope: 'opened alone', subEpics: [], increments: [], unassigned: [], isStories: true } };
  }
}
</script>
</body>
</html>
