<div style="width: 100%; min-width: 1100px; height: 100vh; min-height: 700px; box-sizing: border-box; display: flex; background: #0B0B0B">
<div style="position: relative; flex: 1 1 auto; min-width: 0; height: 100%; background: #ffffff; overflow: auto">
<sc-if value="{{live.sessionBoard}}" hint-placeholder-val="{{ false }}"><dc-import name="session-board" story="{{storyName}}" scenario="{{scenarioName}}" go="{{goToStory}}" hint-size="1280px,900px" style="display: block; width: 100%; min-height: 100%"></dc-import></sc-if>
<sc-if value="{{showShot}}" hint-placeholder-val="{{ true }}">
<img src="{{img}}" alt="{{stepText}}" style="display: block; width: 100%; height: auto">
</sc-if>
<sc-if value="{{showNothing}}" hint-placeholder-val="{{ false }}">
<div class="sm-panel" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #111113; color: #9B9BA8">No screen for this step yet</div>
</sc-if>
<sc-if value="{{manyImgs}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; top: 12px; right: 12px; display: flex; gap: 8px">
<sc-for list="{{thumbs}}" as="t" hint-placeholder-count="3">
<button type="button" class="{{t.cls}}" onClick="{{t.pick}}">{{t.num}}</button>
</sc-for>
</div>
</sc-if>
</div>
<sc-if value="{{panelOpen}}" hint-placeholder-val="{{ true }}">
<div class="sm-resize" onMouseDown="{{startResize}}" title="Drag to resize"></div>
<div class="sm-panel {{panelWidthClass}}" style="flex-shrink: 0; height: 100%; box-sizing: border-box; border-left: 1px solid #2A2A2A; background: #111113; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-bottom: 1px solid #2A2A2A">
<a class="sm-btn" href="/Main.dc.html" aria-label="Back to the story map">← Story map</a>
<div style="flex-grow: 1"></div>
<button type="button" class="sm-btn" onClick="{{collapseAll}}">Collapse all</button>
<button type="button" class="sm-btn" onClick="{{reset}}">Reset</button>
<button type="button" class="sm-btn" onClick="{{next}}">Play next</button>
<button type="button" class="sm-btn" aria-label="Hide the story map" onClick="{{hidePanel}}">»</button>
</div>
<div style="display: flex; flex-direction: column; gap: 0; padding: 8px; overflow-y: auto; flex: 1 1 auto; min-height: 0">

</div>
</div>

</div>

area.remove();
};
