<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chat Pilot</title>
<style>
  :root { --bg: #fff; --fg: #1c1c1c; --line: #d5d5d5; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1c1c; --fg: #eee; --line: #444; } }
  body { background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; }
  button { font: inherit; padding: 8px 14px; margin-right: 8px; }
  pre { border: 1px solid var(--line); padding: 12px; overflow-x: auto; }
</style>
</head>
<body>
<h1>Chat pilot</h1>
<p>Chat: <span id="chat">none registered yet</span></p>
<p>
  <button id="submit" disabled>Submit to chat</button>
  <button id="fill" disabled>Fill prompt box</button>
</p>
<pre id="events">No events yet.</pre>
<script>
  let chat = null;
  async function press(mode) {
    await fetch('/press', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ mode, chat }) });
    refresh();
  }
  async function refresh() {
    const status = await (await fetch('/status')).json();
    chat = status.chats[0] ?? null;
    document.getElementById('chat').textContent = chat ?? 'none registered yet';
    for (const id of ['submit', 'fill']) document.getElementById(id).disabled = !chat;
    if (status.events.length) document.getElementById('events').textContent = status.events.map(e => JSON.stringify(e)).join('\n');
  }
  document.getElementById('submit').onclick = () => press('submit');
  document.getElementById('fill').onclick = () => press('fill');
  refresh();
  setInterval(refresh, 1000);
</script>
</body>
</html>
