    OOAD analysis template — one class (and its subtypes/collaborators) per file.

    Three fidelity sections are shown in shape order. A real output fills in only
    the section that matches the generator's fidelity argument; delete the others.

    Fidelity notations mirror the DDD phase templates minus DDD-specific vocabulary
    (no Key Abstractions, no Modules, no Core/Boundary Domain, no Entity /
    ValueObject stereotypes). OOAD is domain-agnostic.

    Language:      prose blocks. No types, no signatures, no relationship kinds.
    Model:         compact typed block. ClassName(Type) header, dash separators.
                   - prefix for private, no + prefix on public.
    Specification: + prefix on public, composition or aggregation or association
                   on relationship properties, Invariant: and Interaction: blocks.

    Class member format (model & specification):
      ------  (six dashes)   constructor / properties separator
      ----    (four dashes)  properties / operations separator
      -       (dash prefix)  private operation
      +       (plus prefix)  public — specification fidelity only

    Subtypes use ### **Child : Parent** notation; deltas only.

    # {ClassName}

    ## Language fidelity

    *{ClassName}* is {intent}

    ### {class_name_as_a_concept}

    - {bullet telling part of the story}
    - {as many bullets as the concept warrants}
    - **Invariant:** {rule that must always hold}

    ### {SubtypeName} *is a type of* {ClassName}

    - {delta behavior only}

    ### {property_with_own_behavior_or_invariant}

    - {behavior or invariant that earns this property its own heading}
    - **Invariant:** {rule}

    ---

    ## Model fidelity

    ### **{ClassName}**

    {ClassName}({Type}, {Type})
    ------
    {propertyName}: {Type}
        Invariant: {rule}
    {anotherProperty}: {Type}
    ----
    {operationName}({Type}): {ReturnType}
        {CollaboratorType}
        Invariant: {rule}
    {anotherOperation}(): void
    - {privateHelper}({Type}): {Type}

    ### **{ChildClass} : {ParentClass}**

    {ChildClass}({Type})
    ------
    ----
    {deltaOperation}({Type}): {ReturnType}
        Invariant: {rule specific to this subtype}

    ---

    ## Specification fidelity

    ### **{ClassName}**

    + {ClassName}({param}: {Type})
    ------
    + {property}: {Type}
        Invariant: {rule}
    + << composition >> {ownedProperty}: {Type}
    + << aggregation >> {collectedProperty}: list[{Type}]
    + << association >> {referencedProperty}: {Type}
    ----
    + {operation}({param}: {Type}): {ReturnType}
        Invariant: {rule}
        Interaction:
            {variable}: {Type} = {other}.{call}({args})
            return {variable}
    - _{privateHelper}({param}: {Type}): {Type}

    ### **{ChildClass} : {ParentClass}**

    + {ChildClass}({param}: {Type})
    ------
    + {childSpecificProperty}: {Type}
        Invariant: {rule}


