  \ when attributes change? Identity transcends attributes — not \"importance.\" |\n\
  | **Value Object** | Fully described by values — interchangeable, replaceable, immutable?\
  \ Prefer VO unless tracked identity is required. |\n| **Repository** | How does\
  \ the business find, store, and retire this aggregate? Collection-style seam only\
  \ here. |\n| **Factory** | Complex birth / invariants at creation / subtype choice?\
  \ |\n| **Service** | Homeless operation — placing it on a concept would distort\
  \ that concept? Stateless, domain-named. |\n| **Domain Event** | Significant past-tense\
  \ moment — trigger and consumers as invariants; payload as properties. Facts, not\
  \ commands. |\n| **Specification** | Named, reusable true/false business rule (query\
  \ / validate / construct)? |\n\nHonour aggregate boundaries from bounded_context;\
  \ do not redraw by relatedness. Same class shape as clean_engineering — stereotypes\
  \ layered on. Every source concept classified (or Unresolved) with supporting model\
