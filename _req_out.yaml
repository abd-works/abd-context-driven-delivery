  \n**Default format:** markdown\n\n**Goal:** Draw context boundaries, dependency\
  \ arcs, and the aggregates that protect invariants — naming everything in the experts'\
  \ vocabulary.\n\nA **bounded context** is an explicitly set boundary in which a\
  \ model applies and is managed to be uniform — organizational (owning team) and\
  \ implementation (codebase / deployable). Within it, every term has one meaning.\
  \ Across boundaries, the same word may mean different things.\n\nFailure modes:\
  \ **duplicate concepts** (same real-world thing modeled twice) and **false cognates**\
  \ (same term, different meaning).\n\n**Context map:** identify contexts → name them\
  \ → describe contact points with translation.\n\n**What gets tracked on a dependency:**\
  \ direction (upstream/downstream/mutual, naming both sides); what crosses (concepts\
  \ + translation); how they integrate — name the concrete mechanism and call site\
  \ (e.g. synchronous call to `Catalog.Product.unit_price` at `add_item`, domain event\
  \ `PriceChanged`, nightly batch extract). Categories like Events / Messaging / REST/API\
  \ / Batch / Shared DB / File Transfer / Shared Kernel help, but \"in-process\" or\
  \ \"module seam\" alone is not enough; relationship pattern from the catalogue below.\
  \ Undecided items get owner + target date.\n\n**Patterns:** Shared Kernel (shared\
  \ subset, consult on change); Customer/Supplier (one-way, joint acceptance tests);\
  \ Conformist (downstream adopts upstream); Anticorruption Layer (translate/isolate\
  \ legacy); Open Host / Published Language (published protocol); Separate Ways (no\
  \ integration). No ad hoc labels like \"loose coupling.\"\n\n**Boundary heuristics:**\
  \ larger vs smaller (~ten people upper bound); external systems usually Separate\
  \ Ways / Conformist / ACL; formalize informal internal sharing; transform boundaries\
  \ with clear current/end state.\n\nAn **Aggregate** is a cluster treated as a single\
  \ unit for data changes — one **root** Entity, a **boundary**, and the invariants\
  \ that boundary protects. Decide aggregates here, with context_tools. Boundaries\
  \ exist for invariant protection, not relatedness; keep aggregates small.\n\nAsk:\
  \ what must be consistent in one transaction? what can tolerate lag? cost of brief\
  \ inconsistency? who is the single access point (root)?\n\n**Cross-aggregate:**\
  \ when roots reference by ID — if A changes, does B need to know and how soon (immediate\
  \ / eventual / snapshot)? copy or reference? what does the business do today? Outside\
  \ the boundary, only through the root.\n\n**Input traps:** hidden coupling; ownership\
  \ ambiguity; false cognates; missing unnamed contexts; unclear direction.\n\n**Produce:**\
  \ one `bounded-context-map.md` — inventory, dependencies, aggregates per context\
  \ (root, members, invariants, cross-agg consistency); every inventoried context\
  \ on an arc or declared standalone. Fill `templates/bounded-context-template.md`.\
  \ Call clean_engineering at **modules**.\n\n**Rules:**\n\n- **`experts-words-preferred`**\
  \ — Prefer the words domain experts use; do not invent technical synonyms when a\
  \ domain word already exists.\n- **`domain-concepts-not-technical-names`** — Every\
  \ class/module names a domain concept (or honest boundary collaborator). Reject\
  \ `Manager`, `Helper`, `Processor`, and similar layer names.\n- **`one-meaning-per-context`**\
  \ — Inside a context, one definition per term; false cognates across contexts are\
  \ named and translated.\n- **`dependency-fields-tracked`** — Every arc states direction\
  \ (named sides or mutual), what crosses, how they integrate (concrete mechanism),\
  \ and catalogue relationship pattern — or a dated follow-up with owner.\n- **`no-orphan-contexts`**\
  \ — Every inventoried context appears in a dependency arc or is declared standalone\
  \ with rationale.\n- **`aggregate-protects-invariants`** — Name root, members, and\
  \ the business invariants that require the boundary; do not cluster by relatedness\
  \ alone.\n- **`invariants-from-business-logic`** — Invariants come from domain rules\
  \ and expert statements, not convenient code shape.\n\n---\n\n## building_blocks\n\
  \n**Default format:** markdown\n\n**Goal:** Deepen the same context map — under\
