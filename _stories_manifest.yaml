```yaml
---
type: stories
capabilities:
- tool
- agent
signature:
  instructions: '# Instructions'
  read_manifest:
    kind: meta
    instructions: Get the latest manifest (this document).
    cmd: python -m tools manifest context_tools.stories.stories:Stories
    returns: manifest
  invoke:
    kind: meta
    instructions: Run one tool or action on a toolset instance.
    cmd: python -m tools run <request.yaml|->
  new:
    kind: constructor
    instructions: Create a toolset instance.
    parameters:
      fidelity: str
      format: str | None
      path: str | None
      session: str | None
      workspace: str | None
  close_session:
    kind: tool
    parameters:
      outcome: str
      handoff: str
    returns: str
  create_session:
    kind: tool
    parameters:
      name: str
      goal: str
      fidelities: str
      contexts: str
      path: str
    returns: str
  ensure_session:
    kind: tool
    parameters:
      name: str
      goal: str
      fidelities: str
      contexts: str
      path: str
    returns: str
  finish_eval_turn:
    kind: tool
    instructions: Close the open eval Turn at the chat-reply boundary (hook/host calls
      once).
    parameters:
      prompt: str
      result: str
      context: str
    returns: str
  log_correction:
    kind: tool
    parameters:
      entry_id: str
      improved: str
      status: str
    returns: str
  log_mistake:
    kind: tool
    parameters:
      artifact: str
      rule: str
      wrong: str
      original: str
      when: str
    returns: str
  read_context_index:
    kind: tool
    returns: str
  record_context_root:
    kind: tool
    parameters:
      root: str
      note: str
    returns: str
  scan:
    kind: tool
    parameters:
      paths: list[str]
    returns: str
  transform:
    kind: tool
    instructions: "Parse content from source_format into the canonical StoryMap, then\
      \ render into target_format.\n        All formatters are peer channels. Sideways\
      \ format move at the same fidelity.\n        At acceptance_tests fidelity: after\
      \ transforming story artifacts, call ce().transform() or ce().generate() to\
      \ produce matching production class code alongside the spec output."
    parameters:
      source_format: str
      target_format: str
      content: str
    returns: dict
  active:
    kind: resource
    type: Session
  mode:
    kind: resource
    type: str
  add_generate_header_to_generated:
    kind: action
    tools: []
    instructions: Prepend the following block verbatim as the very first lines of
      the file you are writing - before any imports, before any code.
    returns: str
  document:
    kind: action
    tools:
    - generate_output
    - add_generate_header_to_generated
    instructions: '# Document


      Take the persona of a **neutral observer** ΓÇö describe what exists, do not prescribe
      what should exist.


      1. Follow **`session_guidance`**. Observe and write under the session layout.

      2. Read the **contexts** to understand the vocabulary and structure of the domain.

      3. Fill the **template** scaffold with observed content ΓÇö describe current state
      only.

      4. Do not apply, suggest, or imply rules or best practices in the generated
      output.

      5. Call **`scan`** and append all violations to the document as-is ΓÇö flag them,
      do not correct them.

      6. Save the artifact under the session layout from `session_guidance`.'
    parameters:
      paths: list[str]
    returns: str
  generate:
    kind: action
    tools: []
    instructions: "Generate story artifacts at the current fidelity.\n        At story_map\
      \ fidelity: write the story map and thin-slice only.\n        At scenarios fidelity:\
      \ write main-flow scenarios (single or multiple per story) with optional variations;\
      \ use ExampleFactory fakes where available.\n        At acceptance_tests fidelity:\
      \ write *_spec and *_spec.{tier} acceptance test files. When spec files are\
      \ written, call ce().generate() to produce or update the matching production\
      \ class implementations and wire any supporting code changes."
    returns: str
  generate_fixes_from_validate:
    kind: action
    tools:
    - generate_output
    returns: str
  generate_output:
    kind: action
    tools: []
    returns: str
  grill:
    kind: action
    tools:
    - generate
    instructions: Grill then generate - pure grill loop, then the host generate body.
    returns: str
  improve:
    kind: action
    tools: []
    returns: str
  iterate:
    kind: action
    tools: []
    instructions: "Iterate then generate - grill + formal generate/validate/one-fix\
      \ ticks.\n        At acceptance_tests fidelity: after each spec cycle, call\
      \ ce().iterate() to wire the minimum production code until GREEN.\n        If\
      \ the same acceptance scenario is still RED after 2 consecutive fix attempts\
      \ ΓÇö stop guessing. Call diagnostic().diagnose() before a third fix (tier wiring,\
      \ stale Story constant, vocabulary drift, or transform that fixed the map while\
      \ the leaf still fails)."
    returns: str
  partition:
    kind: action
    tools: []
    parameters:
      context: str
      mode: str
      out_root: str | None
    returns: str
  repair:
    kind: sub_agent
    launch: non_blocking
    parameters:
      asset: str
      violation: str
    returns: str
  satisfy:
    kind: action
    tools: []
    instructions: "Find and fix every problem in the story artifacts under the session\
      \ root.\n        At acceptance_tests fidelity: after fixing specs, call ce().satisfy()\
      \ to keep matching production implementations GREEN.\n        If the same acceptance\
      \ scenario is still RED after 2 consecutive fix attempts ΓÇö stop guessing. Call\
      \ diagnostic().diagnose() before a third fix (tier wiring, stale Story constant,\
      \ vocabulary drift, or transform that fixed the map while the leaf still fails)."
    returns: str
  sketch:
    kind: action
    tools:
    - generate
    instructions: Sketch then generate - grill + sketch cadence, then the host generate
      body.
    returns: str
  validate:
    kind: action
    tools: []
    instructions: '# Validate


      Take the persona of a **critical judge** ΓÇö do not edit the artifact.


      1. Follow **`session_guidance`**. Scope judgment to artifacts under `session.path`
      / the session layout.

      2. Use **contexts** as the rubric ΓÇö report pass/fail per named context and named
      rule with brief evidence.

      3. Call **`scan`** on the session-rooted paths under review.

      4. Do not fix. Report failures for fixing, then **validate** again when ready.


      ---'
    returns: str
  archive_mistakes:
    kind: sub_agent
    launch: non_blocking
    parameters:
      repo_root: str
    returns: str
  verify_regression:
    kind: sub_agent
    launch: non_blocking
    parameters:
      examples_root: str
    returns: str
---
```
