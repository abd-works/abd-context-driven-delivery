---
type: bdd
capabilities:
- tool
- agent
signature:
  instructions: "# Instructions\n\n    Depends on CleanEngineering (lazy import in\
    \ ce() and transform to avoid circular imports at\n    module load time)."
  read_manifest:
    kind: meta
    instructions: Author/hook only. Agents must not remanifest — use the slash/skill
      catalog and pipe the fence to tools.ps1 run -.
    cmd: python -m tools manifest context_tools.bdd.bdd:Bdd
    returns: manifest
  invoke:
    kind: meta
    instructions: Pipe the YAML fence to stdin from the repo root. Do not write a
      request file. Follow response.instructions only.
    cmd: .\tools.ps1 run -
  new:
    kind: constructor
    instructions: Create a toolset instance.
    parameters:
      fidelity: str
      format: str | None
      path: str | None
      session: str | None
      workspace: str | None
  load_template:
    kind: tool
    instructions: "Return the template content for the given format and fidelity.\n\
      \n        Pass the format you are about to generate (e.g. ``typescript``,\n\
      \        ``python``, ``markdown``) and the fidelity (e.g. ``story_map``,\n \
      \       ``scenarios``, ``code``).  Template lines and files are filtered to\n\
      \        only those annotated for the requested fidelity.  Falls back to the\n\
      \        instance's active format/fidelity when not given."
    parameters:
      format: str
      fidelity: str
    returns: str
  render:
    kind: tool
    instructions: Render already-generated BDD output into ``format`` via CleanEngineering
      channels.
    parameters:
      format: str
      content: str
    returns: dict
  transform:
    kind: tool
    instructions: "Sideways format conversion at the same fidelity.\n        Delegates\
      \ to clean_engineering.transform until BDD has its own channel model."
    parameters:
      source_format: str
      target_format: str
      content: str
    returns: TransformResult
  active:
    kind: resource
    type: WorkSession | None
  mode:
    kind: resource
    type: str
  guidance:
    kind: action
    tools: []
    instructions: "Provide guidance for creating behavior skeletons and development\
      \ tests.\n        At modules fidelity: no BDD spec file is written — bootstrap\
      \ CE class structure via the companion.\n        At behavior fidelity: write\
      \ all BDD test signatures (SIGNATURE markers).\n        At development fidelity:\
      \ write full test bodies and production code.\n        When the target module\
      \ already exists, scan the production source for every public method and property\
      \ and verify each has test coverage — add missing signatures for any gap before\
      \ writing new ones.\n        BDD tests must conform to CE class structure: describe/it\
      \ hierarchies must map onto public CE interfaces and operations.\n        When\
      \ this BDD work is done, call guidance on the Clean Engineering companion and\
      \ pass that companion to this action as a separate tools run. The action already\
      \ knows what to do for every tool. Do not inline."
    returns: str
---
