---
type: bdd
capabilities:
- tool
- agent
signature:
  instructions: "# Instructions\n\n    Depends on CleanEngineering (lazy import in\
    \ ce() and transform to avoid circular imports at\n    module load time)."
  read_manifest:
    kind: meta
    instructions: Get the latest manifest (this document).
    cmd: python -m tools manifest context_tools.bdd.bdd:Bdd
    returns: manifest
  invoke:
    kind: meta
    instructions: Run one tool or action on a toolset instance.
    cmd: python -m tools run <request.yaml|->
  new:
    kind: constructor
    instructions: Create a toolset instance.
    parameters:
      fidelity: str
      format: str | None
      path: str | None
      session: str | None
      workspace: str | None
  begin_eval_turn:
    kind: tool
    instructions: Open the eval Turn. Listed on generate / validate / document / partition
      / repair / createRule.
    returns: str
  close_session:
    kind: tool
    parameters:
      outcome: str
      handoff: str
    returns: str
  finish_eval_turn:
    kind: tool
    instructions: Close the open eval Turn. Listed on generate / validate / document
      / partition / repair / createRule.
    parameters:
      prompt: str
      result: str
      context: str
    returns: str
  log_correction:
    kind: tool
    instructions: log_correction ΓÇö Correction.apply through Repair; writes repairedAsset
      and improvement.md.
    parameters:
      entry_id: str
      improved: str
      how: str
      status: str
    returns: str
  open:
    kind: tool
    instructions: '# Open


      One tool before lifecycle work ΓÇö ensures sprint, loads context index, records
      root when keyed. See **Session Guidance** (`session_guidance`). Do not chain
      `ensure_session`, `read_context_index`, or `record_context_root` when `open`
      is in the tool list.


      ```yaml

      tool: open

      ```


      ---'
    parameters:
      name: str
      goal: str
      fidelities: str
      contexts: str
      path: str
    returns: str
  render:
    kind: tool
    instructions: Render already-generated BDD output into ``format`` via CleanEngineering
      channels.
    parameters:
      format: str
      content: str
    returns: dict
  scan:
    kind: tool
    parameters:
      paths: list[str]
    returns: str
  transform:
    kind: tool
    instructions: "Sideways format conversion at the same fidelity.\n        Delegates\
      \ to clean_engineering.transform until BDD has its own channel model."
    parameters:
      source_format: str
      target_format: str
      content: str
    returns: TransformResult
  active:
    kind: resource
    type: Session
  mode:
    kind: resource
    type: str
  add_generate_header_to_generated:
    kind: action
    tools: []
    instructions: Prepend the following block verbatim as the very first lines of
      the file you are writing - before any imports, before any code.
    returns: str
  createRule:
    kind: action
    tools:
    - begin_eval_turn
    - finish_eval_turn
    instructions: '# Create Rule


      One action. Do not call this if **scan** already reports a failure that matches
      the mistake. Do not call this to mint a ban-list rule for a one-off invented
      shape, or until you have checked that the existing **contexts**, **examples**,
      **template**, and generator/seed cannot steer the failure.


      Take **failed** (what went wrong on the asset) and **wanted** (what should have
      happened). Using **contexts**, **examples**, and **template**, evaluate a new
      named rule and a matching scanner that can detect that failure deterministically
      ΓÇö only when the failure is mechanical and that existing surface cannot carry
      it.


      Write the rule and the scanner into **this tool** (the context tool''s own guidance
      and `scanners/`). Then **run that rule** via **scan** on the asset and **detect
      a failure that matches the mistake**. If scan is clean, or the failures are
      not this mistake, the rule/scanner is not done.

      '
    parameters:
      failed: str
      wanted: str
    returns: str
  document:
    kind: action
    tools:
    - open
    - begin_eval_turn
    - generate_output
    - add_generate_header_to_generated
    - finish_eval_turn
    instructions: '# Document


      Take the persona of a **neutral observer** ΓÇö describe what exists, do not prescribe
      what should exist.


      1. Follow **`session_guidance`**. Observe and write under the session layout.

      2. Read the **contexts** to understand the vocabulary and structure of the domain.

      3. Fill the **template** scaffold with observed content ΓÇö describe current state
      only.

      4. Do not apply, suggest, or imply rules or best practices in the generated
      output.

      5. Call **`scan`** and append all violations to the document as-is ΓÇö flag them,
      do not correct them.

      6. Save the artifact under the session layout from `session_guidance`.

      7. **Live-app wraps.** DDD `/document` defaults the working area to `domain/`
      (overridable via `path` or `default_workspace_folder`). Put wraps under `{bounded-context}/{aggregate}/`
      as `{class}.ts` + `{class}.{tier}.ts` + `stubs/{system}/`. **Generate** may
      still use `src/`.


      ---'
    parameters:
      paths: list[str]
    returns: str
  generate:
    kind: action
    tools: []
    instructions: "At modules fidelity: delegate entirely to ce().generate() ΓÇö no\
      \ BDD spec file is written at this stage. Use this to bootstrap CE class structure\
      \ before writing tests.\n        At behavior fidelity: write all BDD test signatures\
      \ (SIGNATURE markers).\n        At development fidelity: write full test bodies\
      \ and production code.\n        When the target module already exists, scan\
      \ the production source for every public method and property and verify each\
      \ has test coverage ΓÇö add missing signatures for any gap before writing new\
      \ ones.\n        BDD tests must conform to CE class structure: describe/it hierarchies\
      \ must map onto public CE interfaces and operations.\n        When BDD artifacts\
      \ are complete, call ce().generate() to produce the matching class skeletons."
    returns: str
  generate_fixes_from_validate:
    kind: action
    tools:
    - generate_output
    returns: str
  generate_output:
    kind: action
    tools: []
    returns: str
  grill:
    kind: action
    tools: []
    instructions: "Run the BDD grill loop to surface assumptions and gaps.\n     \
      \   When BDD grill is complete, call ce().grill() to do the same for the matching\
      \ classes."
    returns: str
  iterate:
    kind: action
    tools: []
    instructions: "Iterate one BDD cycle: write one test, confirm it is RED, then\
      \ call ce().iterate() to build the minimum production code until GREEN. Repeat\
      \ ΓÇö one test, one production change, one GREEN ΓÇö until all tests pass.\n   \
      \     If the same test is still RED after 2 consecutive fix attempts ΓÇö stop\
      \ guessing. Call diagnostic().diagnose() before a third fix (wrong exception,\
      \ wrong line, shifting failure mode, or a re-read of the code that does not\
      \ explain the failure)."
    returns: str
  partition:
    kind: action
    tools:
    - open
    - begin_eval_turn
    - finish_eval_turn
    parameters:
      context: str
      mode: str
      out_root: str | None
    returns: str
  repair:
    kind: action
    tools: []
    instructions: "Repair the BDD artifact that is failing or malformed.\n       \
      \ When the BDD artifact is clean, call ce().repair() to repair the matching\
      \ class artifact."
    returns: str
  satisfy:
    kind: action
    tools: []
    instructions: "When running the fixing part of Satisfy, make sure that you create\
      \ a breaking test that fails first (RED), and then fix the code.\n        When\
      \ BDD violations are resolved, call ce().satisfy() to do the same for the matching\
      \ classes.\n        If the same test keeps failing, call diagnostic().diagnose()."
    returns: str
  sketch:
    kind: action
    tools: []
    instructions: "Sketch the BDD hierarchy at the current fidelity.\n        When\
      \ BDD sketch is complete, call ce().sketch() to sketch the matching classes."
    returns: str
  validate:
    kind: action
    tools: []
    instructions: "Validate all BDD artifacts at the current fidelity.\n        When\
      \ BDD validation passes, call ce().validate() to validate the matching class\
      \ artifacts."
    returns: str
  log_mistake:
    kind: sub_agent
    launch: non_blocking
    instructions: log_mistake ΓÇö records through Repair onto session.yaml and session/mistakes/.
    parameters:
      artifact: str
      rule: str
      wrong: str
      original: str
      when: str
    returns: str
---

