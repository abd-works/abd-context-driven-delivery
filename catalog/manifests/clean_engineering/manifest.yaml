---
type: cleanengineering
capabilities:
- tool
- agent
signature:
  instructions: '# Instructions'
  read_manifest:
    kind: meta
    instructions: Get the latest manifest (this document).
    cmd: python -m tools manifest context_tools.clean_engineering.clean_engineering:CleanEngineering
    returns: manifest
  invoke:
    kind: meta
    instructions: Run one tool or action on a toolset instance.
    cmd: python -m tools run <request.yaml|->
  new:
    kind: constructor
    instructions: Create a toolset instance.
    parameters:
      fidelity: str
      format: str | None
      path: str | None
      session: str | None
      workspace: str | None
  close_session:
    kind: tool
    parameters:
      outcome: str
      handoff: str
    returns: str
  create_session:
    kind: tool
    parameters:
      name: str
      goal: str
      fidelities: str
      contexts: str
      path: str
    returns: str
  ensure_session:
    kind: tool
    parameters:
      name: str
      goal: str
      fidelities: str
      contexts: str
      path: str
    returns: str
  finish_eval_turn:
    kind: tool
    instructions: Close the open eval Turn at the chat-reply boundary (hook/host calls
      once).
    parameters:
      prompt: str
      result: str
      context: str
    returns: str
  log_correction:
    kind: tool
    parameters:
      entry_id: str
      improved: str
      status: str
    returns: str
  log_mistake:
    kind: tool
    parameters:
      artifact: str
      rule: str
      wrong: str
      original: str
      when: str
    returns: str
  read_context_index:
    kind: tool
    returns: str
  record_context_root:
    kind: tool
    parameters:
      root: str
      note: str
    returns: str
  scan:
    kind: tool
    parameters:
      paths: list[str]
    returns: str
  transform:
    kind: tool
    instructions: "Parse content from source_format into the canonical model, then\
      \ render into target_format.\n        Supported transform channels: markdown,\
      \ json, python, typescript, java, javascript, drawio.\n        drawio auto-selects\
      \ modules view (system-context style) vs UML class view from model content.\n\
      \        When target_format is drawio and keep_positioning is true, pass previous\
      \ Draw.io XML\n        (or leave previous empty and use drawio.render / create_diagram\
      \ with a path) so existing\n        class positions and relationship routing\
      \ are kept; only new classes/edges are laid out.\n        For a persisted class\
      \ diagram with layout scan/repair, use ``drawio.render`` (via generate when\
      \ format is drawio) instead of transform alone.\n        Moves content sideways\
      \ between formats at the same fidelity - no analytical upgrade."
    parameters:
      source_format: str
      target_format: str
      content: str
      previous: str
      keep_positioning: bool
    returns: dict
  active:
    kind: resource
    type: Session
  mode:
    kind: resource
    type: str
  add_generate_header_to_generated:
    kind: action
    tools: []
    instructions: Prepend the following block verbatim as the very first lines of
      the file you are writing - before any imports, before any code.
    returns: str
  document:
    kind: action
    tools:
    - generate_output
    - add_generate_header_to_generated
    instructions: '# Document


      Take the persona of a **neutral observer** — describe what exists, do not prescribe
      what should exist.


      1. Follow **`session_guidance`**. Observe and write under the session layout.

      2. Read the **contexts** to understand the vocabulary and structure of the domain.

      3. Fill the **template** scaffold with observed content — describe current state
      only.

      4. Do not apply, suggest, or imply rules or best practices in the generated
      output.

      5. Call **`scan`** and append all violations to the document as-is — flag them,
      do not correct them.

      6. Save the artifact under the session layout from `session_guidance`.'
    parameters:
      paths: list[str]
    returns: str
  generate:
    kind: action
    tools:
    - generate_output
    - add_generate_header_to_generated
    instructions: "# Generate\n\n1. Follow **`session_guidance`** and the session\
      \ tools (`read_context_index`, `record_context_root`, `create_session` when\
      \ needed). Resolve workspace + tool root, then use the **`active`** resource\
      \ for `active.path` / `active.folder`.\n2. **MUST — prove-read before asking.**\
      \ Before any grill/iterate question (and before inventing options or story/module\
      \ names):\n   - Identify **every relevant context file referenced or implied**\
      \ by the decision — not one favorite type. Typical set: `{workspace}/.context/context-index.md`,\
      \ owning `*-segment.md`, `module-context.md`, session grill-answers / sketches\
      \ / handoff, peer story-context, build-order, and any path the plan or prior\
      \ answers cite. Include index/overlay only for structure hints; **never** treat\
      \ mid-epic stub columns as inventory.\n   - **Read each of those files with\
      \ the Read tool** (chunk through large ones). Grep, title lists, memory, or\
      \ primer-only skims **do not count**.\n   - **Prove it in the question turn:**\
      \ name the path(s) read and ground options in concrete terms from them. If you\
      \ cannot cite specifics from the relevant files, you have not read them — go\
      \ read before asking.\n   - Asking from a skim is a **defect**, same class as\
      \ dumping a whole artifact in one iterate tick.\n2b. **`do-not-invent-requirements`**\
      \ — Do not invent requirements, status/maintenance signals, or competing command\
      \ surfaces absent from source / the ask. Prefer the existing gap/fallback (or\
      \ the already-specified invoke surface) over minting a new state or a second\
      \ co-equal how-to-call block.\n3. **`sources-scoped-to-generated-context`**\
      \ — Hang `**Sources / context:**` on the node they ground: epic / sub-epic /\
      \ feature / module, or a lower item (scenario, class, screen, component, …).\
      \ Root or parent-level Sources are fine when those files apply to the **entire**\
      \ artifact or subtree.\n4. Apply all guidance and named rules in each **context**\
      \ — each bullet is a requirement.\n5. Match **examples** for shape, depth, and\
      \ tone.\n6. Fill the **template** scaffold and save the artifact under the session\
      \ layout from `session_guidance`.\n7. Follow any extra build steps included\
      \ in your instructions when present.\n8. Run **validate**. If it fails, fix\
      \ the artifact and **validate** again until it passes.\n\n---"
    returns: str
  generate_fixes_from_validate:
    kind: action
    tools:
    - generate_output
    returns: str
  generate_output:
    kind: action
    tools: []
    instructions: "Write the fidelity artifact under the session.\n\n        When\
      \ ``format`` is ``drawio``, call ``drawio.render`` (create diagram →\n     \
      \   scan layout rules in drawio contexts → repair sub-agent on definitive\n\
      \        layout failures). Otherwise produce the active channel output\n   \
      \     (markdown / python / …) from contexts, examples, and templates — do\n\
      \        not invoke drawio.render."
    returns: str
  grill:
    kind: action
    tools:
    - generate
    instructions: Grill then generate - pure grill loop, then the host generate body.
    returns: str
  improve:
    kind: action
    tools: []
    returns: str
  iterate:
    kind: action
    tools:
    - generate
    instructions: Iterate then generate - grill + formal generate/validate/one-fix
      ticks.
    returns: str
  partition:
    kind: action
    tools: []
    parameters:
      context: str
      mode: str
      out_root: str | None
    returns: str
  repair:
    kind: sub_agent
    launch: non_blocking
    parameters:
      asset: str
      violation: str
    returns: str
  satisfy:
    kind: action
    tools:
    - validate
    - generate_fixes_from_validate
    instructions: '# Satisfy


      Satisfy runs in **tool mode**: it does not inline a recipe. It hands you two
      tool calls to make yourself, in order — first find the problems, then fix them.


      1. **`validate`** — run this first. Judge the artifact under the generator **`active`**
      root against the **contexts** and every named rule, and call **`scan`** on the
      session-rooted paths. Produce the full list of violations and coverage gaps.
      Do not fix anything in this step.

      2. **`generate_fixes_from_validate`** — run this second, once you hold the validate
      report. Follow **`session_guidance`** and edit only under that layout. Generate
      any missing artifacts (a missing `.context/module-context.md` IS a violation
      — create it at the current fidelity: thin at modules with Purpose, Seam, Dependencies;
      full at model with + Primary use case, Rationale, Public API), then fix every
      reported violation in the same paths — do not invent a divergent folder.


      When done, run **`validate`** again and repeat the two-call loop until it passes.


      ---'
    returns: str
  sketch:
    kind: action
    tools:
    - generate
    instructions: Sketch then generate - grill + sketch cadence, then the host generate
      body.
    returns: str
  validate:
    kind: action
    tools: []
    instructions: '# Validate


      Take the persona of a **critical judge** — do not edit the artifact.


      1. Follow **`session_guidance`**. Scope judgment to artifacts under `session.path`
      / the session layout.

      2. Use **contexts** as the rubric — report pass/fail per named context and named
      rule with brief evidence.

      3. Call **`scan`** on the session-rooted paths under review.

      4. Do not fix. Report failures for fixing, then **validate** again when ready.


      ---'
    returns: str
  archive_mistakes:
    kind: sub_agent
    launch: non_blocking
    parameters:
      repo_root: str
    returns: str
  verify_regression:
    kind: sub_agent
    launch: non_blocking
    parameters:
      examples_root: str
    returns: str
---
