---
type: cleanengineering
capabilities:
- tool
- agent
signature:
  instructions: '# Instructions'
  read_manifest:
    kind: meta
    instructions: Author/hook only. Agents must not remanifest — use the slash/skill catalog and pipe the fence to tools.ps1 run -.
    cmd: python -m tools manifest context_tools.clean_engineering.clean_engineering:CleanEngineering
    returns: manifest
  invoke:
    kind: meta
    instructions: Pipe the YAML fence to stdin from the repo root. Do not write a request file. Follow response.instructions only.
    cmd: .\tools.ps1 run -
  new:
    kind: constructor
    instructions: Create a toolset instance.
    parameters:
      fidelity: str
      format: str | None
      path: str | None
      session: str | None
      workspace: str | None
  begin_turn:
    kind: tool
    instructions: Open a workspace turn on the current work session.
    parameters:
      action: str
    returns: str
  finish_turn:
    kind: tool
    instructions: Finish the open workspace turn; commits on the session branch when
      dirty.
    parameters:
      prompt: str
      result: str
      context: str
    returns: str
  record_correction:
    kind: tool
    instructions: Link a correction to mistake entry ids on the open turn.
    parameters:
      entry_id: str
      improved: str
      how: str
      status: str
      entry_ids: list[str] | None]
    returns: str
  record_mistake:
    kind: tool
    instructions: Annotate a mistake on the introducing commit (git-primary).
    parameters:
      artifact: str
      rule: str
      wrong: str
      original: str
      introducing_commit: str
      entry_id: str
      tool: str
      fidelity: str
    returns: str
  render:
    kind: tool
    instructions: Render already-generated output into ``format`` via channel parse/render.
    parameters:
      format: str
      content: str
      previous: str
      keep_positioning: bool
    returns: dict
  scan:
    kind: tool
    parameters:
      paths: list[str]
    returns: str
  transform:
    kind: tool
    instructions: "Parse content from source_format into the canonical model, then\
      \ render into target_format.\n        Supported transform channels: markdown,\
      \ json, python, typescript, java, javascript, drawio.\n        drawio auto-selects\
      \ modules view (system-context style) vs UML class view from model content.\n\
      \        When target_format is drawio and keep_positioning is true, pass previous\
      \ Draw.io XML\n        (or leave previous empty and use drawio.render / create_diagram\
      \ with a path) so existing\n        class positions and relationship routing\
      \ are kept; only new classes/edges are laid out.\n        For a persisted class\
      \ diagram with layout scan/repair, use ``drawio.render`` (via generate when\
      \ format is drawio) instead of transform alone.\n        Moves content sideways\
      \ between formats at the same fidelity - no analytical upgrade."
    parameters:
      source_format: str
      target_format: str
      content: str
      previous: str
      keep_positioning: bool
    returns: dict
  active:
    kind: resource
    type: WorkSession | None
  mode:
    kind: resource
    type: str
  add_generate_header_to_generated:
    kind: action
    tools: []
    instructions: Prepend the following block verbatim as the very first lines of
      the file you are writing - before any imports, before any code.
    returns: str
  createRule:
    kind: action
    tools: []
    instructions: '# Create Rule


      One action. Do not call this if **scan** already reports a failure that matches
      the mistake. Do not call this to mint a ban-list rule for a one-off invented
      shape, or until you have checked that the existing **contexts**, **examples**,
      **template**, and generator/seed cannot steer the failure.


      Take **failed** (what went wrong on the asset) and **wanted** (what should have
      happened). Using **contexts**, **examples**, and **template**, evaluate a new
      named rule and a matching scanner that can detect that failure deterministically
      â€” only when the failure is mechanical and that existing surface cannot carry
      it.


      Write the rule and the scanner into **this tool** (the context tool''s own guidance
      and `scanners/`). Then **run that rule** via **scan** on the asset and **detect
      a failure that matches the mistake**. If scan is clean, or the failures are
      not this mistake, the rule/scanner is not done.

      '
    parameters:
      failed: str
      wanted: str
    returns: str
  document:
    kind: action
    tools:
    - generate_output
    - add_generate_header_to_generated
    instructions: '# Document


      Take the persona of a **neutral observer** â€” describe what exists, do not prescribe
      what should exist.


      1. Follow **`session_guidance`**. Observe and write under the session layout.

      2. Read the **contexts** to understand the vocabulary and structure of the domain.

      3. Fill the **template** scaffold with observed content â€” describe current state
      only.

      4. Do not apply, suggest, or imply rules or best practices in the generated
      output.

      5. Call **`scan`** and append all violations to the document as-is â€” flag them,
      do not correct them.

      6. Save the artifact under the session layout from `session_guidance`.

      7. **Live-app wraps.** DDD `/document` defaults the working area to `domain/`
      (overridable via `path` or `default_workspace_folder`). Put wraps under `{bounded-context}/{aggregate}/`
      as `{class}.ts` + `{class}.{tier}.ts` + `stubs/{system}/`. **Generate** may
      still use `src/`.


      ---'
    parameters:
      paths: list[str]
    returns: str
  generate:
    kind: action
    tools:
    - generate_output
    - add_generate_header_to_generated
    instructions: "# Generate\n\n1. Call **`open`**. Confirm sprint slug with the\
      \ user when run context has no `session=`; pass `name` / `goal` / `fidelities`\
      \ on first create if needed. Follow **`session_guidance`**; use the **`active`**\
      \ resource for `active.path` / `active.folder`.\n2. **MUST â€” prove-read before\
      \ asking.** Before any grill/iterate question (and before inventing options\
      \ or story/module names):\n   - Identify **every relevant context file referenced\
      \ or implied** by the decision â€” not one favorite type. Typical set: `{workspace}/.context/context-index.md`,\
      \ owning `*-segment.md`, `module-context.md`, session grill-answers / sketches\
      \ / handoff, peer story-context, build-order, and any path the plan or prior\
      \ answers cite. Include index/overlay only for structure hints; **never** treat\
      \ mid-epic stub columns as inventory.\n   - **Read each of those files with\
      \ the Read tool** (chunk through large ones). Grep, title lists, memory, or\
      \ primer-only skims **do not count**.\n   - **Prove it in the question turn:**\
      \ name the path(s) read and ground options in concrete terms from them. If you\
      \ cannot cite specifics from the relevant files, you have not read them â€” go\
      \ read before asking.\n   - Asking from a skim is a **defect**, same class as\
      \ dumping a whole artifact in one iterate tick.\n2b. **`do-not-invent-requirements`**\
      \ â€” Do not invent requirements, status/maintenance signals, or competing command\
      \ surfaces absent from source / the ask. Prefer the existing gap/fallback (or\
      \ the already-specified invoke surface) over minting a new state or a second\
      \ co-equal how-to-call block.\n3. **`sources-scoped-to-generated-context`**\
      \ â€” Hang `**Sources / context:**` on the node they ground: epic / sub-epic /\
      \ feature / module, or a lower item (scenario, class, screen, component, â€¦).\
      \ Root or parent-level Sources are fine when those files apply to the **entire**\
      \ artifact or subtree.\n4. Apply all guidance and named rules in each **context**\
      \ â€” each bullet is a requirement.\n5. Match **examples** for shape, depth, and\
      \ tone.\n6. Fill the **template** scaffold and save the artifact under the session\
      \ layout from `session_guidance`.\n6b. **Large job â€” several turns.** Decide\
      \ the source from the **ask** and what this session already produced (a sketch,\
      \ a model, a format to transform â€” not a locked default). If that source is\
      \ a whole model, sketch, or similarly large artifact, implement **one slice**\
      \ in this invoke, then stop. `finish_turn` closes this turn. Continue in later\
      \ generate or iterate turns â€” even if the user asked for everything once. Filling\
      \ the whole artifact in one generate is a defect (same class as dumping a map\
      \ in one iterate tick). A small implied source may finish in one turn. Do not\
      \ treat a red full-tree **validate** as permission to finish the rest in this\
      \ invoke; validate the slice you wrote.\n7. Follow any extra build steps included\
      \ in your instructions when present.\n8. Run **validate** on what this turn\
      \ wrote. If the job is one slice, a remaining gap in the rest of the source\
      \ is the next turn, not this one. If the implied source was small enough for\
      \ one turn and validate fails, fix the artifact and **validate** again until\
      \ it passes.\n\n---"
    returns: str
  generate_fixes_from_validate:
    kind: action
    tools:
    - generate_output
    returns: str
  generate_output:
    kind: action
    tools: []
    instructions: "Write the fidelity artifact under the session.\n\n        When\
      \ ``format`` is ``drawio``, call ``drawio.render`` (create diagram â†’\n     \
      \   scan layout rules in drawio contexts â†’ repair sub-agent on definitive\n\
      \        layout failures). Otherwise produce the active channel output\n   \
      \     (markdown / python / â€¦) from contexts, examples, and templates â€” do\n\
      \        not invoke drawio.render."
    returns: str
  satisfy:
    kind: action
    tools:
    - validate
    - generate_fixes_from_validate
    instructions: '# Satisfy


      Satisfy runs in **tool mode**: it does not inline a recipe. It hands you two
      tool calls to make yourself, in order â€” first find the problems, then fix them.


      1. **`validate`** â€” run this first. Judge the artifact under the generator **`active`**
      root against the **contexts** and every named rule, and call **`scan`** on the
      session-rooted paths. Produce the full list of violations and coverage gaps.
      Do not fix anything in this step.

      2. **`generate_fixes_from_validate`** â€” run this second, once you hold the validate
      report. Follow **`session_guidance`** and edit only under that layout. Generate
      any missing artifacts (a missing `.context/module-context.md` IS a violation
      â€” create it at the current fidelity: thin at modules with Purpose, Seam, Dependencies;
      full at model with + Primary use case, Rationale, Public API), then fix every
      reported violation in the same paths â€” do not invent a divergent folder.


      When done, run **`validate`** again and repeat the two-call loop until it passes.


      ---'
    returns: str
  validate:
    kind: action
    tools: []
    instructions: '# Validate


      Take the persona of a **critical judge** â€” do not edit the artifact.


      1. Follow **`session_guidance`**. Scope judgment to artifacts under `session.path`
      / the session layout.

      2. Use **contexts** as the rubric â€” report pass/fail per named context and named
      rule with brief evidence.

      3. Call **`scan`** on the session-rooted paths under review.

      4. Do not fix. Report failures for fixing, then **validate** again when ready.


      ---'
    returns: str
---
