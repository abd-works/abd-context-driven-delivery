---
type: cleanengineering
capabilities:
- tool
- agent
signature:
  instructions: '# Instructions'
  read_manifest:
    kind: meta
    instructions: Author/hook only. Agents must not remanifest — use the slash/skill
      catalog and pipe the fence to tools.ps1 run -.
    cmd: python -m tools manifest context_tools.clean_engineering.clean_engineering:CleanEngineering
    returns: manifest
  invoke:
    kind: meta
    instructions: Pipe the YAML fence to stdin from the repo root. Do not write a
      request file. Follow response.instructions only.
    cmd: .\tools.ps1 run -
  new:
    kind: constructor
    instructions: Create a toolset instance.
    parameters:
      fidelity: str
      format: str | None
      path: str | None
      session: str | None
      workspace: str | None
  load_template:
    kind: tool
    instructions: "Return the template content for the given format and fidelity.\n\
      \n        Pass the format you are about to generate (e.g. ``typescript``,\n\
      \        ``python``, ``markdown``) and the fidelity (e.g. ``story_map``,\n \
      \       ``scenarios``, ``code``).  Template lines and files are filtered to\n\
      \        only those annotated for the requested fidelity.  Falls back to the\n\
      \        instance's active format/fidelity when not given."
    parameters:
      format: str
      fidelity: str
    returns: str
  render:
    kind: tool
    instructions: Render already-generated output into ``format`` via channel parse/render.
    parameters:
      format: str
      content: str
      previous: str
      keep_positioning: bool
    returns: dict
  transform:
    kind: tool
    instructions: "Parse content from source_format into the canonical model, then\
      \ render into target_format.\n        Supported transform channels: markdown,\
      \ json, python, typescript, java, javascript, drawio.\n        drawio auto-selects\
      \ modules view (system-context style) vs UML class view from model content.\n\
      \        When target_format is drawio and keep_positioning is true, pass previous\
      \ Draw.io XML\n        (or leave previous empty and use drawio.render / create_diagram\
      \ with a path) so existing\n        class positions and relationship routing\
      \ are kept; only new classes/edges are laid out.\n        For a persisted class\
      \ diagram with layout scan/repair, use ``drawio.render`` (via generate when\
      \ format is drawio) instead of transform alone.\n        Moves content sideways\
      \ between formats at the same fidelity - no analytical upgrade."
    parameters:
      source_format: str
      target_format: str
      content: str
      previous: str
      keep_positioning: bool
    returns: dict
  active:
    kind: resource
    type: WorkSession | None
  mode:
    kind: resource
    type: str
  generate_output:
    kind: action
    tools: []
    instructions: "Write the fidelity artifact under the session.\n\n        When\
      \ ``format`` is ``drawio``, call ``drawio.render`` (create diagram →\n     \
      \   scan layout rules in drawio contexts → repair sub-agent on definitive\n\
      \        layout failures). Otherwise produce the active channel output\n   \
      \     (markdown / python / …) from contexts, examples, and templates — do\n\
      \        not invoke drawio.render."
    returns: str
  guidance:
    kind: action
    tools: []
    instructions: Provide guidance for creating OO modules, models, and code.
    returns: str
---
