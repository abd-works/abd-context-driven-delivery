---
type: ddd
capabilities:
- tool
- agent
signature:
  instructions: "# Instructions\n\n    Depends on CleanEngineering (lazy import in\
    \ ce() and transform to avoid circular imports at\n    module load time)."
  read_manifest:
    kind: meta
    instructions: Get the latest manifest (this document).
    cmd: python -m tools manifest context_tools.ddd.ddd:Ddd
    returns: manifest
  invoke:
    kind: meta
    instructions: Run one tool or action on a toolset instance.
    cmd: python -m tools run <request.yaml|->
  new:
    kind: constructor
    instructions: Create a toolset instance.
    parameters:
      fidelity: str
      format: str | None
      path: str | None
      session: str | None
      workspace: str | None
  apply_document_workspace_default:
    kind: tool
    instructions: "Set the durable working area to `domain/` for /document.\n\n  \
      \      Does not change CleanEngineering's own default folder. Skip when `path`\n\
      \        was passed or `default_workspace_folder` is already not the generate\n\
      \        default (`src`). Returns the working path in force."
    returns: str
  begin_eval_turn:
    kind: tool
    instructions: Open the eval Turn. Listed on generate / validate / document / partition
      / repair / createRule.
    returns: str
  close_session:
    kind: tool
    parameters:
      outcome: str
      handoff: str
    returns: str
  finish_eval_turn:
    kind: tool
    instructions: Close the open eval Turn. Listed on generate / validate / document
      / partition / repair / createRule.
    parameters:
      prompt: str
      result: str
      context: str
    returns: str
  log_correction:
    kind: tool
    instructions: log_correction ΓÇö Correction.apply through Repair; writes repairedAsset
      and improvement.md.
    parameters:
      entry_id: str
      improved: str
      how: str
      status: str
    returns: str
  open:
    kind: tool
    instructions: '# Open


      One tool before lifecycle work ΓÇö ensures sprint, loads context index, records
      root when keyed. See **Session Guidance** (`session_guidance`). Do not chain
      `ensure_session`, `read_context_index`, or `record_context_root` when `open`
      is in the tool list.


      ```yaml

      tool: open

      ```


      ---'
    parameters:
      name: str
      goal: str
      fidelities: str
      contexts: str
      path: str
    returns: str
  render:
    kind: tool
    instructions: Render already-generated DDD output into ``format`` via CleanEngineering
      channels.
    parameters:
      format: str
      content: str
    returns: dict
  scan:
    kind: tool
    parameters:
      paths: list[str]
    returns: str
  transform:
    kind: tool
    instructions: "Sideways format conversion at the same fidelity.\n        Delegates\
      \ to clean_engineering.transform - DDD adds no separate channel model."
    parameters:
      source_format: str
      target_format: str
      content: str
    returns: TransformResult
  active:
    kind: resource
    type: Session
  mode:
    kind: resource
    type: str
  add_generate_header_to_generated:
    kind: action
    tools: []
    instructions: Prepend the following block verbatim as the very first lines of
      the file you are writing - before any imports, before any code.
    returns: str
  createRule:
    kind: action
    tools:
    - begin_eval_turn
    - finish_eval_turn
    instructions: '# Create Rule


      One action. Do not call this if **scan** already reports a failure that matches
      the mistake. Do not call this to mint a ban-list rule for a one-off invented
      shape, or until you have checked that the existing **contexts**, **examples**,
      **template**, and generator/seed cannot steer the failure.


      Take **failed** (what went wrong on the asset) and **wanted** (what should have
      happened). Using **contexts**, **examples**, and **template**, evaluate a new
      named rule and a matching scanner that can detect that failure deterministically
      ΓÇö only when the failure is mechanical and that existing surface cannot carry
      it.


      Write the rule and the scanner into **this tool** (the context tool''s own guidance
      and `scanners/`). Then **run that rule** via **scan** on the asset and **detect
      a failure that matches the mistake**. If scan is clean, or the failures are
      not this mistake, the rule/scanner is not done.

      '
    parameters:
      failed: str
      wanted: str
    returns: str
  document:
    kind: action
    tools:
    - apply_document_workspace_default
    instructions: Default working folder is `domain/` unless path or folder was overridden.
    parameters:
      paths: list[str]
    returns: str
  generate:
    kind: action
    tools:
    - open
    - begin_eval_turn
    - generate_output
    - add_generate_header_to_generated
    - finish_eval_turn
    instructions: "# Generate\n\n1. Call **`open`**. Confirm sprint slug with the\
      \ user when run context has no `session=`; pass `name` / `goal` / `fidelities`\
      \ on first create if needed. Follow **`session_guidance`**; use the **`active`**\
      \ resource for `active.path` / `active.folder`.\n2. **MUST ΓÇö prove-read before\
      \ asking.** Before any grill/iterate question (and before inventing options\
      \ or story/module names):\n   - Identify **every relevant context file referenced\
      \ or implied** by the decision ΓÇö not one favorite type. Typical set: `{workspace}/.context/context-index.md`,\
      \ owning `*-segment.md`, `module-context.md`, session grill-answers / sketches\
      \ / handoff, peer story-context, build-order, and any path the plan or prior\
      \ answers cite. Include index/overlay only for structure hints; **never** treat\
      \ mid-epic stub columns as inventory.\n   - **Read each of those files with\
      \ the Read tool** (chunk through large ones). Grep, title lists, memory, or\
      \ primer-only skims **do not count**.\n   - **Prove it in the question turn:**\
      \ name the path(s) read and ground options in concrete terms from them. If you\
      \ cannot cite specifics from the relevant files, you have not read them ΓÇö go\
      \ read before asking.\n   - Asking from a skim is a **defect**, same class as\
      \ dumping a whole artifact in one iterate tick.\n2b. **`do-not-invent-requirements`**\
      \ ΓÇö Do not invent requirements, status/maintenance signals, or competing command\
      \ surfaces absent from source / the ask. Prefer the existing gap/fallback (or\
      \ the already-specified invoke surface) over minting a new state or a second\
      \ co-equal how-to-call block.\n3. **`sources-scoped-to-generated-context`**\
      \ ΓÇö Hang `**Sources / context:**` on the node they ground: epic / sub-epic /\
      \ feature / module, or a lower item (scenario, class, screen, component, ΓÇª).\
      \ Root or parent-level Sources are fine when those files apply to the **entire**\
      \ artifact or subtree.\n4. Apply all guidance and named rules in each **context**\
      \ ΓÇö each bullet is a requirement.\n5. Match **examples** for shape, depth, and\
      \ tone.\n6. Fill the **template** scaffold and save the artifact under the session\
      \ layout from `session_guidance`.\n7. Follow any extra build steps included\
      \ in your instructions when present.\n8. Run **validate**. If it fails, fix\
      \ the artifact and **validate** again until it passes.\n\n---"
    returns: str
  generate_fixes_from_validate:
    kind: action
    tools:
    - generate_output
    returns: str
  generate_output:
    kind: action
    tools: []
    instructions: When DDD scaffolding is ready, call ce().generate() for matching
      OO artifacts.
    returns: str
  grill:
    kind: action
    tools:
    - open
    - generate
    instructions: Grill then generate - pure grill loop, then the host generate body.
    returns: str
  iterate:
    kind: action
    tools:
    - open
    - generate
    instructions: Iterate then generate - grill + formal generate/validate/one-fix
      ticks.
    returns: str
  partition:
    kind: action
    tools:
    - open
    - begin_eval_turn
    - finish_eval_turn
    parameters:
      context: str
      mode: str
      out_root: str | None
    returns: str
  repair:
    kind: action
    tools:
    - scan
    - validate
    instructions: "Repair the DDD artifact that is failing or malformed.\n       \
      \ When the DDD artifact is clean, call ce().repair() to repair the matching\
      \ class artifact."
    parameters:
      asset: str
      violation: str
    returns: str
  satisfy:
    kind: action
    tools: []
    instructions: "Scan the production source for every public method and property;\
      \ flag any with no corresponding test as a coverage gap. Fix every BDD violation\
      \ and coverage gap ΓÇö confirm each failing test is RED for the right reason.\n\
      \        When BDD violations and coverage gaps are resolved, call ce().satisfy()\
      \ to build or fix the minimum production code until GREEN. One test, one production\
      \ change, one GREEN ΓÇö repeat until validate passes.\n        If the same test\
      \ is still RED after 2 consecutive fix attempts ΓÇö stop guessing. Call diagnostic().diagnose()\
      \ before a third fix (wrong exception, wrong line, shifting failure mode, or\
      \ a re-read of the code that does not explain the failure)."
    returns: str
  sketch:
    kind: action
    tools:
    - open
    - generate
    instructions: Sketch then generate - grill + sketch cadence, then the host generate
      body.
    returns: str
  validate:
    kind: action
    tools:
    - scan
    instructions: "Validate all DDD artifacts at the current fidelity.\n        When\
      \ DDD validation passes, call ce().validate() to validate the matching class\
      \ artifacts."
    returns: str
  log_mistake:
    kind: sub_agent
    launch: non_blocking
    instructions: log_mistake ΓÇö records through Repair onto session.yaml and session/mistakes/.
    parameters:
      artifact: str
      rule: str
      wrong: str
      original: str
      when: str
    returns: str
---

