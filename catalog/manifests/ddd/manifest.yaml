---
type: ddd
capabilities:
- tool
- agent
signature:
  instructions: "# Instructions\n\n    Depends on CleanEngineering (lazy import in\
    \ ce() and transform to avoid circular imports at\n    module load time)."
  read_manifest:
    kind: meta
    instructions: Author/hook only. Agents must not remanifest — use the slash/skill
      catalog and pipe the fence to tools.ps1 run -.
    cmd: python -m tools manifest context_tools.ddd.ddd:Ddd
    returns: manifest
  invoke:
    kind: meta
    instructions: Pipe the YAML fence to stdin from the repo root. Do not write a
      request file. Follow response.instructions only.
    cmd: .\tools.ps1 run -
  new:
    kind: constructor
    instructions: Create a toolset instance.
    parameters:
      fidelity: str
      format: str | None
      path: str | None
      session: str | None
      workspace: str | None
  apply_document_workspace_default:
    kind: tool
    instructions: "Set the durable working area to `domain/` for /document.\n\n  \
      \      Does not change CleanEngineering's own default folder. Skip when `path`\n\
      \        was passed or `default_workspace_folder` is already not the generate\n\
      \        default (`src`). Returns the working path in force."
    returns: str
  load_template:
    kind: tool
    instructions: "Return the template content for the given format and fidelity.\n\
      \n        Pass the format you are about to generate (e.g. ``typescript``,\n\
      \        ``python``, ``markdown``) and the fidelity (e.g. ``story_map``,\n \
      \       ``scenarios``, ``code``).  Template lines and files are filtered to\n\
      \        only those annotated for the requested fidelity.  Falls back to the\n\
      \        instance's active format/fidelity when not given."
    parameters:
      format: str
      fidelity: str
    returns: str
  render:
    kind: tool
    instructions: Render already-generated DDD output into ``format`` via CleanEngineering
      channels.
    parameters:
      format: str
      content: str
    returns: dict
  transform:
    kind: tool
    instructions: "Sideways format conversion at the same fidelity.\n        Delegates\
      \ to clean_engineering.transform - DDD adds no separate channel model."
    parameters:
      source_format: str
      target_format: str
      content: str
    returns: TransformResult
  active:
    kind: resource
    type: WorkSession | None
  mode:
    kind: resource
    type: str
  guidance:
    kind: action
    tools: []
    instructions: "Provide guidance for creating bounded contexts, building blocks,\
      \ and tactics.\n        When this DDD work is done, call guidance on the Clean\
      \ Engineering companion and pass that companion to this action as a separate\
      \ tools run. The action already knows what to do for every tool. Do not inline."
    returns: str
---
