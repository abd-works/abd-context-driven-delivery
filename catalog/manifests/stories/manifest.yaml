---
type: stories
capabilities:
- tool
- agent
signature:
  instructions: '# Instructions'
  read_manifest:
    kind: meta
    instructions: Author/hook only. Agents must not remanifest — use the slash/skill catalog and pipe the fence to tools.ps1 run -.
    cmd: python -m tools manifest context_tools.stories.stories:Stories
    returns: manifest
  invoke:
    kind: meta
    instructions: Pipe the YAML fence to stdin from the repo root. Do not write a request file. Follow response.instructions only.
    cmd: .\tools.ps1 run -
  new:
    kind: constructor
    instructions: Create a toolset instance.
    parameters:
      fidelity: str
      format: str | None
      path: str | None
      session: str | None
      workspace: str | None
  begin_turn:
    kind: tool
    instructions: Open a workspace turn on the current work session.
    parameters:
      action: str
    returns: str
  finish_turn:
    kind: tool
    instructions: Finish the open workspace turn; commits on the session branch when
      dirty.
    parameters:
      prompt: str
      result: str
      context: str
    returns: str
  record_correction:
    kind: tool
    instructions: Link a correction to mistake entry ids on the open turn.
    parameters:
      entry_id: str
      improved: str
      how: str
      status: str
      entry_ids: list[str] | None]
    returns: str
  record_mistake:
    kind: tool
    instructions: Annotate a mistake on the introducing commit (git-primary).
    parameters:
      artifact: str
      rule: str
      wrong: str
      original: str
      introducing_commit: str
      entry_id: str
      tool: str
      fidelity: str
    returns: str
  render:
    kind: tool
    instructions: Render already-generated story output into ``format`` via channel
      parse/render.
    parameters:
      format: str
      content: str
    returns: dict
  scan:
    kind: tool
    parameters:
      paths: list[str]
    returns: str
  transform:
    kind: tool
    instructions: "Parse content from source_format into the canonical StoryMap, then\
      \ render into target_format.\n        All formatters are peer channels. Sideways\
      \ format move at the same fidelity.\n        At acceptance_tests fidelity: after\
      \ transforming story artifacts, call ce().transform() or ce().generate() to\
      \ produce matching production class code alongside the spec output."
    parameters:
      source_format: str
      target_format: str
      content: str
    returns: dict
  active:
    kind: resource
    type: WorkSession | None
  mode:
    kind: resource
    type: str
  add_generate_header_to_generated:
    kind: action
    tools: []
    instructions: Prepend the following block verbatim as the very first lines of
      the file you are writing - before any imports, before any code.
    returns: str
  createRule:
    kind: action
    tools: []
    instructions: '# Create Rule


      One action. Do not call this if **scan** already reports a failure that matches
      the mistake. Do not call this to mint a ban-list rule for a one-off invented
      shape, or until you have checked that the existing **contexts**, **examples**,
      **template**, and generator/seed cannot steer the failure.


      Take **failed** (what went wrong on the asset) and **wanted** (what should have
      happened). Using **contexts**, **examples**, and **template**, evaluate a new
      named rule and a matching scanner that can detect that failure deterministically
      â€” only when the failure is mechanical and that existing surface cannot carry
      it.


      Write the rule and the scanner into **this tool** (the context tool''s own guidance
      and `scanners/`). Then **run that rule** via **scan** on the asset and **detect
      a failure that matches the mistake**. If scan is clean, or the failures are
      not this mistake, the rule/scanner is not done.

      '
    parameters:
      failed: str
      wanted: str
    returns: str
  document:
    kind: action
    tools:
    - generate_output
    - add_generate_header_to_generated
    instructions: '# Document


      Take the persona of a **neutral observer** â€” describe what exists, do not prescribe
      what should exist.


      1. Follow **`session_guidance`**. Observe and write under the session layout.

      2. Read the **contexts** to understand the vocabulary and structure of the domain.

      3. Fill the **template** scaffold with observed content â€” describe current state
      only.

      4. Do not apply, suggest, or imply rules or best practices in the generated
      output.

      5. Call **`scan`** and append all violations to the document as-is â€” flag them,
      do not correct them.

      6. Save the artifact under the session layout from `session_guidance`.

      7. **Live-app wraps.** DDD `/document` defaults the working area to `domain/`
      (overridable via `path` or `default_workspace_folder`). Put wraps under `{bounded-context}/{aggregate}/`
      as `{class}.ts` + `{class}.{tier}.ts` + `stubs/{system}/`. **Generate** may
      still use `src/`.


      ---'
    parameters:
      paths: list[str]
    returns: str
  generate:
    kind: action
    tools: []
    instructions: "Generate story artifacts at the current fidelity.\n        At story_map\
      \ fidelity: write the story map (names-only partition outline lives under ###\
      \ Scaffold in guidance). At scenarios fidelity:\
      \ write main-flow scenarios (single or multiple per story) with optional variations;\
      \ fixtures live in examples/ and givens.ts at the lowest shared epic/sub-epic/story\
      \ folder.\n        At acceptance_tests fidelity: write tests/{epic}/{sub-epic}/{story}.{tier}.ts\
      \ (one GWT file per story per seam, no story folder). When those files are written,\
      \ call ce().generate() to produce or update matching wrap classes under domain/."
    returns: str
  generate_fixes_from_validate:
    kind: action
    tools:
    - generate_output
    returns: str
  generate_output:
    kind: action
    tools: []
    returns: str
  iterate:
    kind: action
    tools: []
    instructions: "Iterate then generate - grill + formal generate/validate/one-fix\
      \ ticks.\n        At acceptance_tests fidelity: after each spec cycle, call\
      \ ce().iterate() to wire the minimum production code until GREEN.\n        If\
      \ the same acceptance scenario is still RED after 2 consecutive fix attempts\
      \ â€” stop guessing. Call diagnostic().diagnose() before a third fix (tier wiring,\
      \ stale Story constant, vocabulary drift, or transform that fixed the map while\
      \ the leaf still fails)."
    returns: str
  satisfy:
    kind: action
    tools: []
    instructions: "Find and fix every problem in the story artifacts under the session\
      \ root.\n        At acceptance_tests fidelity: after fixing specs, call ce().satisfy()\
      \ to keep matching production implementations GREEN.\n        If the same acceptance\
      \ scenario is still RED after 2 consecutive fix attempts â€” stop guessing. Call\
      \ diagnostic().diagnose() before a third fix (tier wiring, stale Story constant,\
      \ vocabulary drift, or transform that fixed the map while the leaf still fails)."
    returns: str
  validate:
    kind: action
    tools: []
    instructions: '# Validate


      Take the persona of a **critical judge** â€” do not edit the artifact.


      1. Follow **`session_guidance`**. Scope judgment to artifacts under `session.path`
      / the session layout.

      2. Use **contexts** as the rubric â€” report pass/fail per named context and named
      rule with brief evidence.

      3. Call **`scan`** on the session-rooted paths under review.

      4. Do not fix. Report failures for fixing, then **validate** again when ready.


      ---'
    returns: str
---
