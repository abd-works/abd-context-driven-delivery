---
type: stories
capabilities:
- tool
- agent
signature:
  instructions: '# Instructions'
  read_manifest:
    kind: meta
    instructions: Author/hook only. Agents must not remanifest — use the slash/skill
      catalog and pipe the fence to tools.ps1 run -.
    cmd: python -m tools manifest context_tools.stories.stories:Stories
    returns: manifest
  invoke:
    kind: meta
    instructions: Pipe the YAML fence to stdin from the repo root. Do not write a
      request file. Follow response.instructions only.
    cmd: .\tools.ps1 run -
  new:
    kind: constructor
    instructions: Create a toolset instance.
    parameters:
      fidelity: str
      format: str | None
      path: str | None
      session: str | None
      workspace: str | None
  load_template:
    kind: tool
    instructions: "Return the template content for the given format and fidelity.\n\
      \n        Pass the format you are about to generate (e.g. ``typescript``,\n\
      \        ``python``, ``markdown``) and the fidelity (e.g. ``story_map``,\n \
      \       ``scenarios``, ``code``).  Template lines and files are filtered to\n\
      \        only those annotated for the requested fidelity.  Falls back to the\n\
      \        instance's active format/fidelity when not given."
    parameters:
      format: str
      fidelity: str
    returns: str
  render:
    kind: tool
    instructions: Render already-generated story output into ``format`` via channel
      parse/render.
    parameters:
      format: str
      content: str
    returns: dict
  render_chunks:
    kind: tool
    instructions: "Render story map into Miro SVG chunks for incremental board upload.\n\
      \n        Use instead of transform/render when the target is a Miro board.\n\
      \        Each chunk is a valid SVG string with single-quoted attribute values\n\
      \        (safe for MCP JSON transport). Call canvas_create_from_svg with\n \
      \       is_repository=True for each chunk in the returned list, in order.\n\n\
      \        Returns {\"format\": \"miro\", \"chunk_count\": N, \"chunks\": [svg,\
      \ ...]}."
    parameters:
      content: str
      chunk_size: int
    returns: dict
  render_miro:
    kind: tool
    instructions: "Upload a story map directly to a Miro board via the REST API.\n\
      \n        Shapes are placed at exact board coordinates — no chunking, no stacking.\n\
      \        Each shape is created as a Miro rectangle/round_rectangle with correct\n\
      \        position (x/y centre, relative to canvas_center), size, colour, and\
      \ label.\n\n        Args:\n            content: story map markdown (or other\
      \ source format matching this instance).\n            board_id: the board ID\
      \ from the Miro URL (e.g. ``uXjVHuiSsAA=``).\n            token: Miro PAT. Falls\
      \ back to MIRO_TOKEN env var or ~/.miro-token.\n                   Get a token\
      \ at https://miro.com/app/settings/user-profile/apps\n            scale: SVG\
      \ units → Miro board units multiplier (default 1.5; story items\n          \
      \         become 75×75 board units). Increase for larger / more readable items.\n\
      \            origin_x: board X of the story-map top-left corner (default 0).\n\
      \            origin_y: board Y of the story-map top-left corner (default 6000,\
      \ below\n                      most existing content).\n            clear_ids:\
      \ comma-separated Miro shape IDs to delete before uploading.\n             \
      \          Use to clean up a previous broken upload.\n\n        Returns:\n \
      \           {\"board_id\", \"shape_count\", \"scale\", \"origin\", \"ids\":\
      \ {semantic_id: miro_id}}.\n\n        Estimated time: ~3 min for 541 shapes\
      \ (350 ms delay between API calls)."
    parameters:
      content: str
      board_id: str
      token: str
      scale: float
      origin_x: float
      origin_y: float
      clear_ids: str
    returns: dict
  transform:
    kind: tool
    instructions: "Parse content from source_format into the canonical StoryMap, then\
      \ render into target_format.\n        All formatters are peer channels. Sideways\
      \ format move at the same fidelity.\n        At acceptance_tests fidelity: after\
      \ transforming story artifacts, call ce().transform() or call guidance on the\
      \ CE companion and pass that companion to this action as a separate tools run."
    parameters:
      source_format: str
      target_format: str
      content: str
    returns: dict
  active:
    kind: resource
    type: WorkSession | None
  mode:
    kind: resource
    type: str
  guidance:
    kind: action
    tools: []
    instructions: "Provide guidance for creating story maps, scenarios, and acceptance\
      \ tests.\n        At scaffold fidelity: write epic, sub-epic, and story names\
      \ only.\n        At story_map fidelity: write the story map and thin-slice only.\n\
      \        At scenarios fidelity: write main-flow scenarios (single or multiple\
      \ per story) with optional variations; fixtures live in examples/ and givens.ts\
      \ at the lowest shared epic/sub-epic/story folder beside story-scenarios.md\
      \ (use tests/ only when that is the chosen output root).\n        At acceptance_tests\
      \ fidelity: write tests/{epic}/{sub-epic}/{story}.{tier}.ts (one GWT file per\
      \ story per seam, no story folder). When those files are written, call guidance\
      \ on the CE companion and pass that companion to this action as a separate tools\
      \ run so wrap classes under domain/ stay in sync.\n        If the same acceptance\
      \ scenario is still RED after 2 consecutive fix attempts — stop guessing. Call\
      \ diagnostic().diagnose() before a third fix (tier wiring, stale Story constant,\
      \ vocabulary drift, or transform that fixed the map while the leaf still fails).\n\
      \        When this Stories work is done, call guidance on the Clean Engineering\
      \ companion and pass that companion to this action as a separate tools run.\
      \ The action already knows what to do for every tool. Do not inline."
    returns: str
---
