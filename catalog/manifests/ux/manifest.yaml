---
type: ux
capabilities:
- tool
- agent
signature:
  instructions: '# Instructions'
  read_manifest:
    kind: meta
    instructions: Author/hook only. Agents must not remanifest — use the slash/skill
      catalog and pipe the fence to tools.ps1 run -.
    cmd: python -m tools manifest context_tools.ux.ux:Ux
    returns: manifest
  invoke:
    kind: meta
    instructions: Pipe the YAML fence to stdin from the repo root. Do not write a
      request file. Follow response.instructions only.
    cmd: .\tools.ps1 run -
  new:
    kind: constructor
    instructions: Create a toolset instance.
    parameters:
      fidelity: str
      format: str | None
      path: str | None
      session: str | None
      workspace: str | None
  ensure_javascript:
    kind: tool
    instructions: "Ensure Stories or Clean Engineering JS exists - transform via that\
      \ generator if needed.\n        generator: 'stories' | 'clean_engineering'.\
      \ Returns {format: javascript, content: ...}."
    parameters:
      generator: str
      source_format: str
      content: Any
    returns: dict
  load_template:
    kind: tool
    instructions: "Return the template content for the given format and fidelity.\n\
      \n        Pass the format you are about to generate (e.g. ``typescript``,\n\
      \        ``python``, ``markdown``) and the fidelity (e.g. ``story_map``,\n \
      \       ``scenarios``, ``code``).  Template lines and files are filtered to\n\
      \        only those annotated for the requested fidelity.  Falls back to the\n\
      \        instance's active format/fidelity when not given."
    parameters:
      format: str
      fidelity: str
    returns: str
  render:
    kind: tool
    instructions: Render already-generated UX output into ``format`` via channel parse/render.
    parameters:
      format: str
      content: str
    returns: dict
  transform:
    kind: tool
    instructions: "Parse content from source_format into the canonical UxMap, then\
      \ render into target_format.\n        Peer channels: drawio, html, markdown,\
      \ json. Sideways move at the same fidelity."
    parameters:
      source_format: str
      target_format: str
      content: str
    returns: dict
  active:
    kind: resource
    type: WorkSession | None
  mode:
    kind: resource
    type: str
  guidance:
    kind: action
    tools: []
    instructions: Provide guidance for creating IA, mockups, and front-end code.
    returns: str
---
