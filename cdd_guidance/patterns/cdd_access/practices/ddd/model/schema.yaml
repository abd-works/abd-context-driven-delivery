# CDD access overlay on ddd. Extend only.
accessRoute:
  - is: class
  - path: "src/{context}/{object}/{object}-routes"
  - asks: accessNode
accessNode:
  - is: class
  - path: "src/{context}/{object}/{object}-node"
accessConnection:
  - is: class
  - path: "src/cdd/cdd-connection-node"
accessHandWrittenTools:
  - is: class
  - path: "src/{context}/{object}/{object}-tools"
accessMarkedToolset:
  - is: class
  - path: "harness/{domain}/{object}"
