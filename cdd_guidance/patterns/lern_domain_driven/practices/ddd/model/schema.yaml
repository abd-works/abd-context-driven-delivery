# LERN overlay on ddd. Extend only.
# is: names the supertype. ddd.type is already defined in practices/ddd — do not restate it.
# A bare name is one. A bracket list is the collection.
aggregate:
  - is: ddd.aggregate
  - path: "{boundedContext}/{sub-boundedContext}?/{aggregate}/"
  - route: route
  - view: [view]
  - nodeRoot: nodeRoot
  - nodeRepository: nodeRepository
  - clientRoot: clientRoot
  - entityRoot: ddd.entityRoot
  - entities: [ddd.entities]
  - repository: repository
  - jsonStore: jsonStore

nodeRoot:
  - is: ddd.entityRoot
  - name: string
  - path: "{aggregate}-node"
  - views: [view]
nodeRepository:
  - is: repository
  - name: string
  - path: "{aggregate}-node"
  - writes: jsonStore
jsonStore:
  - name: string
  - path: "{aggregate}.json"
  - belongsTo: aggregate
  - writtenBy: repositoryNode
  - stores: [ddd.entityRoot]
clientRoot:
  - is: ddd.entityRoot
  - name: string
  - calls: route
  - path: "{aggregate}-client"
route:
  - is: class
  - name: string
  - belongsTo: aggregate
  - nodeRoot: nodeRoot
view:
  - is: class
  - name: string
  - clientRoot: clientRoot
  - nodeRepository: nodeRepository
