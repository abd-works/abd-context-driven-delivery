<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Story explorer</title>
<script src="./support.js"></script>
__STYLESHEETS__
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.sm-panel{font-family:'Inter',system-ui,sans-serif;color:#E8E8ED}
.sm-panel a{color:#E5531A}
.sm-row{display:flex;gap:8px;align-items:baseline;width:100%;box-sizing:border-box;padding:5px 8px;border:0;border-radius:4px;background:transparent;font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:20px;text-align:left;color:#E8E8ED;cursor:pointer}
.sm-row:hover{background:rgba(229,83,26,0.10)}
.sm-chev{display:inline-block;width:10px;flex-shrink:0;color:#E5531A;font-weight:700;transition:transform 150ms ease}
.sm-chev.sm-open{transform:rotate(90deg)}
.sm-k0{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#E5531A}
.sm-k1{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;background:#1A1A1E}
.sm-k2{font-weight:600}
.sm-k2.sm-on{color:#F2A07A}
.sm-k3{padding-left:16px;font-size:13px}
.sm-k3.sm-on{font-weight:600}
.sm-ex{padding-left:28px;color:#F2A07A}
.sm-nomark{display:none}
.sm-line{display:flex;align-items:stretch}
.sm-line>.sm-row{flex:1 1 auto;min-width:0}
.sm-copy{flex-shrink:0;align-self:center;margin-left:2px;padding:2px 6px;border:1px solid transparent;border-radius:4px;background:transparent;color:#4A4A52;font:600 11px/1 'JetBrains Mono',ui-monospace,monospace;cursor:pointer}
.sm-line:hover .sm-copy{color:#9B9BA8;border-color:#2A2A2A}
.sm-copy:hover{color:#E5531A!important;border-color:#E5531A!important}
.sm-resize{width:6px;flex-shrink:0;cursor:col-resize;background:#0B0B0B;border-left:1px solid #2A2A2A}
.sm-resize:hover{background:#E5531A}
.sm-w-260{width:260px}.sm-w-280{width:280px}.sm-w-300{width:300px}.sm-w-320{width:320px}.sm-w-340{width:340px}.sm-w-360{width:360px}.sm-w-380{width:380px}.sm-w-400{width:400px}.sm-w-420{width:420px}.sm-w-440{width:440px}.sm-w-460{width:460px}.sm-w-480{width:480px}.sm-w-500{width:500px}.sm-w-520{width:520px}.sm-w-540{width:540px}.sm-w-560{width:560px}.sm-w-580{width:580px}.sm-w-600{width:600px}.sm-w-620{width:620px}.sm-w-640{width:640px}.sm-w-660{width:660px}.sm-w-680{width:680px}.sm-w-700{width:700px}.sm-w-720{width:720px}.sm-w-740{width:740px}.sm-w-760{width:760px}.sm-w-780{width:780px}.sm-w-800{width:800px}.sm-w-820{width:820px}.sm-w-840{width:840px}.sm-w-860{width:860px}.sm-w-880{width:880px}.sm-w-900{width:900px}.sm-w-920{width:920px}.sm-w-940{width:940px}.sm-w-960{width:960px}.sm-w-980{width:980px}.sm-w-1000{width:1000px}
.sm-given{cursor:default}
.sm-given:hover{background:transparent}
.sm-icon{flex-shrink:0;align-self:center;color:#9B9BA8}
.sm-k0 .sm-icon,.sm-on .sm-icon,.sm-box .sm-icon{color:#E5531A}
.sm-box{background:rgba(229,83,26,0.14);box-shadow:inset 3px 0 0 #E5531A;border-radius:0}
.sm-box:hover{background:rgba(229,83,26,0.20)}
.sm-box-top{border-radius:4px 4px 0 0;margin-top:2px}
.sm-box-bottom{border-radius:0 0 4px 4px;margin-bottom:2px}
.sm-box-top.sm-box-bottom{border-radius:4px}
.sm-step-on{color:#E8E8ED;font-weight:600}
.sm-k4{padding-left:34px;white-space:pre-wrap;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;line-height:18px;color:#9B9BA8}
.sm-sel{background:rgba(229,83,26,0.18);box-shadow:inset 3px 0 0 #E5531A;color:#E8E8ED;font-weight:600}
.sm-dot{display:inline-block;width:10px;flex-shrink:0;color:#4A4A52}
.sm-dot.sm-shot{color:#E5531A}
.sm-btn{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;padding:4px 10px;border:1px solid #2A2A2A;border-radius:4px;background:transparent;color:#E8E8ED;cursor:pointer}
.sm-btn:hover{border-color:#F2A07A}
a.sm-btn{text-decoration:none;color:#E8E8ED}
.sm-tab{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;font-weight:600;padding:4px 10px;border:1px solid #2A2A2A;border-radius:999px;background:#111113;color:#E8E8ED;cursor:pointer}
.sm-tab-on{background:#E5531A;border-color:#E5531A;color:#0B0B0B}
</style>
</helmet>
<div style="width: 100%; min-width: 1100px; height: 100vh; min-height: 700px; box-sizing: border-box; display: flex; background: #0B0B0B">
<div style="position: relative; flex: 1 1 auto; min-width: 0; height: 100%; background: #ffffff; overflow: auto">
__IMPORTS__
<sc-if value="{{showShot}}" hint-placeholder-val="{{ true }}">
<img src="{{img}}" alt="{{stepText}}" style="display: block; width: 100%; height: auto">
</sc-if>
<sc-if value="{{showNothing}}" hint-placeholder-val="{{ false }}">
<div class="sm-panel" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #111113; color: #9B9BA8">No screen for this step yet</div>
</sc-if>
<sc-if value="{{manyImgs}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; top: 12px; right: 12px; display: flex; gap: 8px">
<sc-for list="{{thumbs}}" as="t" hint-placeholder-count="3">
<button type="button" class="{{t.cls}}" onClick="{{t.pick}}">{{t.num}}</button>
</sc-for>
</div>
</sc-if>
</div>
<sc-if value="{{panelOpen}}" hint-placeholder-val="{{ true }}">
<div class="sm-resize" onMouseDown="{{startResize}}" title="Drag to resize"></div>
<div class="sm-panel {{panelWidthClass}}" style="flex-shrink: 0; height: 100%; box-sizing: border-box; border-left: 1px solid #2A2A2A; background: #111113; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-bottom: 1px solid #2A2A2A">
<a class="sm-btn" href="/Main.dc.html" aria-label="Back to the story map">← Story map</a>
<div style="flex-grow: 1"></div>
<button type="button" class="sm-btn" onClick="{{collapseAll}}">Collapse all</button>
<button type="button" class="sm-btn" onClick="{{reset}}">Reset</button>
<button type="button" class="sm-btn" onClick="{{next}}">Play next</button>
<button type="button" class="sm-btn" aria-label="Hide the story map" onClick="{{hidePanel}}">»</button>
</div>
<div style="display: flex; flex-direction: column; gap: 0; padding: 8px; overflow-y: auto; flex: 1 1 auto; min-height: 0">
<sc-for list="{{rows}}" as="row" hint-placeholder-count="12">
<div class="sm-line"><button type="button" class="{{row.cls}}" onClick="{{row.pick}}"><span class="{{row.markCls}}">{{row.mark}}</span><sc-if value="{{row.is_epic}}" hint-placeholder-val="{{ false }}"><svg class="sm-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"> <path d="M4 2.5v11"></path> <path d="M4 3.5h8L10.5 6 12 8.5H4"></path> </g></svg></sc-if><sc-if value="{{row.is_subEpic}}" hint-placeholder-val="{{ false }}"><svg class="sm-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"> <path d="M5.5 4v9"></path> <path d="M5.5 4.5h6.5L10.5 6.5 12 8.5H5.5"></path> </g></svg></sc-if><sc-if value="{{row.is_story}}" hint-placeholder-val="{{ false }}"><svg class="sm-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"> <rect x="3" y="2.5" width="10" height="11" rx="1"></rect> <path d="M5.5 6h5M5.5 8.5h5M5.5 11h3"></path> </g></svg></sc-if><sc-if value="{{row.is_background}}" hint-placeholder-val="{{ false }}"><svg class="sm-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"> <rect x="5" y="2.5" width="8" height="8"></rect> <path d="M3 5.5h8V13.5H3z"></path> </g></svg></sc-if><sc-if value="{{row.is_scenario}}" hint-placeholder-val="{{ false }}"><svg class="sm-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"> <circle cx="4" cy="12" r="1.6"></circle> <circle cx="12" cy="4" r="1.6"></circle> <path d="M5.3 10.8 10.7 5.2"></path> </g></svg></sc-if><sc-if value="{{row.is_example}}" hint-placeholder-val="{{ false }}"><svg class="sm-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"> <path d="M6.2 3.2C4.8 3.2 4 4.2 4 5.4v1.4L2.6 8 4 9.2v1.4c0 1.2.8 2.2 2.2 2.2"></path> <path d="M9.8 3.2c1.4 0 2.2 1 2.2 2.2v1.4L13.4 8 12 9.2v1.4c0 1.2-.8 2.2-2.2 2.2"></path> </g></svg></sc-if><span>{{row.label}}</span></button><sc-if value="{{row.canCopy}}" hint-placeholder-val="{{ false }}"><button type="button" class="sm-copy" title="{{row.copyTitle}}" aria-label="{{row.copyTitle}}" onClick="{{row.copy}}">{{row.copyLabel}}</button></sc-if></div>
</sc-for>
</div>
</div>
</sc-if>
<sc-if value="{{panelHidden}}" hint-placeholder-val="{{ false }}">
<button type="button" class="sm-btn" aria-label="Show the story map" onClick="{{showPanel}}" style="height: 100%; padding: 8px; border-radius: 0">«</button>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1880,"height":948}}'>
class Component extends DCLogic {
panelWidth() {
if (this.state && this.state.panelWidth) return this.state.panelWidth;
try { return Number(window.localStorage.getItem('design-canvas.explorer-width')) || 440; } catch (problem) { return 440; }
}
startResize(event) {
if (event && event.preventDefault) event.preventDefault();
const move = (moved) => {
const width = Math.min(1000, Math.max(260, Math.round((window.innerWidth - moved.clientX) / 20) * 20));
this.setState({ panelWidth: width });
};
const stop = () => {
window.removeEventListener('mousemove', move);
window.removeEventListener('mouseup', stop);
try { window.localStorage.setItem('design-canvas.explorer-width', String(this.panelWidth())); } catch (problem) { console.warn('explorer width not kept', problem); }
};
window.addEventListener('mousemove', move);
window.addEventListener('mouseup', stop);
}
componentDidMount() {
this.followHash = () => this.forceUpdate();
window.addEventListener('hashchange', this.followHash);
window.addEventListener('storage', this.followHash);
window.addEventListener('focus', this.followHash);
document.addEventListener('visibilitychange', this.followHash);
let tries = 0;
const wait = () => { if (typeof CanvasFixtures !== 'undefined') { this.forceUpdate(); return; } if (tries++ < 100) setTimeout(wait, 100); };
wait();
}
copyOpenRequest(location, title) {
const text = 'Open in the file viewer: ' + location + ' (' + title + ')';
const done = () => { this.setState({ copied: location }); setTimeout(() => { if (this.state && this.state.copied === location) this.setState({ copied: null }); }, 1500); };
const fallback = () => {
const area = document.createElement('textarea');
area.value = text;
document.body.appendChild(area);
area.select();
try { document.execCommand('copy'); done(); } catch (problem) { window.prompt('Copy this request:', text); }
area.remove();
};
try { navigator.clipboard.writeText(text).then(done, fallback); } catch (problem) { fallback(); }
}
componentWillUnmount() {
window.removeEventListener('hashchange', this.followHash);
window.removeEventListener('storage', this.followHash);
window.removeEventListener('focus', this.followHash);
document.removeEventListener('visibilitychange', this.followHash);
}
componentDidUpdate() {
const selected = document.querySelector('.sm-step-on') || document.querySelector('.sm-box-top');
const key = selected ? selected.textContent : '';
if (!selected || key === this.shownSelection) return;
this.shownSelection = key;
selected.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
outlineRows(story, template) {
if (template.indexOf('${') < 0 || typeof CanvasFixtures === 'undefined') return [];
const pattern = new RegExp('^' + template.split(/\$\{[^}]*\}/).map((part) => part.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('(.+?)') + '$');
return CanvasFixtures.scenarios(story).filter((name) => pattern.test(name)).map((name) => ({ name: name, label: name.match(pattern).slice(1).join(' · ') }));
}
tree() {
return __DATA__;
}
renderVals() {
const T = this.tree();
const S = [];
T.forEach((e, ei) => e.u.forEach((u, ui) => u.s.forEach((s) => S.push({ e: ei, u: ui, n: s.n, f: s.f, c: s.c }))));
const first = Math.max(0, S.findIndex((s) => s.c.some((sc) => !sc.b)));
const scenarioOf = (g, c) => (c >= 0 && S[g].c[c] && !S[g].c[c].b ? c : Math.max(0, S[g].c.findIndex((sc) => !sc.b)));
const startOpen = () => { const o = { e0: true }; o['u' + S[first].e + '-' + S[first].u] = true; o['s' + first] = true; o['s' + first + '-' + scenarioOf(first, 0)] = true; return o; };
const opened = (g, c, base) => { const o = Object.assign({}, base); ['e' + S[g].e, 'u' + S[g].e + '-' + S[g].u, 's' + g, 's' + g + '-' + c].forEach((k) => { o[k] = true; }); return o; };
let hash = '';
try { hash = (window.location.hash || '').slice(1) || window.localStorage.getItem('design-canvas.link:/screens/explorer.dc.html') || ''; } catch (e) { hash = ''; }
const linked = (() => {
if (!hash) return null;
const q = {};
hash.split('&').forEach((pair) => { const at = pair.indexOf('='); if (at > 0) q[decodeURIComponent(pair.slice(0, at))] = decodeURIComponent(pair.slice(at + 1)); });
const g = S.findIndex((s) => s.n === q.story);
if (g < 0) return null;
const c = scenarioOf(g, S[g].c.findIndex((sc) => sc.n === q.scenario));
const t = Math.max(0, ((S[g].c[c] || { t: [] }).t).findIndex((tp) => tp.x.split('\n').some((line) => line === q.step || line.endsWith(' ' + q.step))));
return { g: g, c: c, t: t, i: 0, hash: hash, open: opened(g, c, { e0: true }) };
})();
const fresh = linked && (!this.state || this.state.hash !== hash);
const st = fresh ? linked : Object.assign({ g: first, c: scenarioOf(first, 0), t: 0, i: 0, open: startOpen() }, this.state || {});
const withOpen = (keys) => { const o = Object.assign({}, st.open); keys.forEach((k) => { o[k] = true; }); return o; };
const go = (g, c, t, x) => this.setState({ g: g, c: c, t: t, x: x || null, i: 0, hash: hash, open: opened(g, c, st.open) });
const toggle = (key) => () => this.setState({ hash: hash, open: Object.assign({}, st.open, { [key]: !st.open[key] }) });
const chev = (open) => ({ mark: '›', markCls: open ? 'sm-chev sm-open' : 'sm-chev' });
const camel = (stem) => stem.split('-').map((part, k) => (k ? part.charAt(0).toUpperCase() + part.slice(1) : part)).join('');
const flat = [];
S.forEach((s, g) => s.c.forEach((sc, ci) => { if (!sc.b) sc.t.forEach((tp, ti) => flat.push([g, ci, ti])); }));
const copyOf = (location, title) => (location ? { canCopy: true, copyTitle: 'Copy a request to open ' + location, copyLabel: (this.state && this.state.copied) === location ? 'copied' : 'open ⧉', copy: () => this.copyOpenRequest(location, title) } : { canCopy: false });
const exampleOf = (g, c) => { const rowsOf = this.outlineRows(S[g].n, (S[g].c[c] || { n: '' }).n); if (!rowsOf.length) return null; return (g === st.g && c === st.c && st.x && rowsOf.some((r) => r.name === st.x)) ? st.x : rowsOf[0].name; };
const rows = [];
T.forEach((e, ei) => {
const ek = 'e' + ei;
rows.push(Object.assign({ label: e.n, is_epic: true, cls: 'sm-row sm-k0', pick: toggle(ek) }, chev(st.open[ek])));
if (!st.open[ek]) return;
e.u.forEach((u, ui) => {
const uk = 'u' + ei + '-' + ui;
rows.push(Object.assign({ label: u.n, is_subEpic: true, cls: 'sm-row sm-k1', pick: toggle(uk) }, chev(st.open[uk])));
if (!st.open[uk]) return;
S.forEach((s, g) => {
if (s.e !== ei || s.u !== ui) return;
const sk = 's' + g;
rows.push(Object.assign({ label: s.n, is_story: true, ...copyOf(s.f, s.n), cls: 'sm-row sm-k2' + (g === st.g ? ' sm-on' : ''), pick: () => (g === st.g && st.open[sk] ? toggle(sk)() : go(g, scenarioOf(g, 0), 0)) }, chev(st.open[sk])));
if (!st.open[sk]) return;
s.c.forEach((sc, ci) => {
const ck = sk + '-' + ci;
rows.push(Object.assign({ label: sc.n, is_background: Boolean(sc.b), is_scenario: !sc.b, ...copyOf(sc.f, s.n + ' › ' + sc.n), cls: 'sm-row sm-k3' + (g === st.g && ci === st.c ? ' sm-on sm-box sm-box-top' + (st.open[ck] ? '' : ' sm-box-bottom') : ''), pick: () => (sc.b || (g === st.g && ci === st.c && st.open[ck]) ? toggle(ck)() : go(g, ci, 0)) }, chev(st.open[ck])));
if (!st.open[ck]) return;
this.outlineRows(s.n, sc.n).forEach((ex) => rows.push({ label: ex.label, is_example: true, cls: 'sm-row sm-k3 sm-ex' + (g === st.g && ci === st.c ? ' sm-box' + (ex.name === exampleOf(g, ci) ? ' sm-step-on' : '') : ''), mark: '', markCls: 'sm-nomark', pick: () => go(g, ci, 0, ex.name) }));
sc.t.forEach((tp, ti) => rows.push(sc.b ? { label: tp.x, cls: 'sm-row sm-k4 sm-given', mark: '', markCls: 'sm-nomark', pick: () => {} } : { label: tp.x, cls: 'sm-row sm-k4' + (g === st.g && ci === st.c ? ' sm-box' + (ti === st.t ? ' sm-step-on' : '') + (ti === sc.t.length - 1 ? ' sm-box-bottom' : '') : ''), mark: '', markCls: 'sm-nomark', pick: () => go(g, ci, ti) }));
});
});
});
});
const scen = S[st.g].c[st.c] || S[st.g].c[0] || { n: '', p: '', t: [{ x: '', i: [] }] };
const step = scen.t[st.t] || scen.t[0] || { x: '', i: [] };
const imgs = step.i;
const idx = Math.min(st.i, Math.max(imgs.length - 1, 0));
const live = {};
if (scen.p) live[camel(scen.p)] = true;
const at = flat.findIndex((f) => f[0] === st.g && f[1] === st.c && f[2] === st.t);
return {
live: live,
storyName: S[st.g].n,
goToStory: (name, scenario) => {
const g = S.findIndex((s) => s.n === name);
if (g < 0) return;
let c = scenario ? S[g].c.findIndex((sc) => sc.n === scenario) : 0;
let x = null;
if (c < 0 && scenario) {
c = S[g].c.findIndex((sc) => this.outlineRows(S[g].n, sc.n).some((r) => r.name === scenario));
x = c >= 0 ? scenario : null;
}
if (c < 0 && g === st.g) return;
go(g, scenarioOf(g, c), 0, x);
},
scenarioName: scen.b ? (S[st.g].c.map((sc, ci) => (sc.b ? null : exampleOf(st.g, ci) || sc.n)).find(Boolean) || scen.n) : (exampleOf(st.g, st.c) || scen.n),
stepText: step.x,
showShot: !scen.p && imgs.length > 0,
showNothing: !scen.p && imgs.length === 0,
img: imgs[idx] || '',
manyImgs: !scen.p && imgs.length > 1,
thumbs: imgs.map((u, k) => ({ num: k + 1, cls: 'sm-tab' + (k === idx ? ' sm-tab-on' : ''), pick: () => this.setState({ i: k, hash: hash }) })),
rows: rows,
panelOpen: !st.hidden,
panelWidthClass: 'sm-w-' + this.panelWidth(),
startResize: (event) => this.startResize(event),
panelHidden: Boolean(st.hidden),
hidePanel: () => this.setState({ hidden: true, hash: hash }),
showPanel: () => this.setState({ hidden: false, hash: hash }),
collapseAll: () => this.setState({ hash: hash, open: { e0: true } }),
reset: () => this.setState({ g: first, c: scenarioOf(first, 0), t: 0, i: 0, hash: hash, open: startOpen() }),
next: () => { const f = flat[(at + 1) % flat.length]; go(f[0], f[1], f[2]); }
};
}
}
</script>
</body>
</html>
