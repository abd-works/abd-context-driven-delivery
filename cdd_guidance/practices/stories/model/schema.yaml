[epic]

storyNode:
  fidelity: story_map
  text: string
  order: number
  belongsTo?: storyNode
  id: dotPath
  decomposedInto?: [storyNode]
  where:
    - id is the text slugs from the root to this node, joined by dots
    - id is unique on the map
  rules:
    - vocabulary-traces-to-domain-source
    - read-all-source-context-in-full
    - do-not-invent-requirements

epic:
  fidelity: story_map
  id: dotPath
  uses?: [module]
  decomposedInto: [subEpic | story]
  where:
    - id is the text slugs from the root to this node, joined by dots
    - decomposedInto count 2..6 when it holds a subEpic, else 4..9
    - uses is the home module of a demonstrated class or an invoked member
  rules:
    - verb-noun-format
    - branch-on-mechanical-uniqueness
    - child-count-fits-layer

subEpic:
  fidelity: story_map
  id: dotPath
  belongsTo: epic
  decomposedInto: [subEpic | story]
  where:
    - id is the text slugs from the root to this node, joined by dots
    - decomposedInto count 2..6 when it holds a subEpic, else 2..9
    - examples belong on this sub-epic, not on the epic
  rules:
    - verb-noun-format
    - branch-on-mechanical-uniqueness
    - child-count-fits-layer

story:
  fidelity: story_map
  id: dotPath
  belongsTo: [subEpic | epic]
  background?: background
  scenarios: [scenario]
  invokes?: [operation | property]
  shownOn?: [screen]
  where:
    - id is the text slugs from the root to this node, joined by dots
    - scenarios count 0..7; more than 7 and the story is huge, and a story with none is waiting for its scenarios (story-scenarios-at-most-seven)
    - background only when scenarios share its given
    - one observable interaction at one system boundary
    - invokes is the union of invokes on the steps this story owns
  rules:
    - verb-noun-format
    - story-name-captures-system-mechanic
    - right-size-story-nodes
    - behaviours-not-build-tasks
    - story-scenarios-at-most-seven
    - kebab-case-paths
    - scenarios-name-a-story-on-the-map

scenario:
  fidelity: scenarios
  id: dotPath
  steps: [step]
  examples?: [example]
  invokes?: [operation | property]
  specifiedBy?: [observation]
  shownOn?: [screen]
  where:
    - id is the text slugs from the root to this node, joined by dots
    - steps match given+ (when then+)+
    - shownOn is the screen whose showsScenarios holds this scenario; with none, the scenario shows its story's screen
    - outline when examples count > 2
    - examples cover every domain concept the steps name
    - invokes is the union of invokes on these steps
  rules:
    - scenarios-shape
    - outline-requires-many-permutations
    - explore-full-interaction-surface
    - and-chaining
    - examples-trace-domain-model
    - reconcile-live-immediately
    - flagged-writes-intended-gwt

step:
  fidelity: scenarios
  id: dotPath
  order: number
  belongsTo: scenario
  ands?: [step]
  shownOn?: [screen]
  names?: [class]
  where:
    - id is the text slugs from the root to this node, joined by dots
    - ands continue the step they follow
    - names is the domain model class each domain term the step links names; a step with no linked term has none
    - shownOn is the screen whose showsSteps holds this step
    - but marks a missing state
  rules:
    - plain-english-gwt-steps
    - gwt-steps-trace-to-domain-operations
    - but-marks-missing-state
    - domain-terms-link-to-model

given:
  fidelity: scenarios
  is: step
  id: dotPath
  order: number
  examples?: [example]
  where:
    - id is the text slugs from the root to this node, joined by dots
  rules:
    - given-only-what-the-system-checks
    - given-names-complex-state-root-first
    - seed-prior-story-as-given

when:
  fidelity: scenarios
  is: step
  id: dotPath
  order: number
  invokes?: [operation | property]
  where:
    - id is the text slugs from the root to this node, joined by dots
    - invokes is required only of a When backed by code, a story test's or a realization's (code-steps-invoke-code)
    - a realization's invokes are the model operations its calls name, matched through the step's domain-term links
  rules:
    - when-holds-the-operation
    - code-steps-invoke-code
    - when-names-intent-not-interface-gesture
    - expressive-system-interactions

then:
  fidelity: scenarios
  is: step
  id: dotPath
  order: number
  observes?: [example]
  where:
    - id is the text slugs from the root to this node, joined by dots
    - observes is the examples its own text names and those the Givens of its scenario and of its story's Background name; an example of a markdown scenarios file is observed only by the steps of that file
    - observes is required only where a model is written for the story's area of the map (then-observes-an-example)
  rules:
    - then-observes-an-example
    - behavioral-and-system-observable-outcomes
    - main-flow-first
    - browser-then-asserts-screen-widgets
    - assert-domain-behavior-not-seeded-state

background:
  fidelity: scenarios
  is: given
  id: dotPath
  given: given
  belongsTo: story
  scopes?: [example]
  where:
    - id is the text slugs from the root to this node, joined by dots
    - scopes the examples its given steps own
    - present only when more than one scenario shares the state

example:
  fidelity: scenarios
  id: dotPath
  text: string
  demonstrates: class
  retrievedUsing: [operation | property]
  where:
    - id is the text slugs from the root to this node, joined by dots
    - demonstrates and retrievedUsing are required only where a model is written for the story's area of the map
  rules:
    - examples-declare-seed-vs-interaction
    - examples-trace-domain-model
    - example-role-names
    - domain-fixture-example-files
    - examples-export-data-not-repository
    - shared-example-fixtures
    - seed-state-at-its-real-owner
    - separate-test-controls-from-production-contracts
    - system-stubs-domain-real
    - infrastructure-in-lifecycle-hooks
    - inline-simple-gwt-bodies
    - domain-operations-inline-in-steps
    - extract-assertion-helper
