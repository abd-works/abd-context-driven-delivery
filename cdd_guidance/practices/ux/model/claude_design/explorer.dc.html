<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Story explorer</title>
<script src="./support.js"></script>
__STYLESHEETS__
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.sm-panel{font-family:'Inter',system-ui,sans-serif;color:#E8E8ED}
.sm-panel a{color:#E5531A}
.sm-row{display:flex;gap:8px;align-items:baseline;width:100%;box-sizing:border-box;padding:5px 8px;border:0;border-radius:4px;background:transparent;font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:20px;text-align:left;color:#E8E8ED;cursor:pointer}
.sm-row:hover{background:rgba(229,83,26,0.10)}
.sm-chev{display:inline-block;width:10px;flex-shrink:0;color:#E5531A;font-weight:700;transition:transform 150ms ease}
.sm-chev.sm-open{transform:rotate(90deg)}
.sm-k0{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#E5531A}
.sm-k1{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;background:#1A1A1E}
.sm-k2{font-weight:600}
.sm-k2.sm-on{color:#F2A07A}
.sm-k3{padding-left:16px;font-size:13px}
.sm-k3.sm-on{font-weight:600}
.sm-ex{padding-left:28px;color:#F2A07A}
.sm-nomark{display:none}
.sm-line{display:flex;align-items:stretch}
.sm-line>.sm-row{flex:1 1 auto;min-width:0}
.sm-copy{flex-shrink:0;align-self:center;margin-left:2px;padding:2px 6px;border:1px solid transparent;border-radius:4px;background:transparent;color:#4A4A52;font:600 11px/1 'JetBrains Mono',ui-monospace,monospace;cursor:pointer}
.sm-line:hover .sm-copy{color:#9B9BA8;border-color:#2A2A2A}
.sm-copy:hover{color:#E5531A!important;border-color:#E5531A!important}
.sm-resize{width:6px;flex-shrink:0;cursor:col-resize;background:#0B0B0B;border-left:1px solid #2A2A2A}
.sm-resize:hover{background:#E5531A}

.sm-given{cursor:default}
.sm-given:hover{background:transparent}
.sm-icon{flex-shrink:0;align-self:center;color:#9B9BA8}
.sm-k0 .sm-icon,.sm-on .sm-icon,.sm-box .sm-icon{color:#E5531A}
.sm-box{background:rgba(229,83,26,0.14);box-shadow:inset 3px 0 0 #E5531A;border-radius:0}
.sm-box:hover{background:rgba(229,83,26,0.20)}
.sm-box-top{border-radius:4px 4px 0 0;margin-top:2px}
.sm-box-bottom{border-radius:0 0 4px 4px;margin-bottom:2px}
.sm-box-top.sm-box-bottom{border-radius:4px}
.sm-step-on{color:#FFFFFF;font-weight:600;background:rgba(229,83,26,0.38);box-shadow:inset 6px 0 0 #E5531A}
.sm-step-on:hover{background:rgba(229,83,26,0.44)}
.sm-k4{padding-left:34px;white-space:pre-wrap;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;line-height:18px;color:#9B9BA8}
.sm-sel{background:rgba(229,83,26,0.18);box-shadow:inset 3px 0 0 #E5531A;color:#E8E8ED;font-weight:600}
.sm-dot{display:inline-block;width:10px;flex-shrink:0;color:#4A4A52}
.sm-dot.sm-shot{color:#E5531A}
.sm-btn{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;padding:4px 10px;border:1px solid #2A2A2A;border-radius:4px;background:transparent;color:#E8E8ED;cursor:pointer}
.sm-btn:hover{border-color:#F2A07A}

.sm-tab{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;font-weight:600;padding:4px 10px;border:1px solid #2A2A2A;border-radius:999px;background:#111113;color:#E8E8ED;cursor:pointer}
.sm-tab-on{background:#E5531A;border-color:#E5531A;color:#0B0B0B}
.sm-step{display:flex;flex-direction:column;min-width:0;flex:1 1 auto}
.sm-term{color:#E8A46B;text-decoration:underline dotted;text-underline-offset:2px;cursor:pointer}
.sm-term:hover{color:#F0BC8C}
.sm-real-toggle{align-self:flex-start;margin-top:2px;cursor:pointer;color:#7FA7D9;font:600 11px/16px 'JetBrains Mono',ui-monospace,monospace}

.sm-card-divider:hover::before{background:#E8A46B}

.sm-card-close:hover{color:#E8E8ED}

</helmet>
<div style="width: 100%; min-width: 1100px; height: 100vh; min-height: 700px; box-sizing: border-box; display: flex; background: #0B0B0B">
<div style="position: relative; flex: 1 1 auto; min-width: 0; height: 100%; background: #0B0B0B; overflow: auto">
__IMPORTS__
<sc-if value="{{showShot}}" hint-placeholder-val="{{ true }}">
<img src="{{img}}" alt="{{stepText}}" style="display: block; width: 100%; height: auto">
</sc-if>
<sc-if value="{{showNothing}}" hint-placeholder-val="{{ false }}">
<div class="sm-panel" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #111113; color: #9B9BA8">No screen for this step yet</div>
</sc-if>
<sc-if value="{{manyImgs}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; top: 12px; right: 12px; display: flex; gap: 8px">
<sc-for list="{{thumbs}}" as="t" hint-placeholder-count="3">
<button type="button" class="{{t.cls}}" onClick="{{t.pick}}">{{t.num}}</button>
</sc-for>
</div>
</sc-if>
</div>
<sc-if value="{{panelOpen}}" hint-placeholder-val="{{ true }}">
<div class="sm-resize" onMouseDown="{{startResize}}" title="Drag to resize"></div>
<div class="sm-panel {{panelWidthClass}}" style="flex-shrink: 0; height: 100%; box-sizing: border-box; border-left: 1px solid #2A2A2A; background: #111113; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-bottom: 1px solid #2A2A2A">
<a class="sm-btn" href="/Main.dc.html" aria-label="Back to the story map">← Story map</a>
<div style="flex-grow: 1"></div>
<button type="button" class="sm-btn" onClick="{{collapseAll}}">Collapse all</button>
<button type="button" class="sm-btn" onClick="{{reset}}">Reset</button>
<button type="button" class="sm-btn" onClick="{{next}}">Play next</button>
<button type="button" class="sm-btn" aria-label="Hide the story map" onClick="{{hidePanel}}">»</button>
</div>
<div style="display: flex; flex-direction: column; gap: 0; padding: 8px; overflow-y: auto; flex: 1 1 auto; min-height: 0">
<sc-for list="{{rows}}" as="row" hint-placeholder-count="12">
<div class="sm-line" style="{{row.indent}}"><div role="button" tabindex="0" class="{{row.cls}}" onClick="{{row.pick}}"><span class="{{row.markCls}}">{{row.mark}}</span><sc-if value="{{row.is_epic}}" hint-placeholder-val="{{ false }}"><svg class="sm-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"> <path d="M4 2.5v11"></path> <path d="M4 3.5h8L10.5 6 12 8.5H4"></path> </g></svg></sc-if><sc-if value="{{row.is_subEpic}}" hint-placeholder-val="{{ false }}"><svg class="sm-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"> <path d="M5.5 4v9"></path> <path d="M5.5 4.5h6.5L10.5 6.5 12 8.5H5.5"></path> </g></svg></sc-if><sc-if value="{{row.is_story}}" hint-placeholder-val="{{ false }}"><svg class="sm-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"> <rect x="3" y="2.5" width="10" height="11" rx="1"></rect> <path d="M5.5 6h5M5.5 8.5h5M5.5 11h3"></path> </g></svg></sc-if><sc-if value="{{row.is_background}}" hint-placeholder-val="{{ false }}"><svg class="sm-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"> <rect x="5" y="2.5" width="8" height="8"></rect> <path d="M3 5.5h8V13.5H3z"></path> </g></svg></sc-if><sc-if value="{{row.is_scenario}}" hint-placeholder-val="{{ false }}"><svg class="sm-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"> <circle cx="4" cy="12" r="1.6"></circle> <circle cx="12" cy="4" r="1.6"></circle> <path d="M5.3 10.8 10.7 5.2"></path> </g></svg></sc-if><sc-if value="{{row.is_example}}" hint-placeholder-val="{{ false }}"><svg class="sm-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"> <path d="M6.2 3.2C4.8 3.2 4 4.2 4 5.4v1.4L2.6 8 4 9.2v1.4c0 1.2.8 2.2 2.2 2.2"></path> <path d="M9.8 3.2c1.4 0 2.2 1 2.2 2.2v1.4L13.4 8 12 9.2v1.4c0 1.2-.8 2.2-2.2 2.2"></path> </g></svg></sc-if><span class="sm-step"><span><sc-for list="{{row.parts}}" as="part" hint-placeholder-count="1"><sc-if value="{{part.isTerm}}" hint-placeholder-val="{{ false }}"><span class="sm-term" data-card="{{part.card}}">{{part.text}}</span></sc-if><sc-if value="{{part.isText}}" hint-placeholder-val="{{ true }}">{{part.text}}</sc-if></sc-for></span><sc-if value="{{row.hasRealization}}" hint-placeholder-val="{{ false }}"><span class="sm-real-toggle" role="button" title="Show or hide how this step is realized">{{row.realizationToggle}}</span><sc-if value="{{row.realizationOpen}}" hint-placeholder-val="{{ false }}"><span class="sm-real">{{row.realization}}</span></sc-if></sc-if></span></div><sc-if value="{{row.canCopy}}" hint-placeholder-val="{{ false }}"><button type="button" class="sm-copy" title="{{row.copyTitle}}" aria-label="{{row.copyTitle}}" data-location="{{row.copyLocation}}" data-title="{{row.copyName}}" onClick="{{copyFromButton}}">{{row.copyLabel}}</button></sc-if></div>
</sc-for>
</div>
<sc-if value="{{cardOpen}}" hint-placeholder-val="{{ false }}">
<div class="sm-card-divider" role="separator" aria-orientation="horizontal" title="Drag to resize" onPointerDown="{{startCardResize}}"></div>
<div class="sm-card" style="{{cardStyle}}">
<div class="sm-card-head"><span class="sm-card-title">{{cardTitle}}</span><span class="sm-card-close" role="button" title="Close" aria-label="Close the class card" onClick="{{closeCard}}">×</span></div>
<div class="sm-card-body">{{cardText}}</div>
</div>
</sc-if>
</div>
</sc-if>
<sc-if value="{{panelHidden}}" hint-placeholder-val="{{ false }}">
<button type="button" class="sm-btn" aria-label="Show the story map" onClick="{{showPanel}}" style="height: 100%; padding: 8px; border-radius: 0">«</button>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1880,"height":948}}'>
class Component extends DCLogic {
panelWidth() {
if (this.state && this.state.panelWidth) return this.state.panelWidth;
try { return Number(window.localStorage.getItem('design-canvas.explorer-width')) || 440; } catch (problem) { return 440; }
}
startResize(event) {
if (event && event.preventDefault) event.preventDefault();
const move = (moved) => {
const width = Math.min(1000, Math.max(260, Math.round((window.innerWidth - moved.clientX) / 20) * 20));
this.setState({ panelWidth: width });
};
const stop = () => {
window.removeEventListener('mousemove', move);
window.removeEventListener('mouseup', stop);
try { window.localStorage.setItem('design-canvas.explorer-width', String(this.panelWidth())); } catch (problem) { console.warn('explorer width not kept', problem); }
};
window.addEventListener('mousemove', move);
window.addEventListener('mouseup', stop);
}
cardHeight() {
return (this.state && this.state.cardHeight) || 240;
}
startCardResize(event) {
// The divider drags the class card's top edge: up makes the card taller and the list of steps shorter.
if (event && event.preventDefault) event.preventDefault();
const startY = event.clientY;
const startHeight = this.cardHeight();
const move = (moved) => this.setState({ cardHeight: Math.max(80, Math.min(window.innerHeight - 160, startHeight + (startY - moved.clientY))) });
const stop = () => {
window.removeEventListener('pointermove', move);
window.removeEventListener('pointerup', stop);
};
window.addEventListener('pointermove', move);
window.addEventListener('pointerup', stop);
}
termParts(text, terms) {
// A step's text as plain words and the domain terms it links, longest term first, whole words only.
const names = Object.keys(terms || {}).sort((a, b) => b.length - a.length);
if (!names.length) return [{ text: text, isText: true, isTerm: false }];
const pattern = new RegExp('(?<!\\w)(' + names.map((name) => name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')(?!\\w)', 'g');
const parts = [];
let at = 0;
let found;
while ((found = pattern.exec(text)) !== null) {
if (found.index > at) parts.push({ text: text.slice(at, found.index), isText: true, isTerm: false });
parts.push({ text: found[1], isText: false, isTerm: true, card: terms[found[1]] });
at = found.index + found[1].length;
}
if (at < text.length) parts.push({ text: text.slice(at), isText: true, isTerm: false });

}
componentDidMount() {
this.followHash = () => this.forceUpdate();
window.addEventListener('hashchange', this.followHash);
window.addEventListener('storage', this.followHash);
window.addEventListener('focus', this.followHash);
document.addEventListener('visibilitychange', this.followHash);

const wait = () => { if (typeof CanvasFixtures !== 'undefined') { this.forceUpdate(); return; } if (tries++ < 100) setTimeout(wait, 100); };
wait();
}
copyOpenRequest(location, title) {
const text = 'Open in the file viewer: ' + location + ' (' + title + ')';
const done = () => { this.setState({ copied: location }); setTimeout(() => { if (this.state && this.state.copied === location) this.setState({ copied: null }); }, 1500); };
const fallback = () => {
const area = document.createElement('textarea');
area.value = text;
document.body.appendChild(area);
area.select();
try { document.execCommand('copy'); done(); } catch (problem) { window.prompt('Copy this request:', text); }
area.remove();
};
try { navigator.clipboard.writeText(text).then(done, fallback); } catch (problem) { fallback(); }
}
componentWillUnmount() {
window.removeEventListener('hashchange', this.followHash);
window.removeEventListener('storage', this.followHash);
window.removeEventListener('focus', this.followHash);
document.removeEventListener('visibilitychange', this.followHash);
}
componentDidUpdate() {
const selected = document.querySelector('.sm-step-on') || document.querySelector('.sm-box-top');
const key = selected ? selected.textContent : '';
if (!selected || key === this.shownSelection) return;
this.shownSelection = key;
selected.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
outlineRows(story, template) {
if (typeof CanvasFixtures === 'undefined') return [];
// An outline named without a placeholder runs each example row as "<outline>: <row>".
if (template.indexOf('${') < 0) {
const prefix = template + ': ';
return CanvasFixtures.scenarios(story).filter((name) => name.indexOf(prefix) === 0).map((name) => ({ name: name, label: name.slice(prefix.length) }));
}
const pattern = new RegExp('^' + template.split(/\$\{[^}]*\}/).map((part) => part.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('(.+?)') + '$');
return CanvasFixtures.scenarios(story).filter((name) => pattern.test(name)).map((name) => ({ name: name, label: name.match(pattern).slice(1).join(' · ') }));
}
classCards() {
return __CARDS__;
}
tree() {
return __DATA__;
}
renderVals() {
const T = this.tree();
const S = [];
// An epic holds its sub-epics (e) and its stories (s), nested as deep as the story map nests them. Each story keeps
// the keys of the epics above it (p), outermost first, so picking it opens every one of them.
const storyAt = new Map();
const gather = (e, key, path) => {
(e.e || []).forEach((sub, k) => gather(sub, key + '.' + k, path.concat(key + '.' + k)));
(e.s || []).forEach((s) => { storyAt.set(s, S.length); S.push({ p: path, n: s.n, f: s.f, c: s.c }); });
};
T.forEach((e, ei) => gather(e, 'e' + ei, ['e' + ei]));
const first = Math.max(0, S.findIndex((s) => s.c.some((sc) => !sc.b)));
const scenarioOf = (g, c) => (c >= 0 && S[g].c[c] && !S[g].c[c].b ? c : Math.max(0, S[g].c.findIndex((sc) => !sc.b)));
const startOpen = () => { const o = { e0: true }; S[first].p.forEach((k) => { o[k] = true; }); o['s' + first] = true; o['s' + first + '-' + scenarioOf(first, 0)] = true; return o; };
const opened = (g, c, base) => { const o = Object.assign({}, base); S[g].p.concat(['s' + g, 's' + g + '-' + c]).forEach((k) => { o[k] = true; }); return o; };
let hash = '';
try { hash = (window.location.hash || '').slice(1) || window.localStorage.getItem('design-canvas.link:/screens/explorer.dc.html') || ''; } catch (e) { hash = ''; }
const linked = (() => {
if (!hash) return null;
const q = {};
hash.split('&').forEach((pair) => { const at = pair.indexOf('='); if (at > 0) q[decodeURIComponent(pair.slice(0, at))] = decodeURIComponent(pair.slice(at + 1)); });
const g = S.findIndex((s) => s.n === q.story);
if (g < 0) return null;
const c = scenarioOf(g, S[g].c.findIndex((sc) => sc.n === q.scenario));
const t = Math.max(0, ((S[g].c[c] || { t: [] }).t).findIndex((tp) => tp.x.split('\n').some((line) => line === q.step || line.endsWith(' ' + q.step))));
return { g: g, c: c, t: t, i: 0, hash: hash, open: opened(g, c, { e0: true }) };
})();
const fresh = linked && (!this.state || this.state.hash !== hash);
const st = fresh ? linked : Object.assign({ g: first, c: scenarioOf(first, 0), t: 0, i: 0, open: startOpen() }, this.state || {});
const withOpen = (keys) => { const o = Object.assign({}, st.open); keys.forEach((k) => { o[k] = true; }); return o; };
const go = (g, c, t, x) => this.setState({ g: g, c: c, t: t, x: x || null, i: 0, hash: hash, open: opened(g, c, st.open) });
const toggle = (key) => () => this.setState({ hash: hash, open: Object.assign({}, st.open, { [key]: !st.open[key] }) });
const chev = (open) => ({ mark: '›', markCls: open ? 'sm-chev sm-open' : 'sm-chev' });
const camel = (stem) => stem.split('-').map((part, k) => (k ? part.charAt(0).toUpperCase() + part.slice(1) : part)).join('');
const flat = [];
S.forEach((s, g) => s.c.forEach((sc, ci) => { if (!sc.b) sc.t.forEach((tp, ti) => flat.push([g, ci, ti])); }));
const copyOf = (location, title) => (location ? { canCopy: true, copyTitle: 'Copy a request to open ' + location, copyLabel: (this.state && this.state.copied) === location ? 'copied' : 'open ⧉', copyLocation: location, copyName: title } : { canCopy: false });
const exampleOf = (g, c) => { const rowsOf = this.outlineRows(S[g].n, (S[g].c[c] || { n: '' }).n); if (!rowsOf.length) return null; return (g === st.g && c === st.c && st.x && rowsOf.some((r) => r.name === st.x)) ? st.x : rowsOf[0].name; };
// An outline's steps name its columns as placeholders ({example}, ${plan}, <plan>); with one of its rows on show they
// read that row's values, as the scenario's Examples table gives them (r, by row), and keep the placeholders otherwise.
const valuesOf = (g, c) => { const sc = S[g].c[c]; const name = sc && sc.r ? exampleOf(g, c) : null; if (!name) return null; const row = this.outlineRows(S[g].n, sc.n).find((r) => r.name === name); return row ? sc.r[row.label] || null : null; };
const filled = (text, values) => (values ? text.replace(/\$\{([^}]+)\}|\{([^}]+)\}|<([^>]+)>/g, (whole, a, b, c) => { const value = values[(a || b || c).trim()]; return value === undefined ? whole : value; }) : text);
const rows = [];
// A step row draws its linked terms and its realization toggle. A click on a term shows that term's class card and a
// click on the toggle or the realization opens or closes it; neither selects the step. The open state is per row.
const stepRow = (row, tp, key) => {
const pick = row.pick;
const realized = () => (this.state && this.state.realized) || {};
return Object.assign(row, {
parts: this.termParts(row.label, tp.m),
hasRealization: Boolean(tp.z),
realization: tp.z || '',
realizationOpen: Boolean(realized()[key]),
realizationToggle: realized()[key] ? '▾ realization' : '▸ realization',
pick: (event) => {
const target = event && event.target && event.target.closest ? event.target : null;
const inRealization = target ? target.closest('.sm-real-toggle, .sm-real') : null;
if (inRealization) {
event.stopPropagation();
if (inRealization.classList.contains('sm-real-toggle')) this.setState({ hash: hash, realized: Object.assign({}, realized(), { [key]: !realized()[key] }) });
return;
}
const term = target ? target.closest('.sm-term') : null;
if (term) {
event.stopPropagation();
this.setState({ hash: hash, card: term.getAttribute('data-card') });
return;
}
pick(event);
}
});
};
// Each epic's row, then, when it is open, its sub-epics' and its stories' rows, at the depth the story map nests them;
// a row below the first sub-epic level is set in by its depth.
const indent = (depth) => 'margin-left: ' + 10 * Math.max(0, depth - 1) + 'px';
const epicRows = (e, key, depth) => {
rows.push(Object.assign({ label: e.n, is_epic: depth === 0, is_subEpic: depth > 0, indent: indent(depth), cls: depth ? 'sm-row sm-k1' : 'sm-row sm-k0', pick: toggle(key) }, chev(st.open[key])));
if (!st.open[key]) return;
(e.e || []).forEach((sub, k) => epicRows(sub, key + '.' + k, depth + 1));
(e.s || []).forEach((s) => {
const g = storyAt.get(s);
const from = rows.length;
(() => {
const sk = 's' + g;
rows.push(Object.assign({ label: s.n, is_story: true, ...copyOf(s.f, s.n), cls: 'sm-row sm-k2' + (g === st.g ? ' sm-on' : ''), pick: () => (g === st.g && st.open[sk] ? toggle(sk)() : go(g, scenarioOf(g, 0), 0)) }, chev(st.open[sk])));
if (!st.open[sk]) return;
s.c.forEach((sc, ci) => {
const ck = sk + '-' + ci;
rows.push(Object.assign({ label: sc.n, is_background: Boolean(sc.b), is_scenario: !sc.b, ...copyOf(sc.f, s.n + ' › ' + sc.n), cls: 'sm-row sm-k3' + (g === st.g && ci === st.c ? ' sm-on sm-box sm-box-top' + (st.open[ck] ? '' : ' sm-box-bottom') : ''), pick: () => (sc.b || (g === st.g && ci === st.c && st.open[ck]) ? toggle(ck)() : go(g, ci, 0)) }, chev(st.open[ck])));
if (!st.open[ck]) return;
this.outlineRows(s.n, sc.n).forEach((ex) => rows.push({ label: ex.label, is_example: true, cls: 'sm-row sm-k3 sm-ex' + (g === st.g && ci === st.c ? ' sm-box' + (ex.name === exampleOf(g, ci) ? ' sm-step-on' : '') : ''), mark: '', markCls: 'sm-nomark', pick: () => go(g, ci, 0, ex.name) }));
sc.t.forEach((tp, ti) => rows.push(stepRow(sc.b ? { label: tp.x, cls: 'sm-row sm-k4 sm-given', mark: '', markCls: 'sm-nomark', pick: () => {} } : { label: g === st.g && ci === st.c ? filled(tp.x, valuesOf(g, ci)) : tp.x, cls: 'sm-row sm-k4' + (g === st.g && ci === st.c ? ' sm-box' + (ti === st.t ? ' sm-step-on' : '') + (ti === sc.t.length - 1 ? ' sm-box-bottom' : '') : ''), mark: '', markCls: 'sm-nomark', pick: () => go(g, ci, ti, g === st.g && ci === st.c ? st.x : null) }, tp, 'r' + g + '-' + ci + '-' + ti)));
});
})();
rows.slice(from).forEach((row) => { row.indent = indent(depth); });
});
};
T.forEach((e, ei) => epicRows(e, 'e' + ei, 0));
rows.forEach((row) => { if (!row.parts) Object.assign(row, { parts: [{ text: row.label, isText: true, isTerm: false }], hasRealization: false }); });
const cards = this.classCards();
const card = (this.state && this.state.card && cards[this.state.card]) || null;
const scen = S[st.g].c[st.c] || S[st.g].c[0] || { n: '', p: '', t: [{ x: '', i: [] }] };
const step = scen.t[st.t] || scen.t[0] || { x: '', i: [] };
const imgs = step.i;
const idx = Math.min(st.i, Math.max(imgs.length - 1, 0));
const live = {};
if (scen.p) live[camel(scen.p)] = true;
const at = flat.findIndex((f) => f[0] === st.g && f[1] === st.c && f[2] === st.t);
return {
live: live,
storyName: S[st.g].n,
goToStory: (name, scenario, step) => {
const g = S.findIndex((s) => s.n === name);
if (g < 0) return;
let c = scenario ? S[g].c.findIndex((sc) => sc.n === scenario) : 0;
let x = null;
if (c < 0 && scenario) {
c = S[g].c.findIndex((sc) => this.outlineRows(S[g].n, sc.n).some((r) => r.name === scenario));
x = c >= 0 ? scenario : null;
}
if (c < 0 && g === st.g) return;
const at = scenarioOf(g, c);
const groups = (S[g].c[at] || { t: [] }).t;
const matches = (tp) => tp.x.split('\n').some((line) => line === step || line.startsWith(step));
// In the scenario on show, look past the group on show first, so a second action moves on to its own outcome.
const from = g === st.g && at === st.c ? st.t + 1 : 0;
const ahead = groups.findIndex((tp, ti) => ti >= from && matches(tp));
const t = step ? Math.max(0, ahead >= 0 ? ahead : groups.findIndex(matches)) : 0;
go(g, at, t, x);
},
scenarioName: scen.b ? (S[st.g].c.map((sc, ci) => (sc.b ? null : exampleOf(st.g, ci) || sc.n)).find(Boolean) || scen.n) : (exampleOf(st.g, st.c) || scen.n),
stepText: scen.b ? step.x : filled(step.x, valuesOf(st.g, st.c)),
stepIndex: scen.t[st.t] ? st.t : 0,
stepKind: scen.b ? '' : (step.k || ''),
showShot: !scen.p && imgs.length > 0,
showNothing: !scen.p && imgs.length === 0,
img: imgs[idx] || '',
manyImgs: !scen.p && imgs.length > 1,
thumbs: imgs.map((u, k) => ({ num: k + 1, cls: 'sm-tab' + (k === idx ? ' sm-tab-on' : ''), pick: () => this.setState({ i: k, hash: hash }) })),
rows: rows,
cardOpen: Boolean(card),
cardTitle: card ? card.title : '',
cardText: card ? card.text : '',
cardStyle: 'height: ' + this.cardHeight() + 'px',
closeCard: () => this.setState({ card: null, hash: hash }),
startCardResize: (event) => this.startCardResize(event),
copyFromButton: (event) => { const button = event && event.currentTarget; if (button) this.copyOpenRequest(button.getAttribute('data-location'), button.getAttribute('data-title')); },
panelOpen: !st.hidden,
panelWidthClass: 'sm-w-' + this.panelWidth(),
startResize: (event) => this.startResize(event),
panelHidden: Boolean(st.hidden),
hidePanel: () => this.setState({ hidden: true, hash: hash }),
showPanel: () => this.setState({ hidden: false, hash: hash }),
collapseAll: () => this.setState({ hash: hash, open: { e0: true } }),
reset: () => this.setState({ g: first, c: scenarioOf(first, 0), t: 0, i: 0, hash: hash, open: startOpen() }),
next: () => { const f = flat[(at + 1) % flat.length]; go(f[0], f[1], f[2]); }
};
}
}
</script>
