<!DOCTYPE html>
<!--
  AI mockup template (Story Demo shell).
  Prefer filling the model + HtmlUxMap.render (uses mockup_shell.html).
  When authoring HTML directly, keep this split: product LEFT + explorer RIGHT.

  Controls that participate in a story step MUST be StoryDemoControl in the model, which emits:
    data-bound-field="…"
    data-story-steps='[{"kind":"when","label":"…"}]'
  Serve from repo root. mount-generated-mockup.js collects create{Story}Story exports.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>UX — {{SCOPE}}</title>
  <style>
    body { margin: 0; font-family: ui-monospace, Consolas, monospace; }
    #shell { display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; }
    #story-demo-frame { border-right: 1px solid #ccc; padding: 1rem; }
    #explorer-frame { padding: 1rem; }
    .control.emphasized { outline: 2px solid #2563eb; }
    .control.tinted { background: #fecaca; }
  </style>
</head>
<body data-story-demo-shell>
  <header><h1>{{SCOPE}}</h1></header>
  <div id="shell">
    <section id="story-demo-frame">
      <main id="mockup">
        <!-- screens / regions / controls — emit data-story-steps on StoryDemoControls.
             The sample below is one screen with one control, written out so you can see a filled-in page: replace
             the Cart screen, its "order actions" region and its "Place order" button with your own, add a screen
             for each screen of the user goal, and keep the map in the ux-map-json comment at the end of the page
             the same as the markup, since that comment is what CDD reads back. -->
        <article class="screen" data-slug="cart" data-layout="stack">
          <h2>Cart</h2>
          <p class="layout">stack</p>
          <div class="regions">
            <section class="region" data-area="body" data-region="order actions">
              <h3>order actions</h3>
              <button type="button" class="control button primary" data-name="Place order" data-trigger="click"
                      data-effect="places the order for the books in the cart">Place order</button>
            </section>
          </div>
          <p class="screen-stories">Stories: -</p>
        </article>
      </main>
    </section>
    <section id="explorer-frame">
      <button type="button" data-reset>Reset</button>
      <button type="button" data-play-next>Play next</button>
      <ul data-explorer-tree></ul>
      <p data-explorer-message hidden></p>
    </section>
  </div>
  <script type="module" src="{{STORY_MODULE}}" data-ux-story-ref></script>
  <script type="module" src="{{DOMAIN_MODULE}}" data-ux-object-ref></script>
  <script type="module" src="/practices/ux/story-demo/mount-generated-mockup.js"></script>
  <!-- ux-map-json:
{
  "name": "place-order",
  "scope": "Place Order",
  "screens": [
    {
      "name": "Cart",
      "slug": "cart",
      "layout": "stack",
      "description": "The books the customer is about to order",
      "regions": [
        {
          "name": "order actions",
          "area": "body",
          "controls": [
            {
              "name": "Place order",
              "control_type": "button",
              "label": "Place order",
              "states": ["primary"],
              "interactions": [
                {"name": "place the order", "trigger": "click", "effect": "places the order for the books in the cart", "destination": ""}
              ]
            }
          ]
        }
      ]
    }
  ]
}
  -->
</body>
</html>
