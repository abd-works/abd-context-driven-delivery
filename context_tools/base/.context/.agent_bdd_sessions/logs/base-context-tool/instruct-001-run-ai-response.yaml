ok: true
toolset: generate.generate:Generate
action: generate
result: When done, run validate.
instructions: "# Generate\n\n1. Call **`open`**. Confirm sprint slug with the user\
  \ when run context has no `session=`; pass `name` / `goal` / `fidelities` on first\
  \ create if needed. Follow **`session_guidance`**; use the **`active`** resource\
  \ for `active.path` / `active.folder`.\n2. **MUST — prove-read before asking.**\
  \ Before any grill/iterate question (and before inventing options or story/module\
  \ names):\n   - Identify **every relevant context file referenced or implied** by\
  \ the decision — not one favorite type. Typical set: `{workspace}/.context/context-index.md`,\
  \ owning `*-segment.md`, `module-context.md`, session grill-answers / sketches /\
  \ handoff, peer story-context, build-order, and any path the plan or prior answers\
  \ cite. Include index/overlay only for structure hints; **never** treat mid-epic\
  \ stub columns as inventory.\n   - **Read each of those files with the Read tool**\
  \ (chunk through large ones). Grep, title lists, memory, or primer-only skims **do\
  \ not count**.\n   - **Prove it in the question turn:** name the path(s) read and\
  \ ground options in concrete terms from them. If you cannot cite specifics from\
  \ the relevant files, you have not read them — go read before asking.\n   - Asking\
  \ from a skim is a **defect**, same class as dumping a whole artifact in one iterate\
  \ tick.\n2b. **`do-not-invent-requirements`** — Do not invent requirements, status/maintenance\
  \ signals, or competing command surfaces absent from source / the ask. Prefer the\
  \ existing gap/fallback (or the already-specified invoke surface) over minting a\
  \ new state or a second co-equal how-to-call block.\n3. **`sources-scoped-to-generated-context`**\
  \ — Hang `**Sources / context:**` on the node they ground: epic / sub-epic / feature\
  \ / module, or a lower item (scenario, class, screen, component, …). Root or parent-level\
  \ Sources are fine when those files apply to the **entire** artifact or subtree.\n\
  4. Apply all guidance and named rules in each **context** — each bullet is a requirement.\n\
  5. Match **examples** for shape, depth, and tone.\n6. Fill the **template** scaffold\
  \ and save the artifact under the session layout from `session_guidance`.\n6b. **Large\
  \ job — several turns.** Decide the source from the **ask** and what this session\
  \ already produced (a sketch, a model, a format to transform — not a locked default).\
  \ If that source is a whole model, sketch, or similarly large artifact, implement\
  \ **one slice** in this invoke, then stop. `finish_turn` closes this turn. Continue\
  \ in later generate or iterate turns — even if the user asked for everything once.\
  \ Filling the whole artifact in one generate is a defect (same class as dumping\
  \ a map in one iterate tick). A small implied source may finish in one turn. Do\
  \ not treat a red full-tree **validate** as permission to finish the rest in this\
  \ invoke; validate the slice you wrote.\n7. Follow any extra build steps included\
  \ in your instructions when present.\n8. Run **validate** on what this turn wrote.\
  \ If the job is one slice, a remaining gap in the rest of the source is the next\
  \ turn, not this one. If the implied source was small enough for one turn and validate\
  \ fails, fix the artifact and **validate** again until it passes.\n\n\nOpen the\
  \ workspace if it is not already open. The turn hangs off the work session — it\
  \ is already there when the session is awake. Decision records hang off the work\
  \ session.\n\nself._session().turn\n\nOffer and write Context Decision Records (CDRs)\
  \ sparingly as decisions crystallise during the wrapped action - never batch; never\
  \ invent decisions.\n\nStep 1 - Read the format once via read_cdr_format. Internalise\
  \ the three-criteria gate and the minimal template.\n\nStep 2 - Optionally call\
  \ list_cdrs(root) so you do not re-record an already-captured decision.\n\nStep\
  \ 3 - During the session (grill, sketch, or generate), watch for decisions that\
  \ meet ALL three: hard to reverse, surprising without context, and a real trade-off.\
  \ If any criterion is missing, skip the CDR.\n\nStep 4 - When a qualifying decision\
  \ crystallises, offer a CDR briefly (title + one-line gist). If the user accepts,\
  \ call write_cdr immediately with a kebab slug and content matching CDR-FORMAT.md.\
  \ Do not batch; do not wait until the end.\n\nStep 5 - Keep CDRs short. Prefer a\
  \ single paragraph. Add Status / Considered Options / Consequences only when they\
  \ add genuine value.\n\nProvide guidance from contexts, examples, and templates.\n\
  \nran generate_output\n\nPrepend the following block verbatim as the very first\
  \ lines of the file you are writing - before any imports, before any code.\n\nRan\
  \ SessionLog.append (plain): error cannot evaluate plain-call argument type(tool).manifest_path\n\
  \nFinish the turn that hangs off the work session.\n\nEvery tool call uses this\
  \ shape - set `tool` and `arguments`, pipe to CLI:\n\n```yaml\ntoolset: generate.generate:Generate\n\
  context:\ntool: <tool name>\narguments:\n  <if needed>\n```\n\nRun: python -m tools\
  \ run -\n\nSuggested flow (repeat and reorder as the story needs):\n\n1. tool: read_cdr_format\n\
  \n2. tool: list_cdrs\n\n3. tool: write_cdr\n\n4. tool: finish_turn\n\nRead `resources`\
  \ from each response before choosing the next tool."
tools:
- read_cdr_format
- list_cdrs
- write_cdr
- finish_turn
arguments:
  tools:
  - context_tools.base.base_context_tool:BaseContextTool
resources:
  mode: action