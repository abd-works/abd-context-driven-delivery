  \ matching CDR-FORMAT.md. Do not batch; do not wait until the end.\n\nStep 5 - Keep\
  \ CDRs short. Prefer a single paragraph. Add Status / Considered Options / Consequences\
  \ only when they add genuine value.\n\n# Contexts\n\nBehavior-driven development\
  \ turns domain vocabulary into passing tests. Every BDD artifact is an indented\
  \ hierarchy. Sketch that shape first (`templates/bdd-sketch.md`).\n\n## Hierarchy\
  \ shape (required)\n\n```\ndescribe {subject — domain thing, state, or observable\
  \ condition}\n  that {event or condition that sets the subject up}\n    with {narrower\
  \ condition}\n      it should {observable outcome}\n```\n\nRead top-down as a **usage\
  \ / storytelling sequence**: what the user or system does first, then what is true,\
  \ then what is observed. Nest by the **real events and conditions** that make the\
  \ next observation possible — not by package, class role, or test fixture type.\n\
  \n| Line | Names | Never names |\n| --- | --- | --- |\n| **describe** | Subject\
  \ under observation in plain English (thing, state, condition) | Manager / hub /\
  \ runner / service / internal class; decorator symbol (`@log`); marker name |\n\
  | **that …** | Past or present event/condition on that subject (`that has been logged`,\
  \ `that is invoked`) | `when …` |\n| **with …** | Narrower standing condition (`with\
  \ no session name given`, `with verbose off`) | `when …`; implementation knobs phrased\
  \ as API flags |\n| **it should …** | One stakeholder-visible outcome | Internals,\
  \ private fields, call counts on mocks of the subject |\n\n**Pass (storytelling\
  \ / usage order):**\n```\nan action that is annotated with log\n  that is invoked\n\
  \    it should record a run event on the session trail\n  that has been logged\n\
  \    with no session name given\n      it should use the default session\n    with\
  \ a given session name\n      it should keep events under that session\n    with\
  \ verbose off\n      it should write a summary line and keep the last payload\n\
  \      with full logging requested\n        it should flush the last payload\n \
  \   with verbose on\n      it should write payload files for later events\n\nan\
  \ action that is not annotated\n  that is invoked\n    it should leave the session\
  \ trail empty\n```\n\n**Fail:**\n```\n@log marker                          ← mechanism\
  \ / symbol, not a subject\nToolsetRunner                        ← manager / internal\n\
  a logged tool                        ← splits the same subject; use one action story\n\
  when no session name is given        ← never \"when\" for state — use \"with …\"\
  \n```\n\n**Shared Rules:**\n\n- **`observable-behavior`** — Prove what a stakeholder\
  \ can verify without reading code (return value, state, public effect). Never internals.\n\
  - **`domain-practice-alignment`** — Describe names must match domain language /\
  \ model exactly.\n- **`usage-order-behaviors`** — Order describes, contexts, and\
  \ examples as a **usage story** or operational sequence (what happens first → next).\
  \ Do not order by implementation layer, package, or internal type.\n- **`describe-is-subject-not-internal`**\
  \ — A `describe` is a domain subject, state, or observable condition — never a manager,\
  \ hub, runner, service, or other internal (`SessionLog`, `ToolsetRunner`, …).\n\
  - **`describe-is-plain-english`** — Full English phrases (e.g. \"an action that\
  \ is annotated with log\", \"an action that is not annotated\"). Never symbol/mechanism\
  \ names (`\"@log marker\"`) as the subject.\n- **`state-not-when`** — Never name\
  \ a nested state with `when`. Use `that …` for events/conditions on the subject\
  \ and `with …` for standing conditions. Ask: what event or condition must already\
  \ be true for this observation?\n- **`nest-by-enabling-events`** — Each nested `that`\
  \ / `with` must be a real precondition or event required for the nested `it should`\
  \ — not a test-file grouping convenience.\n- **`full-surface-coverage`** — When\
  \ generating or satisfying tests for a module that already exists, scan the production\
  \ source for every public method, property, class, and constant. Each must have\
  \ at least one `it should` covering its observable behavior. Any gap is a violation.\
  \ Private and underscore-prefixed members are excluded unless they are part of a\
  \ documented public contract.\n\n---\n\nThis skill operates at **multiple levels\
  \ of fidelity**. Start from an agreed sketch and deepen toward green tests and production\
  \ code. Each level **adds** artifacts and **extends** the previous — do not fill\
  \ in details from a more detailed fidelity. Least detail → most detail below.\n\n\
  | Fidelity | Output |\n|---|---|\n| **behavior** | describe/it hierarchy with `BDD:\
  \ SIGNATURE` markers in each `it` |\n| **development** | Implemented tests + production\
  \ code |\n\n## behavior\n\n**Default format:** Python\n\n**Goal:** map observation\
  \ to a real test before implementation. Lock the sketched hierarchy as framework\
  \ `describe` / `it` nesting. Every `it` body is exactly one `BDD: SIGNATURE` marker\
  \ — nothing else.\n\n- Sketch nesting (subjects → `with`/`that`/events → `it should`)\
  \ is agreed \n- **Confirm framework** — ask if not stated. Default: Mamba/Python;\
  \ Jest/TypeScript or JUnit 5/Java when the project uses those.\n- Convert every\
  \ sketch hierarchy line to its framework equivalent (see Framework syntax).\n- Process\
  \ in batches of ~18 describe blocks when the hierarchy is large.\n\nFill the **behavior**\
  \ (SIGNATURE) section of `templates/bdd-templates.{ext}` (`.py` / `.java` / `.ts`).\n\
  \n### Framework syntax\n\n| Construct | Jest (TypeScript) | Mamba (Python) | JUnit\
  \ 5 (Java) |\n| --- | --- | --- | --- |\n| Top-level concept | `describe('Context',\
  \ () => {` | `with description('Context'):` | `@Nested class Context` |\n| Nested\
  \ state/context | `describe('that has…', () => {` | `with context('that has…'):`\
  \ | `@Nested class ThatHas…` |\n| Behavior | `it('should …', () => {` | `with it('should\
  \ …'):` | `@Test void should…()` |\n| Marker | `// BDD: SIGNATURE` | `# BDD: SIGNATURE`\
  \ | `// BDD: SIGNATURE` |\n\n### Rules\n\n- **`hierarchy-preservation`** — 1:1 from\
  \ sketch nesting to code. Nothing added, removed, or flattened. Same depth, same\
  \ `it` count.\n- **`signature-markers`** — Every `it` body is exactly `// BDD: SIGNATURE`\
  \ or `# BDD: SIGNATURE`.\n- **`no-implementation`** — No assertions, mocks, production\
  \ imports, helpers, or `beforeEach` / shared setup.\n- **`framework-syntax`** —\
  \ One confirmed framework throughout. Do not mix Jest and Mamba constructs.\n\n\
  **Pass:**\n```typescript\nit('should apply a percentage discount to eligible items',\
  \ () => {\n  // BDD: SIGNATURE\n});\n```\n\n**Fail:** any assertion, mock, import\
  \ of production code, or helper inside the body.\n\n---\n\n## development\n\n**Default\
  \ format:** Python\n\n**Goal:** Replace `BDD: SIGNATURE` markers one at a time with\
  \ it shgould /expect bodies, then minimum production code until green. Inherit the\
  \ framework from the **behavior** artifactif already completed.\n\n1. **Confirm\
  \ framework** — inherit from the behavior file.\n2. **Scan markers** — list all\
  \ `it` blocks still containing `BDD: SIGNATURE`; report count.\n3. **Identify shared\
  \ setup** — extract to `beforeEach` / `with before.each:` or a factory when three\
  \ or more siblings share arrangement.\n4. Pick **one** marker. Fill Arrange-Act-Assert\
  \ from the DEVELOPMENT TESTS section of `templates/bdd-templates.{ext}` (`.py` /\
  \ `.java` / `.ts`).\n5. Run the test — confirm RED for the right reason.\n6. Write\
  \ the **minimum** production code until GREEN (PRODUCTION CODE section of the same\
  \ template).\n7. Refactor only while green. Move to the next marker.\n8. Repeat\
  \ until zero markers remain, then run **validate**.\n\n### Coverage scan (existing\
  \ code)\n\nWhen generating or satisfying against a module that already exists, read\
  \ the production source before touching the spec:\n\n1. List every public method,\
  \ property, class, and constant (exclude `_`-prefixed members unless publicly documented).\n\
  2. Compare against the existing spec to find members with no `it should` entry.\n\
  3. Add `it should` entries (at behavior fidelity) or full test bodies (at development\
  \ fidelity) for every gap — do not skip any public member.\n4. Only then proceed\
  \ with RED-GREEN-REFACTOR for the new or updated tests.\n\n### The RED-GREEN-REFACTOR\
  \ cycle\n\n**RED** — fail for the right reason before production code exists.  \n\
  **GREEN** — least production code that makes this assertion pass.  \n**REFACTOR**\
  \ — clean up while green. One test, one production change, one green — do not batch\
  \ all bodies first.\n\n### Arrange-Act-Assert\n\nLabel Arrange / Act / Assert; one\
  \ observable outcome per `it` (`observable-behavior` above). Split unrelated expects.\
  \ Shared construction → `beforeEach` / factory at three sibling dupes.\n\n### Rules\n\
  \n- **`red-then-green`** — Fail for the right reason before production code changes.\n\
  - **`minimum-green`** / **`code-minimalism`** — Least production code that makes\
  \ this assertion pass.\n- **`refactor-only-when-green`** — Refactor only while green.\n\
  - **`one-signature-at-a-time`** — One marker → green → next. Do not batch all bodies\
  \ first.\n- **`one-assertion-per-test`** —  one outcome per `it`. tighly connects\
  \ `expects`\n- **`layer-isolation`** — Mock only at architecture boundaries; never\
  \ the subject under test.\n- **`no-remaining-signatures`** — Zero `BDD: SIGNATURE`\
  \ markers when done.\n- **`full-surface-coverage`** — Before generating or satisfying,\
  \ scan the production source for all public members. Add `it should` entries for\
  \ every uncovered public method, property, or class. Complete coverage is required;\
  \ no public surface may be left untested.\n- **`context-sharing`** — Shared construction\
  \ in `beforeEach` / factory at three sibling dupes.\n- **`oo-api-design`** — Ask-don't-tell:\
  \ construct fully; own state on the object; operations on the closest domain concept.\n\
  - **`honors-documented-surface-contracts`** — Public API must match documented surface\
  \ contracts; if a spec fights the contract, fix the spec.\n- **`roundtrip-parity-is-required`**\
  \ — Adapter parse/render seams assert `counts(parse(render(canonical))) == counts(canonical)`.\n\
  - **`code-source-of-truth-guard`** — Tests reject unsafe regeneration when generation\
  \ can overwrite hand-edited code.\n- **`impl-must-carry-bdd-manifest`** — Impl paired\
  \ with `*_spec.py` carries `# @toolset-manifest … context_tools.bdd.bdd:Bdd`.\n\
  - **`observable-behavior`** — Assert public outcomes only.\n\n---\n\n## evals/backends-restate-shared-behavior/fail.md\n\
