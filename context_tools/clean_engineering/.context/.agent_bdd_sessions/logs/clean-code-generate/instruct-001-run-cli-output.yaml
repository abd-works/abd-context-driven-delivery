  \n### Module rules\n\n- **`high-cohesion`** — Classes inside a module share a common\
  \ purpose and operate on the same domain concept. Cross-class relationships within\
  \ the module are strong and semantic, not incidental.\n- **`low-coupling`** — Modules\
  \ depend on each other only through well-defined interfaces. Cross-module dependencies\
  \ are explicit and minimal — no module reaches into another's internals.\n- **`single-boundary`**\
