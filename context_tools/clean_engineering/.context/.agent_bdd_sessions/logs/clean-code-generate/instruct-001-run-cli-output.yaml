  context:\ntool: <tool name>\narguments:\n  <if needed>\n```\n\nRun: python -m tools\
  \ run -\n\nSuggested flow (repeat and reorder as the story needs):\n\n1. tool: read_cdr_format\n\
  \n2. tool: list_cdrs\n\n3. tool: write_cdr\n\n4. tool: create_diagram\n\n5. tool:\
  \ scan\n\n6. tool: repair\n\n7. tool: finish_turn\n\nRead `resources` from each\
  \ response before choosing the next tool."
