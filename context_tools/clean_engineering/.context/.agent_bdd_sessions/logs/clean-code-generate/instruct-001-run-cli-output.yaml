  \ lives under `.context/sessions/`** — the session folder is for sprint artifacts;\
  \ the context file belongs beside the source it describes.\n- **`output-format`**\
  \ — Written markdown is human-readable only. Strip template markup (`<!-- Mu -->`,\
  \ `<!-- Mv -->`, and similar) before writing. A module heading sits immediately\
  \ above its `- **Purpose:**` block — no blank line between them.\n- **`cohesive-file`**\
