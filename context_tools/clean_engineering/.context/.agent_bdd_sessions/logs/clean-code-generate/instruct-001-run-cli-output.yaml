  \ move down onto those members; keep everything inside the module folder (`physical-folder`).\n\
  - Refresh the **language companion** for terms now on the Public API — still no\
  \ typed signatures in prose ahead of code.\n\n### What is a class\n\nA class is\
  \ a named idea that earns its own identity because it has at least one of: **distinct\
  \ identity**, **state**, **behavior**, **structure**, or **interactions** that cannot\
  \ be collapsed into a property, instance, or subtype of something else.\n\nA class\
  \ knows things (**state**), does things (**behavior**), interacts with other things\
  \ (**interactions**), has (**relationships**) with other things, can be a sub type\
  \ of other things (**inheritance**), and can implement (**interfaces**) — finally,\
  \ it maintains the (**invariants**) that constrain it.\n\n### Responsibilities\n\
  \nFor each responsibility a class owns, ask: *hold something, do something, or both?*\
  \ A responsibility may be a property, an operation, or **both** — the class holds\
  \ state *and* exposes an action that works with it.\n\n### Properties\n\nThe class\
  \ must remember something across calls. Named as a **noun phrase**: *remaining budget*,\
  \ *active status*, *target character*. A **property** encapsulates information a\
  \ class exposes to its callers together with the logic required to access or update\
  \ it. A property may be **typed** — carries a concrete type like `Person`, `int`,\
  \ or `Car` or can be untyped.\n\n- **`use-property-not-accessor`** — Use `@property`\
  \ (or the language equivalent) for read-only computed values; do not use `get_`\
  \ / `set_` method prefixes.\n\n### Operations\n\nThe class must do something on\
  \ demand. Named as a **verb phrase**: *charge card*, *reserve seat*, *compute total*.\
  \ An **operation** is an action a class performs or a result it computes on demand.\
  \ Operations may be entirely stateless — depending only on their parameters — or\
  \ work with the class's own state.\n\n- **`keep-operations-single-responsibility`**\
  \ — Each operation has one reason to change — pure calculation or orchestration,\
  \ not both. An operation doing two things reveals either a missing operation or\
  \ a missing class.\n- **`separate-concerns`** — Pure calculation separate from I/O\
  \ and mutation.\n- **`use-clear-operation-parameters`** — Prefer 0–2 parameters.\
  \ When more configuration is needed, the extra parameters reveal a missing value\
  \ object — promote them to a new class and pass that instead.\n\n### Interfaces\
  \ (`I{Class}`) — optional\n\nA separate interface is **not generated by default.**\
  \ A type's public seam lives directly on `Class` itself unless a distinct `I{Class}`\
  \ contract is explicitly introduced. Add `I{Class}` only when:\n\n- **the user asks\
  \ for it** — at **model** or **code** fidelity, or\n- **the module genuinely has\
  \ multiple layers/implementations behind one seam** that need abstracting apart\
  \ — e.g. swappable backends, more than one concrete adapter, or a boundary hand-written\
  \ test fakes must satisfy independently of the production class.\n\nA single concrete\
  \ implementation with no swapping need does not warrant a separate interface — `Class`\
  \ itself **is** the seam. Do not add `I{Class}` \"for consistency\" with a sibling\
  \ module, and do not default to it just because a fidelity table mentions it.\n\n\
  **Default (no interface):** the public seam is the empty `Class` stub introduced\
  \ at **model** fidelity (properties/operations as empty contracts directly on `Class`,\
  \ in its own family file) and filled in at **code** fidelity. The `## code` Phase\
  \ 1 step of adding `Class(I{Class})` is skipped — there is no interface to implement.\n\
  \n**Opt-in (interface requested):** the public seam is a separate interface named\
  \ **`I{Class}`**, introduced at **model** fidelity. Properties and operations on\
  \ the interface are empty contracts — typed signatures with no body.\n\n| Channel\
  \ | `I{Class}` form |\n|---------|-----------------|\n| Python | `class IClass(ABC):`\
  \ with `@abstractmethod` / `@property`+`@abstractmethod` |\n| Java | `public interface\
  \ IClass` |\n| TypeScript / JavaScript | abstract or empty-method contract equivalent\
  \ |\n| Markdown | `### **I{Class}**` compact block (public members only) |\n\n**Code**\
  \ adds `Class` that **extends / implements** `I{Class}` in the **same file**. Public\
  \ members are filled on `Class`; private members are empty interfaces on `Class`\
  \ only — never added to `I{Class}`. `I{Class}` stays as the stable seam throughout\
  \ (including for hand-written test fakes). Existing production types may satisfy\
  \ `I{Class}` informally without a formal extends clause.\n\nEmpty vs filled is inferred\
  \ from the member body (`...` / empty vs real implementation) — no extra abstract\
  \ flag on the model.\n\n\n### Inheritance and subtypes\n\nA **base class** defines\
  \ the common identity, state, and behavior shared by a family of related things.\
  \ It owns everything that is true of every member of that family — the responsibilities,\
  \ rules, and collaborations that do not change regardless of which specific variant\
  \ you are dealing with.\n\nA **subtype** is a class that specialises the base by\
  \ adding or overriding behavior that only applies to it. The subtype inherits everything\
  \ the base defines and records **only the delta** — inherited responsibilities are\
  \ not repeated in the subtype. Use a subtype when the distinction changes what the\
  \ thing *does*, not just what data it carries.\n\n#### Liskov Substitution rule\n\
  \n**Anywhere the base is used, a subtype must work correctly in its place.** If\
  \ swapping in a subtype breaks or weakens a rule the base guarantees, the subtype\
  \ is not a true specialisation — it is a different thing that happens to share some\
  \ behavior.\n\n### Relationships\n\nRelationship kind and cardinality are added\
  \  here. Three kinds, chosen by lifecycle:\n\n1. **Composition** — owner controls\
  \ the other's lifecycle. (`Order` composes `OrderLine`.)\n2. **Aggregation** — collector\
  \ groups members that can outlive it. (`Playlist` aggregates `Song`. A **Repository**\
  \ aggregates the aggregate it collects — hollow diamond.)\n3. **Association** —\
  \ both sides are independent; they simply use each other. (`Customer` associates\
  \ with `SupportAgent`.)\n\nValue objects that merely describe (`Money` on a Transaction,\
  \ `PortingInfo` on a number) are **association** or a property — not composition\
  \ diamonds. Composition is for parts whose lifecycle the owner controls.\n\n###\
  \ Interactions (optional at this fidelity)\n\nAn **interaction** is one class's\
  \ operation calling another class's operation — who talks to whom, and about what.\
  \ You **may** name interactions at **model** fidelity to capture collaboration/sequencing\
  \ intent early; naming none is equally valid — this is optional, not a required\
  \ artifact for reaching model.\n\nReuse the exact notation from `templates/{tool}-sketch.md`'s\
  \ **Notation**/**Interaction rules** — do not invent a parallel bullet convention:\n\
  \nDo **not** invent `- **Interaction:** calls {Other}.{operation}` or use `- **Invariant:**\
  \ …` as the sketch/model collaboration marker — that is a parallel symbol set. Sketch/`##\
  \ model` interactions and notes use `->` / `//` only. Language companion's `- **Invariant:**\
  \ … <!-- L -->` and Spec's indented `Interaction:` / `Invariant:` labels are different\
  \ surfaces; neither replaces the sketch notation.\n\n- Nest `-> {collaborator}.{operation}`\
  \ directly under the calling operation — a real call on a held property, peer, or\
  \ `super`. No parameters, no body, just the receiver and the operation (or `x =\
  \ {collaborator}.{attribute}` for a field read).\n- Nest `// …` under the same operation\
  \ for any invariant or sequencing note — including looping/conditionals around the\
  \ call (e.g. `// once per {item} in {collection}`). Control flow is a `//` note,\
  \ never folded into the `->` line.\n- **`ce-comments-are-for-invariants-and-sequencing-notes-only`**\
  \ — `//` is must/never/always/before/after notes only. Do not use `//` for descriptive\
  \ prose, implementation asides, or cross-references.\n- `-> ClassName` alone (pointing\
  \ at a type, not an operation) is not an interaction.\n- Naming an interaction here\
  \ does **not** add a method to `I{Class}` or `Class` — it stays prose (or class-docstring\
  \ bullet) until **code**.\n- At **code** fidelity, any interaction named here becomes\
  \ a real `@interaction` abstract stub method on `Class` (not on `I{Class}`) — see\
  \ `## code` Phase 1 — and is dropped once implemented in Phase 2.\n\n### Invariants\
  \ (optional at this fidelity)\n\nAn **invariant** is a rule that must hold for every\
  \ valid instance of the class, regardless of which operation last ran. You **may**\
  \ state invariants at **model** fidelity in plain English; leaving them unstated\
  \ is equally valid — this is optional, not a required artifact for reaching model.\n\
  \n- State a class-level invariant (one that holds regardless of which operation\
  \ ran, not tied to one call) the same way: a `// …` line, on the class rather than\
  \ nested under one operation (e.g. `// remaining budget never goes negative`).\n\
  - An invariant named here is prose only — it does not gate any method body until\
  \ **code**.\n- At **code** fidelity, any invariant named here gets pinned down as\
  \ a **comment** (not an enforcement method) on `Class` — see `## code` Phase 1 and\
  \ Phase 2.\n\n### Class Rules\n\nBefore promoting a term to its own class, check\
  \ whether it fits as a **property** (see *Properties*), an **instance** (see *Instances*),\
  \ or a **subtype** (see *Inheritance and subtypes*). Only when none of those three\
  \ fit does something deserve its own class.\n\n- **`keep-classes-single-responsibility`**\
  \ — Each class has **one reason to change**.\n- **`hide-inner-details`** — Expose\
  \ **behavior** through named methods; callers see what the class does, not how it\
  \ stores or arranges its information.\n- **`eliminate-duplication`** — Repeated\
  \ logic gets one canonical function.\n- **`prefer-class-operations`** — Factory\
  \ and lifecycle operations are **static methods on the class**, not module-level\
  \ exported functions (`ParadiseMobile.initialize(config)`, not `export async function\
  \ open()`). Private helpers used from one class belong on that class.\n- **`use-explicit-dependencies`**\
  \ — Pass every collaborator through the **constructor**; never reach for a global\
  \ or construct a collaborator inside construction.\n- **`use-intention-revealing-names`**\
  \ — Every name — class, property, operation, parameter — answers \"why does this\
  \ exist?\" No abbreviations, no single-letter identifiers outside trivial loop indices.\n\
  - **`use-consistent-naming`** — One word per concept across the model. Pick one\
  \ verb and use it everywhere (`fetch_`, not a mix of `fetch_`, `get_`, and `retrieve_`).\n\
  - **`reuse-existing-not-invent-parallel`** — When a class wraps or renders an existing\
  \ type, name it after that type (`CatalogContextTool` wraps `BaseContextTool`; `CatalogAction`\
  \ wraps `Action`). Do not invent a parallel domain noun for the same concept — especially\
  \ not a retired synonym the project has already replaced (Foundry **Practice** →\
  \ CDD **context tool**). Explicit old→new mapping rows (and overview lines that\
  \ *state* the replacement) are allowed; live class names, constructor args, and\
  \ row/registry/toolset labels are not.\n- **`reuse-established-notation-not-a-parallel-one`**\
  \ — Interactions/invariants at sketch and `## model` reuse `->` / `//`; never invent\
  \ a bold-bullet parallel (`- **Interaction:**` / `- **Invariant:**` as collaboration\
  \ markers). Language companion `- **Invariant:** <!-- L -->` and Spec indented labels\
  \ are different surfaces.\n- **`ce-comments-are-for-invariants-and-sequencing-notes-only`**\
  \ — `//` comments are must/never/always/before/after notes only. Not narrative,\
  \ not “transient value object”, not cross-references between atoms.\n- **`do-not-invent-parallel-object-models`**\
  \ — Do not invent a parallel object model when existing objects already carry the\
  \ data a new requirement needs. Wrap or extend the live hierarchy instead; do not\
  \ scrape the same information into a second `*Model` / `*Entry` (or similar) family.\n\
  \n### Example factories (Fake / Isolated / Production **modes**)\n\nWhen a type\
  \ is used from **Stories** (helpers / scenario setup), the factory lives in a sibling\
  \ file, separate from the production family:\n\n| File | Contents |\n|---|---|\n\
  | `{family}.{ext}` | (optionally **`I{Type}`** +) production **`{Type}`** (+ subtypes\
  \ / peers) — production family only |\n| `{type}_example_factory.{ext}` | (optionally\
  \ **`I{Type}ExampleFactory`** +) **`{Type}ExampleFactory`** + `examples[{example_key}]`\
  \ |\n\n`I{Type}` and `I{Type}ExampleFactory` follow the same **opt-in** rule as\
  \ any other interface (see § Interfaces) — default to the concrete `{Type}` / `{Type}ExampleFactory`\
  \ directly; only introduce the interface pair when requested or genuinely needed\
  \ for abstraction. The two decisions are independent: a domain type can skip its\
  \ interface while its factory keeps one (or vice versa).\n\nDo **not** put factory\
  \ wiring in the production family file. Do **not** generate `Fake{Type}` / `Isolated{Type}`\
  \ / `Production{Type}` subclasses — those are **usage modes**, not an inheritance\
  \ tree.\n\n**PATTERN** (see also `templates/clean_engineering-sketch.md` and templates):\n\
