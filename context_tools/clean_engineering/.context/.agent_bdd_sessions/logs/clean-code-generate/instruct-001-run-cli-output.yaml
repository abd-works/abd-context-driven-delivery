  \ companion                                             <!-- L -->\n\n*ShoppingCart*\
  \ is a running tally of what a customer intends to buy in a single shopping session.\n\
  \n### shopping_cart                                                  <!-- L -->\n\
  \n- Belongs to exactly one *Customer* whose identity anchors the cart. <!-- L -->\n\
  - Collects *CartItems* as the customer browses and keeps the running total current.\
