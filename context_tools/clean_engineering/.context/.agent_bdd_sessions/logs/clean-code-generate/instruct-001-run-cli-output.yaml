  \ mocks);\n    Production: {ClassName}(real collaborators).\"\"\"              \
  \       # L\n\n    def load_{example_key}(self, *, mode: str = \"fake\") -> I{ClassName}:\
  \  # S\n        # examples[{example_key}] -> I{ClassName} (+ peer types if needed)\
  \  # S\n        ...                                                            \
  \ # S/C\n\n\n\nWrite the fidelity artifact under the session.\n\nWhen ``format``\
  \ is ``drawio``, call ``drawio.render`` (create diagram →\nscan layout rules in\
  \ drawio contexts → repair sub-agent on definitive\nlayout failures). Otherwise\
  \ produce the active channel output\n(markdown / python / …) from contexts, examples,\
  \ and templates — do\nnot invoke drawio.render.\n\n# Render\n\nCreate a Draw.io\
  \ class (or modules) diagram, then **validate** layout rules, then **repair** on\
  \ failure.\n\nLayout violations are always a **coding** problem in the render/layout\
  \ path (`drawio_class_model.py` / `drawio_tools.py`) — never hand-edit the `.drawio`\
  \ to greenwash scanners while leaving the generator broken. Follow the shared **repair**\
  \ loop (faultyAsset / repairedAsset under `examples/evals/`).\n\n## Steps\n\n1.\
  \ **Create** — call `create_diagram` with the source model text (or path). When\
  \ the user asks to keep positioning, pass `keep_positioning=true`: look for an existing\
  \ `.drawio` at the output path, update matching class contents in place, leave existing\
  \ relationship routing, and layout only new classes/edges. Full regeneration (the\
  \ default) destroys manual positioning.\n2. **Validate** — load **contexts** (`drawio.md`)\
  \ and run **scan** on the written `.drawio` path(s). Definitive failures: `edges-do-not-cross-classes`,\
  \ class overlap, `base-above-derived`. Minimize: overlap / shared-anchor / approach.\n\
  3. **Repair** — when scan reports definitive layout violations, invoke **repair**\
  \ as a **sub-agent** with `asset` = the diagram path and `violation` = the scan\
  \ report. Repair fixes the **generator**, regenerates, and re-validates until clean.\n\
  \nDo not declare the diagram done while `edges-do-not-cross-classes` (or class overlap)\
  \ violations remain.\n\n\nJudge the diagram against drawio contexts; call scan on\
  \ the asset paths under review.\n\n# Contexts\n\nRules for rendering and auditing\
  \ UML class diagrams in Draw.io under clean engineering. Layout is a judgment call\
  \ constrained by these rules — not a script dump. Prefer incremental edits when\
  \ a `.drawio` already exists; full regeneration destroys manual positioning. Pass\
  \ **`keep_positioning=true`** on `render` / `create_diagram` (or `transform` with\
  \ `previous` XML) to update class contents in place, leave existing relationship\
  \ routing, and layout only new classes.\n\n**Scanners** live under `scanners/` (`*_scanner.py`,\
  \ rule slug = `RULE` / filename). Run them via the Drawio kit **scan** / **validate**\
  \ after every **render**; iterate until hard violations are gone. On failure, **repair**\
  \ (sub-agent) fixes the layout generator.\n\n---\n\n## Page and hierarchy\n\nOne\
  \ page per module / Key Abstraction (KA). Page name matches the module/KA name.\
  \ Local classes live on that page; cross-boundary types appear as **imported** cards\
  \ at the top.\n\n- **`class-title-no-markdown-bold`** — Class titles are plain text\
  \ inside the HTML `<b>` tag. Do not bake markdown `**name**` into the label; bold\
  \ is already the `<b>` wrapper. `**Prospect**` displayed inside `<b>` shows the\
  \ asterisks.\n- **`stereotype-above-class-name`** — UML stereotype sits **above**\
  \ the class name on its own line, italic, not bold. The class name is bold. Do not\
  \ put `<<Stereotype>>` on the same line as the name inside `<b>`.\n\n### Hierarchy\
  \ rules\n\n- **`base-above-derived`** — Base and imported ancestor classes sit at\
  \ higher vertical positions (lower `y`) than their derived classes. Inheritance\
  \ arrows point **upward** (child → parent). Sibling subtypes share a `y` row side\
  \ by side below the parent. Do not put a base below its children, and do not flatten\
  \ grandchild and grandparent onto the same row.\n- **`cross-model-ancestors-on-page`**\
  \ — When a local type extends or uses a type from another module/KA, import the\
  \ **full ancestor chain** needed to read the ancestry — grandparents included —\
  \ at the top of the page. Imported cards use a **dashed border** and a `«from: Module/KA\
  \ Name»` stereotype above the class name; show only key properties (enough to recognise\
  \ the type). Do not render imports as solid local cards, and do not omit a grandparent\
  \ that explains where the immediate parent comes from.\n- **`module-spatial-cohesion`**\
  \ — Classes of the same module/KA form a tight cluster (short internal edges). Different\
  \ modules/KAs on the same page sit with a clear gap (~200px+). Cross-boundary edges\
  \ may be longer — that length is the signal. Instance notes sit beside their class\
  \ inside the cluster, not in the gap. On multi-module pages, if mental bounding\
  \ boxes overlap, reposition until they separate. A single-module page satisfies\
  \ cohesion by default — still avoid scattering classes unnecessarily far apart.\
  \ Wrap long edge labels; leave ~60–80px corridors so labels do not sit on boxes.\n\
  - **`aggregate-layout-cohesion`** — Cluster an aggregate root with its members and\
  \ its repository. Do not insert unrelated objects (auth cards) in the gap between\
  \ a root and its value objects. Repositories sit beside the aggregate they collect.\n\
  - **`repository-aggregation-diamond`** — A Repository relates to its aggregate with\
  \ an aggregation (hollow diamond) and a `<<Repository>>` tag. A repo with no diamond\
  \ is an unlabeled box, not a collection.\n- **`leaf-nodes-not-in-horizontal-row`**\
  \ — A hub with 4+ leaf neighbours must not place those leaves in one wide horizontal\
  \ row (same `y`, large `x` span). Fan leaves into multiple rows or a compact cluster.\n\
  \n---\n\n## Edge routing\n\nAn edge relates exactly two classes. Routing that cuts\
  \ a third class, stacks on another edge, or shares a default anchor makes relationships\
  \ unreadable.\n\n### Routing rules\n\n- **`prefer-short-routes`** — Related classes\
  \ sit near each other so arrows stay short. Prefer **0–2** explicit waypoints; more\
  \ than 2 across a short gap is a violation. Endpoint boxes should leave only a small\
  \ clear gap (≲320px — about one intervening card or row gutter). Do not park imports\
  \ far from the locals they link to, and do not stretch a tall single-column stack\
  \ when a 2–3 column pack would keep ownership edges short. Cross-boundary length\
  \ is a signal only when two *modules* share one page — on a single-module / per-aggregate\
  \ page, every edge should be short.\n- **`edges-do-not-cross-classes`** — No edge\
  \ segment may enter the bounding box of any class except its two endpoints. Prefer\
  \ exit/entry sides that keep obstacles off the direct path; otherwise add explicit\
  \ waypoints so the edge dog-legs around the obstacle. Do not rely on Draw.io’s auto-router\
  \ for long inheritance edges across siblings.\n- **`edges-do-not-overlap-edges`**\
  \ — Two orthogonal edges must not share the same column or row for more than ~12px.\
  \ Spread parallel runs ~20–40px apart with waypoints, and give each edge a unique\
  \ exit/entry on a shared side.\n- **`edges-do-not-cross-other-edges`** — Transverse\
  \ crossings (one segment through another) are distinct from collinear overlap —\
  \ both fail readability; crossings are definitive.\n- **`distinct-anchor-points`**\
  \ — When two or more edges leave or arrive on the same side of a class, assign explicit\
  \ `exitX`/`exitY` or `entryX`/`entryY` so paths are visually distinct. Do not leave\
  \ a shared side on the default center anchor for every edge.\n- **`edges-approach-perpendicular`**\
  \ — The first and last segments must hit the exit/entry side head-on (perpendicular),\
  \ not slide along the class border.\n\n### Audit\n\n- **`run-audit-after-every-render`**\
  \ — After every generate or layout change, run Drawio **scan** / `audit_diagram_report`\
  \ and iterate until done. Priority:\n  1. class box overlap → **must be zero**\n\
  \  2. **`edges-do-not-cross-classes`** → **must be zero**\n  3. **`prefer-short-routes`**\
  \ → **must be zero** (excessive gap / >2 waypoints)\n  4. **`edges-do-not-overlap-edges`**\
  \ / **`edges-do-not-cross-other-edges`** → **minimize** / definitive\n  5. **`distinct-anchor-points`**\
  \ / **`edges-approach-perpendicular`** → **minimize**\n\n  Use orthogonal inheritance\
  \ routing when a subtype is not directly under its parent. Do not skip the audit\
  \ because the layout “looks right” during generation.\n\n---\n\n## Domain Language\
  \ → diagram\n\nWhen the source is a Domain Language file (`*-domain-language.md`,\
  \ `state: domain-language`), the diagram uses the same card / row / collaborator\
  \ shape as a domain model, but structure comes from prose, not typed blocks.\n\n\
  | ULL element | Diagram element |\n|---|---|\n| `## KAName` / module heading | One\
  \ page named exactly that |\n| `### concept_name` | One class card |\n| Verb-led\
  \ behavior bullet | One row: `<bullet text> : <Collaborator>, …` |\n| `*italicized*`\
  \ terms in a bullet | Collaborator list on that row |\n| `**Invariant:** …` bullet\
  \ | Row in the invariant compartment |\n| `### Subtype *is a type of* Base` | Inheritance\
  \ edge child → parent |\n| Stub whose first bullet is `is a property of *parent*`\
  \ | Property row on parent, or lightweight stub with `«property of: Parent»` |\n\
  | `### term *(boundary)*` | Imported dashed card with `«boundary: OwningModule»`\
  \ |\n| Parenthetical primitive (e.g. `(integer)`) | Inline value on the row — no\
  \ separate card |\n\n### Mapping rules\n\n- **`ull-bullets-become-rows`** — One\
  \ card per `### concept`, one row per behavior bullet (italic markers stripped;\
  \ collaborators = italicized terms). Fold duplicate cross-concept references into\
  \ **one** association edge. Inheritance comes only from `*is a type of*` headings\
  \ — do not also draw an association to the base for inherited behavior. Boundary\
  \ stubs are dashed imports; property stubs are a parent row or a `«property of:\
  \ …»` stub. Do not drop bullets, italic terms, or invariants; do not invent type\
  \ annotations the source lacks; do not emit one edge per bullet hit; do not treat\
  \ italic terms inside `**Invariant:**` lines as association edges (invariants never\
  \ produce edges).\n\n**Notes**\n\n- Italicized terms must already resolve to named\
  \ concepts in the Domain Language source — fix unresolved italics upstream; do not\
  \ invent cards here.\n- Domain Language sync-to-model is one-way for **new/deleted\
  \ concepts** only. Bullet text does not round-trip; prose in markdown remains authoritative.\n\
  \n---\n\n## Relationship notation (class view)\n\nReuse clean engineering relationship\
  \ kinds on Draw.io edges (hollow triangle for inheritance; filled/unfilled diamond\
  \ for composition/aggregation; open arrow for association). Cardinality and navigability\
  \ belong on the edge when the source model states them. Modules-view diagrams use\
  \ dependency arrows and containment nesting instead — see `drawio_class_model.py`\
  \ — not these UML edge styles.\n\nSeparate tools run — toolset: `context_tools.clean_engineering.class_model.drawio.drawio:Drawio`\
  \ action: `repair`\n\nPrepend the following block verbatim as the very first lines\
  \ of the file you are writing - before any imports, before any code.\n\nRan SessionLog.append\
  \ (plain): error cannot evaluate plain-call argument type(tool).manifest_path\n\n\
  Finish the turn that hangs off the work session.\n\nEvery tool call uses this shape\
