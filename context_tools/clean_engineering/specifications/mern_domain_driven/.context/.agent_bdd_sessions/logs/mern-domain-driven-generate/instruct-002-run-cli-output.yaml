  \ view files (`app-client/<Feature>View.tsx`,\n`<domain>/client/<Entity>ListView.tsx`,\
  \ …) — it does not call `ux` itself.\n\n## examples.md\n\n# Examples\n\nOne worked\
  \ vertical slice - **recipients**, from the wire-payment feature -\ncarried over\
  \ from the old-world spec's walkthrough. Shows every rule in\n`mern_domain_driven.md`\
