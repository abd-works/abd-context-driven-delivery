  \n## Domain module organization\n\n- **`organize-by-domain-module`** — `packages/<domain>/{shared,client,server}`\
  \ present, each with the required tier files; composition roots (`app-server/`,\
  \ `app-client/`) present.\n- **`share-domain-logic`** — entities, value objects,\
  \ Zod schemas, and business rules defined once in `shared/`; every tier extends\
  \ from there, never re-derives.\n- **`maintain-layer-purity`** — `shared/` is framework-free\
  \ (no Express, no React, no Mongo driver); `client/` and `server/` never cross-import\
  \ each other.\n\n## Naming / layering\n\nEvery artifact instantiates from the domain\
  \ — file, class, and method names\nderive from domain classes/operations. `shared/`\
  \ keeps plain domain names\n(`Recipient`, `Recipients`); every extension in `client/`\
  \ or `server/` adds a\nlayer qualifier (`RecipientClient`, `RecipientsServer`, `RecipientApi`,\n\
  `RecipientRouter`, `RecipientRepositoryServer`). `Domain` is never part of a\nclass\
  \ name.\n\n| Layer | Qualifier | Example |\n|---|---|---|\n| `shared/` | *(none)*\
  \ | `Recipient`, `Recipients`, `RecipientRepository` |\n| `client/` | `Client`,\
  \ `Api` | `RecipientClient`, `RecipientsClient`, `RecipientApi` |\n| `server/` |\
  \ `Server`, `Router`, `RepositoryServer` | `RecipientsServer`, `RecipientRouter`,\
  \ `RecipientRepositoryServer` |\n\n- **`use-ubiquitous-language`** — names come\
  \ from the domain model; no `Manager`, `Handler`, `Helper`, or `Domain*` prefixes/suffixes.\n\
  - **`cross-layer-method-naming`** — the same `{verbNoun}` method stem flows through\
  \ every tier where an operation appears (shared → client → server → route → API).\n\
  - **`preserve-arg-names-across-layers`** — argument names stay identical across\
  \ layer boundaries; only types narrow.\n- **`property-casing-transform`** — `camelCase`\
  \ in TypeScript; `snake_case` in JSON and MongoDB documents.\n- **`consistent-view-naming`**\
  \ — React components end in `View` or `CardView`; never `Page`.\n\n## App server\
  \ / routes\n\n- **`delegate-routes-to-domain-server`** — route handlers are thin:\
  \ parse the request, delegate to a server-side domain class in `<domain>-server`;\
  \ never call the repository or apply shared-domain logic inline.\n- **`ensure-type-safe-routes`**\
  \ — route handlers compile without implicit `any`; `req.user` and other request\
  \ extensions are typed.\n- **`standard-mutation-response`** — every mutation on\
  \ the same aggregate returns the same response shape.\n\n## Types & entities\n\n\
  - **`implement-domain-entities-correctly`** — business rules live on domain classes;\
  \ the Zod schema validates at the repository boundary, not inline in routes or views.\n\
  - **`implement-full-interfaces`** — every `implements` clause covers all interface\
  \ members; no stub no-ops standing in for real behavior.\n\n## Packaging\n\n- **`use-valid-package-names`**\
  \ — `package.json` names are valid npm-scoped names (`@scope/domain-tier`) derived\
  \ from the domain and tier; no placeholder scopes (`@project`, `@acme`, `@app`,\
  \ …); no phantom imports.\n- **`include-all-external-dependencies`** — every import\
  \ has a declared dependency; the project compiles after a clean install.\n\n## Testing\
  \ architecture\n\nCompanion to `stories`'s `acceptance_tests` fidelity — this tool\
  \ pins the\ngeneric `*_spec.{tier}` to `tier ∈ {server, client, e2e}` and the stub\
  \ policy\nper tier. Domain unit tests (always present, live beside the class, not\
  \ under\nthis tool) are a separate always-on layer.\n\n| Tier | Real | Stubbed |\
  \ Entry point |\n|---|---|---|---|\n| domain unit | shared domain classes | nothing\
  \ | class method call |\n| server | domain + repository + test DB | nothing | Supertest\
  \ → Express route |\n| client | React tree + hooks + client domain | `<Entity>Api`\
  \ via `vi.mock` | Testing Library render |\n| e2e | full stack | nothing | Playwright\
  \ `page.goto` |\n\nA base helper (`<sub-epic>.base.ts`) carries Given/When/Then\
  \ vocabulary in\nbusiness terms; each tier helper extends it with the same names,\
  \ different\nmechanism underneath. Prefer building tier helpers from `stories`'\n\
  `{Type}ExampleFactory` (`Isolated` mode = ctor-injected mocks for the server\ntier's\
  \ collaborators, `Production` mode = real collaborators) over hand-rolled\nfixtures.\n\
  \n- **`test-story-driven`** — tests mirror the story hierarchy (epic → folder, sub-epic\
  \ → file, story → `describe`, scenario → `it`); Given/When/Then helpers present\
  \ at all three tiers.\n- **`scaffold-test-scripts`** — `scripts/test.sh`, `test.ps1`,\
  \ `test-e2e.sh`, `test-e2e.ps1` present at the workspace root; unit/component and\
  \ E2E runners stay separate (Vitest vs Playwright), and `vitest.config.ts` / `playwright.config.ts`\
  \ don't pick up each other's spec files.\n- **`use-thorough-e2e-tests`** — E2E tests\
  \ are independent (no blanket deletes between tests); `app-client` must exist and\
  \ serve the real frontend before E2E tests can pass.\n\n## UX hand-off\n\nScreens\
