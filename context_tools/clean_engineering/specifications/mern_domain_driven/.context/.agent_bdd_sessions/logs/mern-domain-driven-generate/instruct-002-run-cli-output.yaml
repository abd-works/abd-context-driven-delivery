  \  beneficiaryBank: BeneficiaryBankSchema,\n  createdAt: z.coerce.date(),\n});\n\
  ```\n\n```typescript\n// packages/recipients/shared/Recipient.ts\nexport class Recipient\
  \ {\n  constructor(private readonly dto: RecipientDto) {}\n\n  get id(): string\
  \ { return this.dto.id; }\n  get name(): string { return this.dto.name; }\n  get\
  \ bankName(): string { return this.dto.beneficiaryBank.name; }\n\n  static fromDto(dto:\
  \ RecipientDto): Recipient {\n    return new Recipient(dto);\n  }\n}\n```\n\n```typescript\n\
  // packages/recipients/shared/Recipients.ts - collection class, domain query methods\n\
  export class Recipients {\n  constructor(protected readonly items: Recipient[])\
  \ {}\n\n  filterByStatus(status: string): Recipients {\n    return new Recipients(this.items.filter(r\
  \ => r.dto.status === status));\n  }\n\n  toArray(): Recipient[] { return this.items;\
  \ }\n}\n```\n\n```typescript\n// packages/recipients/shared/RecipientRepository.ts\
  \ - interface, implemented server-side\nexport interface RecipientRepository {\n\
  \  findByEnterprise(enterpriseId: string): Promise<Recipient[]>;\n}\n```\n\nNote\
  \ the naming: bare `Recipient` / `Recipients` in `shared/` (no `Domain`\nprefix),\
  \ the interface named after the concept (`RecipientRepository`), not\n`RecipientRepositoryInterface`.\n\
  \n## server/ - route delegates, server domain owns the operation, repository validates\
  \ at the boundary\n\n```typescript\n// packages/recipients/server/recipients.routes.ts\n\
  router.get('/', async (req, res) => {\n  const enterpriseId = (req as any).user.enterpriseId;\n\
  \  const activeOnly = req.query.activeOnly === 'true';\n  const recipients = await\
  \ RecipientsServer.loadByEnterprise(enterpriseId, repo, { activeOnly });\n  res.json({\
  \ recipients, total: recipients.length });\n});\n```\n\n```typescript\n// packages/recipients/server/RecipientsServer.ts\
  \ - extends shared, owns the operation\nexport class RecipientsServer extends Recipients\
  \ {\n  static async loadByEnterprise(\n    enterpriseId: string,\n    repo: RecipientRepository,\n\
  \    opts?: { activeOnly?: boolean },\n  ): Promise<Recipient[]> {\n    const all\
  \ = await repo.findByEnterprise(enterpriseId);\n    let collection: Recipients =\
  \ new Recipients(all);\n    if (opts?.activeOnly) {\n      collection = collection.filterByStatus('Active');\n\
  \    }\n    return collection.toArray();\n  }\n}\n```\n\n```typescript\n// packages/recipients/server/recipients.repository.ts\
  \ - implements RecipientRepository, validates via Zod\nexport class RecipientRepositoryServer\
  \ implements RecipientRepository {\n  async findByEnterprise(enterpriseId: string):\
  \ Promise<Recipient[]> {\n    const docs = await this.collection.find({ enterpriseId\
  \ }).toArray();\n    return docs.map(doc => Recipient.fromDto(RecipientSchema.parse(doc)));\n\
  \  }\n}\n```\n\nThe route never calls `repo.*` or shared-domain logic itself - it\
  \ delegates\nstraight to `RecipientsServer.loadByEnterprise()` (`delegate-routes-to-domain-\n\
  server`). The repository is the only place `RecipientSchema.parse()` runs on\nraw\
