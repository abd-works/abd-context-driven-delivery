  \ />\n    </main>\n  );\n}\n```\n\nEvery component ends in `View` (`consistent-view-naming`);\
  \ `RecipientCardView`\ncalls `recipient.cardCssClass(isSelected)` rather than computing\
  \ the class\nname inline - DOM-adjacent behaviour still lives on client domain JS,\
  \ not the\nJSX.\n\n## Known gap in the ported templates\n\n`templates/{domainName}/server/{domainName}.routes.ts`\
