  \ helpers), see `stories`' own\n`acceptance_tests`-fidelity examples - this tool\
  \ only adds the tier pinning\nand stub policy documented under **Testing architecture**\
  \ above.\n\n## shared/ - domain classes, no framework imports\n\n```typescript\n\
  // packages/recipients/shared/recipient.schema.ts\nexport const RecipientSchema\
  \ = z.object({\n  id: z.string().uuid(),\n  name: z.string().min(1, 'Beneficiary\
