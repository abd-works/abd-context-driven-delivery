  \      <footer><p>{selectedCount} recipient(s) selected</p></footer>\n    </div>\n\
  \  );\n}\n```\n\n```typescript\n// packages/recipients/client/RecipientCardView.tsx\n\
  export function RecipientCardView({ recipient, isSelected, onToggle }: RecipientCardViewProps)\
