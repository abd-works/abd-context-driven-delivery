instructions: "# Generate\n\n1. Follow **`session_guidance`** and the session tools\
  \ (`read_context_index`, `record_context_root`, `create_session` when needed). Resolve\
  \ workspace + tool root, then use the **`active`** resource for `active.path` /\
  \ `active.folder`.\n2. **MUST — prove-read before asking.** Before any grill/iterate\
  \ question (and before inventing options or story/module names):\n   - Identify\
  \ **every relevant context file referenced or implied** by the decision — not one\
  \ favorite type. Typical set: `{workspace}/.context/context-index.md`, owning `*-segment.md`,\
  \ `module-context.md`, session grill-answers / sketches / handoff, peer story-context,\
  \ build-order, and any path the plan or prior answers cite. Include index/overlay\
  \ only for structure hints; **never** treat mid-epic stub columns as inventory.\n\
  \   - **Read each of those files with the Read tool** (chunk through large ones).\
  \ Grep, title lists, memory, or primer-only skims **do not count**.\n   - **Prove\
  \ it in the question turn:** name the path(s) read and ground options in concrete\
  \ terms from them. If you cannot cite specifics from the relevant files, you have\
  \ not read them — go read before asking.\n   - Asking from a skim is a **defect**,\
  \ same class as dumping a whole artifact in one iterate tick.\n3. **`sources-scoped-to-generated-context`**\
  \ — Hang `**Sources / context:**` on the node they ground: epic / sub-epic / feature\
  \ / module, or a lower item (scenario, class, screen, component, …). Root or parent-level\
  \ Sources are fine when those files apply to the **entire** artifact or subtree.\n\
  4. Apply all guidance and named rules in each **context** — each bullet is a requirement.\n\
  5. Match **examples** for shape, depth, and tone.\n6. Fill the **template** scaffold\
  \ and save the artifact under the session layout from `session_guidance`.\n7. Follow\
  \ any extra build steps included in your instructions when present.\n8. Run **validate**.\
  \ If it fails, fix the artifact and **validate** again until it passes.\n\n---\n\
  \n# Generate\n\n1. Confirm fidelity and format (defaults above).\n2. Read this file\
  \ — shared rules + active fidelity.\n3. **MUST** follow base `generate` step 2:\
  \ before any grill/iterate question, prove-read every relevant referenced context\
  \ for that decision (segments, module-context, grill-answers, story-context, build-order,\
  \ cited paths, …). Index mid-epic stubs are not inventory. Apply `read-all-source-context-in-full`.\n\
  4. Use peer actions when useful (`grill`, `sketch`, `iterate`; `sketch-template.md`).\n\
  5. Fill templates for the active fidelity.\n6. Run **validate**.\n\nOpen the workspace\
  \ session in one step: set path (durable root), ensure the sprint exists (create\
  \ if missing), load context index if present, record this tool's root when keyed.\
  \ Follow session_guidance. Scope durable work to path and sprint docs to folder.\n\
  \n# Session Guidance\n\n`Session` tracks three things:\n\n| Name | Meaning | Example\
  \ |\n|------|---------|---------|\n| **path** | Durable tool root (`active.path`)\
  \ | `…/sandbox` |\n| **folder** | Sprint folder (`active.folder`) | `…/sandbox/.context/sessions/{name}/`\
  \ |\n| **context_index** | `{workspace_root}/.context/context-index.md` when present\
  \ | tool → root map |\n\n## Constructor / run context\n\n- `workspace` — workspace\
  \ root where `context-index.md` lives (default `\".\"`)\n- `path` — durable tool\
  \ root\n- `session` — sprint slug under `{path}/.context/sessions/{name}/`\n\n##\
  \ One call to open\n\n**`open`** — single action before generate / grill / sketch\
  \ / iterate / validate:\n\n1. Resolve durable root (`path`)\n2. Ensure sprint exists\
  \ (load or create)\n3. Load context index if present\n4. Record this tool's root\
  \ when `context_index_key` is set\n\n```yaml\naction: open   # via self.workspace().open()\
  \ from BaseContextTool\n```\n\nDo **not** separately chain bind + read_context_index\
  \ + record_context_root from lifecycle bodies — `open` already does that.\n\n##\
  \ Layout\n\n- **path** — docs → `{path}/.context/`; code/modules → `{path}/`\n-\
  \ **folder** — `session.md`, grill-answers, engagement sketches, handoff, `to-fix.log`\n\
  - **context-index** — `{workspace_root}/.context/context-index.md`\n\n## Root when\
  \ `path` omitted\n\n1. context-index entry for `context_index_key`\n2. else `{workspace_root}/{default_workspace_folder}`\n\
  \nResource `active` = Session(path='tests', name=None).\n\nOffer and write Context\
  \ Decision Records (CDRs) sparingly as decisions crystallise during the wrapped\
  \ action - never batch; never invent decisions.\n\nStep 1 - Read the format once\
  \ via read_cdr_format. Internalise the three-criteria gate and the minimal template.\n\
  \nStep 2 - Optionally call list_cdrs(root) so you do not re-record an already-captured\
  \ decision.\n\nStep 3 - During the session (grill, sketch, or generate), watch for\
  \ decisions that meet ALL three: hard to reverse, surprising without context, and\
  \ a real trade-off. If any criterion is missing, skip the CDR.\n\nStep 4 - When\
  \ a qualifying decision crystallises, offer a CDR briefly (title + one-line gist).\
  \ If the user accepts, call write_cdr immediately with a kebab slug and content\
  \ matching CDR-FORMAT.md. Do not batch; do not wait until the end.\n\nStep 5 - Keep\
  \ CDRs short. Prefer a single paragraph. Add Status / Considered Options / Consequences\
  \ only when they add genuine value.\n\n# Contexts\n\nMap stakeholder and system\
  \ interactions as behaviours that deliver a solution. Deepen fidelity; never invent\
  \ detail from a deeper level.\n\nInteractions fit into a hierarchy: a `StoryMap`\
  \ of `Epic` → nestable `SubEpic` → `Story`. Each story is `Scenario`s with discrete\
  \ steps; backgrounds and scenarios carry examples (from CE `{Type}ExampleFactory`\
  \ when available — never invent rows in story files).\n\n| Fidelity | Default Format\
  \ | Produce |\n|---|---|---|\n| **discovery** | markdown | Story map + thin-slice\
  \ |\n| **exploration** | python | One main-flow scenario per story (fake + public\
  \ seam); optional variations |\n| **engineering** | python | `*_spec` + `*_spec.{tier}`\
  \ |\n\n**Templates** live under `templates/` per format. **Scanners** read the canonical\
  \ model only — never language syntax.\n\n---\n\n## Shared rules\n\n- **`verb-noun-format`**\
  \ — Name Epic / SubEpic / Story verb–noun; actor is metadata; base verb form.\n\
  - **`four-to-nine-children`** — 4–9 direct children (warn at 3/10; error ≤2 or ≥11).\n\
  - **`behavioral-observable-outcomes`** — Name and Then in domain-observable terms;\
  \ never internals.\n- **`branch-on-mechanical-uniqueness`** — Explore context relentlessly\
  \ for distinct mechanics. Branch on mechanical uniqueness, dstinct mechanics in\
  \ requirements require *distinct stories* for each mechanic. Different requirement\
  \ entries with same mechanic is *one story only with different examples or scenarios*.\
  \ Collapsing real mechanical variation, as well as mindlessly turning requirements\
  \ into long lists of stories are **defect**\n- **`vocabulary-traces-to-domain-source`**\
  \ — Trace terms to domain language / model when present.\n- **`artifacts-mirror-story-hierarchy`**\
  \ — Mirror Epic → SubEpic → Story on disk.\n- **`right-size-story-nodes`** — One\
  \ demonstrable interaction per story.\n- **`read-all-source-context-in-full`** —\
  \ Before locking hierarchy **and before any grill/iterate question about a seam**,\
  \ prove-read **every relevant referenced context** for that decision: owning `*-segment.md`,\
  \ `module-context.md`, session sketches / grill-answers / handoff, peer story-context,\
  \ build-order, and any path the plan or prior answers cite. Index / mid-epic stub\
  \ columns are structure hints only — **not** story inventory. Grep or primer-only\
  \ skims do not count; cite concrete terms from the files read in the question turn.\
  \ Also re-read these rules. Do not thin from titles or memory!\n\n---\n\n## discovery\n\
  \n**Format:** markdown · **Produce:** named stories under activities + thin-slice\
  \ order.\n\n**Do:**\n1. Build the map: verb–noun stories under each activity; assign\
  \ actors.\n2. Slice vertically — increments named for stakeholder-visible capability;\
  \ copy story names **verbatim** from the map.\n3. Mark spine vs optional; never\
  \ slice horizontally (“finish epic A then B”).\n4. Fill `templates/md/story-map.md`\
  \ and `templates/md/thin-slice.md` (optional `.context/story-context.md` per activity\
  \ folder).\n5. Keep unmapped work in the **sketch** as `* approx N–M …`; drop approx\
  \ as stories get named.\n\n**Rules:** `story-map-shape` / `story-map-discipline`\
  \ · `thin-slice-shape` / `thin-slice-increment-shape` / `thin-slice-ordering` ·\
  \ `story-name-exact-match` · apply `branch-on-mechanical-uniqueness` and `read-all-source-context-in-full`\
  \ while grilling and sketching.\n\n---\n\n## exploration\n\n**Format:** python ·\
  \ **Produce:** one runnable main-flow scenario per story — fake + public seam. No\
  \ tier specs yet.\n\n**Stories vs BDD:** Stories = acceptance (e2e / tier). BDD\
  \ = object-level tests.\n\n**Layout:** Epic / nested SubEpic / Story = folders;\
  \ optional `.context/story-context.md` per folder.\n\n```\n{epic}/\n  {epic}-helper.{ext}\
  \       # → {Type}ExampleFactory\n  {story}/\n    {story}_story.{ext}     # GWT;\
  \ mode \"fake\" when entry\n```\n\n| File | Role |\n|---|---|\n| `*_story.{ext}`\
  \ | Runnable GWT; **fake** `I{Type}` via helpers → factory; assert **public interface**\
  \ only |\n\n**Do:**\n1. Export `create{Story}Story(mode)` registering `story` /\
  \ `scenario` / `given` / `when` / `then`.\n2. Run the story entry with `mode: \"\
  fake\"`.\n3. Route steps: helper → `{Type}ExampleFactory.load…({ mode })`.\n4. Assert\
  \ **Then** only on the public seam of `I{Type}` — no private fields, no hand-rolled\
  \ Fakes.\n5. Pull values from `examples[{example_key}]` — no story-local example\
  \ tables.\n6. Fill `templates/py|js/…/{story}_story.*` (md walk-through: `templates/md/scenario-main-flow.md`\
  \ if documenting only).\n7. **Optional — variation scenarios (off by default).**\
  \ In the same `*_story.{ext}`, add alternate / error / boundary scenarios and shared\
  \ backgrounds only when **one of these is true**:\n   - The main-flow scenario already\
  \ exists in the story file, **or**\n   - Explicitly asked for.\n   Apply the scenario\
  \ rules below to any variation added here. Do not add variations before the main\
  \ flow is confirmed.\n\n**Rules (main-flow and any optional variations):**\n- **`scenarios-shape`**\
  \ / **`scenario-step-quality`** — Given / When / Then; domain-observable steps.\n\
  - **`factory-backed-examples`** — Values in `{Type}ExampleFactory`; steps may name\
  \ the method or returned object.\n- **`assert-public-interface`** — Then reads only\
  \ the public seam of `I{Type}` (+ peers).\n- **`scenario-coverage`** — Cover important\
  \ variations, not only happy path (when optional step 7 is active).\n- **`real-data-over-invented-values`**\
  \ — Factory examples trace to domain / evidence.\n- **`atomic-deltas-over-repetition`**\
  \ — State the delta; do not copy-paste walls.\n- **`alternate-actor-emphasis`**\
  \ — Call out alternate actors when the path changes.\n- **`factory-objects-in-scenarios`**\
  \ — Obtain objects via helpers → `{Type}ExampleFactory.{method}` (fake mode).\n\
  - **`variations-after-main-flow`** — Never add alternate / boundary scenarios before\
  \ the main-flow scenario exists and is confirmed.\n\n---\n\n## engineering\n\n**Format:**\
  \ python · **Produce:** write-once tier specs that re-run the same scenarios. Prefer\
  \ RED until behaviour exists; drive green with minimum production code.\n\n| File\
  \ | Role |\n|---|---|\n| `{story}_story.*` | Tier-neutral GWT; entry runs **fake**\
  \ (owned at explore/spec) |\n| `{story}_spec.*` | Isolated — real `{Type}` + injected\
  \ mocks; `create{Story}Story(\"isolated\")` |\n| `{story}_spec.{tier}.*` | Same\
  \ scenarios; named tier (e.g. `…_spec.production.js`) |\n\n**Do:**\n1. Confirm language/framework\
  \ (default pytest / `node --test`).\n2. Scaffold `*_spec` (isolated) and/or `*_spec.{tier}`\
  \ if missing — never overwrite existing bodies; each calls the shared story fn with\
  \ matching mode.\n3. Keep fake in the story file only; isolated = `{Type}` + injected\
  \ mocks; other tiers via `*_spec.{tier}`.\n4. RED → GREEN → REFACTOR one scenario\
  \ at a time.\n5. After **2 consecutive fix failures** — stop; call `diagnostic().diagnose()`\
  \ before a third fix.\n6. Run **validate**.\n\n**Rules:** `tests-shape` · `tests-implement-specification`\
  \ · `tier-bodies-implemented` · `assertions-against-real-behavior` · `scenarios-tied-to-runtime`\
  \ · `bug-fix-test-first` · `tier-factory-kind` (call story with `isolated` or named\
  \ tier — never invent Fake subclasses in tier bodies).\n\n---\n\n## Example factories\
  \ (Clean Engineering)\n\nLink to CE factories; do not invent Fakes or story-local\
  \ example tables.\n\n| Artifact | Emit |\n|---|---|\n| Epic helper | Import `{Type}ExampleFactory`;\
  \ `given*` → `load*({ mode })` |\n| Story (explore/spec) | GWT; `mode: \"fake\"\
  `; assert public `I{Type}` |\n| Tier spec | Same story fn; `mode: \"isolated\"`\
  \ \\| `\"production\"` |\n\n**Chain:** steps → helper → `load…({ mode })` → `I{Type}`\
  \ (+ peers) → assert public seam.\n\n**Modes:** `fake` = mock/stub + `examples[{key}]`\
  \ · `isolated` = `new {Type}(...mocks)` · `production` = `new {Type}(...real)`.\n\
  \nDeclare on the model: `Epic.example_factories` / `SubEpic.example_factories`.\
  \ Normalize via `code/example_factories.py`.\n\n**Rules:** `helpers-import-factories`\
  \ · `examples-multi-type-bundle` · `stories-do-not-own-ce-types` · `no-story-local-example-tables`.\n\
  \n---\n\n## examples.md\n\n# Stories examples\n\nReference trees under this folder.\
  \ Prefer generating fresh trees via\n`Stories.transform` / `generate` at the active\
  \ fidelity rather than copying\nthese verbatim when the hybrid layout differs.\n\
  \n## Markdown (`md/`) — discovery documents\n\n| Path | What it shows |\n|---|---|\n\
  | `md/story-map.md` | Discovery story map (verb–noun + actor before `-->`) |\n|\
  \ `md/thin-slice.md` | Vertical increments referencing map story names |\n| `md/scenario-main-flow.md`\
  \ | Main-flow scenario narrative |\n| `md/scenario-outline.md` | Scenario outline\
  \ + examples table |\n| `md/scenario-inline.md` | Inline-examples scenario style\
  \ |\n\n## Python (`py/`) — exploration / specification / engineering layout\n\n\
  | Path | What it shows |\n|---|---|\n| `py/manage-customer-orders/` | Acceptance\
  \ layout for one epic (story-spec leaf files + shared runner/types) |\n| `py/manage-customer-orders/*/*/*_stories.py`\
  \ | Regeneratable story-spec constants (`story`, `actor`, scenarios) |\n| `py/manage-customer-orders/story_runner.py`\
  \ | Runner that binds scenarios to tier implementations |\n| `py/manage-customer-orders/story_types.py`\
  \ | Shared story/scenario type shapes |\n\nPrefer the hybrid leaf-file + tier shape\
  \ from the code formatter over any legacy dict-only layout when they disagree.\n\
  \n\n## md/scenario-inline.md\n\n---\nfidelity: [specification]\nartifact: [story-scenarios]\n\
  format: md\nexample-of: scenario-inline\n---\n\n<!-- Worked example — plain scenario\
  \ with real domain values inline. -->\n<!-- Shows the shape templates/md/scenario-inline.md\
  \ produces once filled in. -->\n\n## Story: Apply For a Payment Product Agreement\n\
  \n**Story type:** user\n\n### Domain terms\n\n- *Customer* — account holder applying\
  \ for the agreement\n- *DDA Account* — demand deposit account; must be valid and\
  \ eligible\n- *Payment Product Agreement* — contract under review after submission\n\
  - *Owner* — named responsible party on the agreement\n- *Contact Details* — email\
  \ or phone used to notify the **Owner**\n\n## Behaviors\n\n### Scenario 1: Agreement\
  \ submitted with valid DDA Account and Owner\n\n*Given* a **Customer** *Jane Doe*\
  \ exists  \n  *And* that **Customer** *Jane Doe* has a valid **DDA Account** *DDA-001*\
  \  \n*When* the **Customer** *Jane Doe* applies for a **Payment Product Agreement**\
  \  \n    using **DDA Account** *DDA-001*  \n    with **Owner** *John Doe*  \n  \
  \    that has **Contact Details** *john@acme.com*  \n*Then* the **Payment Product\
  \ Agreement** is submitted for review  \n  *And* the **Owner** *John Doe* is notified\
  \ at *john@acme.com*  \n\n### Scenario 2: Agreement rejected when DDA Account is\
  \ invalid\n\n*Given* a **Customer** *Jane Doe* exists  \n  *And* that **Customer**\
  \ *Jane Doe* has **DDA Account** *DDA-999* with status *Invalid*  \n*When* the **Customer**\
  \ *Jane Doe* applies for a **Payment Product Agreement**  \n    using **DDA Account**\
  \ *DDA-999*  \n*Then* the **Payment Product Agreement** is *rejected*  \n  *And*\
  \ **Customer** *Jane Doe* is notified that the **DDA Account** is *not eligible*\
  \  \n\n### Evidence\n\n| Scenario | Source (document / system) | Location |\n| ---\
  \ | --- | --- |\n| Scenario 1 | *Payment Product Requirements* | §\"Application\
  \ flow\", p. 12 |\n| Scenario 2 | *Payment Product Requirements* | §\"Rejection\
  \ cases\", p. 14 |\n\n\n## md/scenario-main-flow.md\n\n---\nfidelity: [exploration]\n\
  artifact: [story-scenarios]\nformat: md\nexample-of: scenario-main-flow\n---\n\n\
  # Acceptance Criteria — Example\n\nWorked example using the same **Manage Customer\
  \ Orders** domain as the shaping-level story-map-example.md.\n\nBelow is one story\
  \ in full so agents can read a single complete pattern.\n\n---\n\n## Story: Browse\
  \ Product Catalog\n\n**Story type:** user\n\n### Domain terms\n\n- *Product Catalog*\
  \ — browsable list of products available to order\n- *Category* — grouping used\
  \ to narrow what the customer sees\n- *Product Detail* — name, description, price,\
  \ and image for one product\n- *Out Of Stock* — product not available to add to\
  \ an order right now\n\n### Acceptance criteria\n\n1. **WHEN** the customer opens\
  \ the *Product Catalog*\n   **THEN** the system displays available products grouped\
  \ by *Category*\n   **AND** each row shows at least product name and price\n   **Evidence:**\
  \ Order Management Workshop — whiteboard \"Place order\" flow, 2026-03-15, sticky\
  \ \"browse by category\"\n\n2. **WHEN** the customer selects a *Category*\n   **THEN**\
  \ the *Product Catalog* lists only products in that *Category*\n   **Evidence:**\
  \ Order Management Workshop — same session, \"filter catalog by category\"\n\n3.\
  \ **WHEN** the customer selects a product from the *Product Catalog*\n   **THEN**\
  \ the system shows *Product Detail* for that product\n   **Evidence:** Order Management\
  \ Workshop — \"click through to product detail\"\n\n4. **WHEN** a product is *Out\
  \ Of Stock*\n   **THEN** the *Product Catalog* and *Product Detail* show that the\
  \ product cannot be added to an order\n   **BUT** the customer can still browse\
  \ other products\n   **Evidence:** Order Management Workshop — \"don't block browsing\
  \ when one SKU is gone\"\n\n## What to notice\n\n- Stories match **verb-noun** names\
  \ from the story map; actor is in **Story type**, not the title\n- **Domain terms**\
  \ are defined before AC; the same *italic* terms appear in the criteria\n- **when\
  \ / then / and / but** — negatives use **but**; no **given** in AC\n- Each AC is\
  \ a **delta** or distinct case — general browse flow once, then category, detail,\
  \ and out-of-stock paths\n- **Evidence** cites a concrete source even for workshop-derived\
  \ discovery\n\n---\n\n## Same story in `*-stories.ts` code format\n\n```typescript\n\
  import type { Step, AcceptanceCriterion, Background } from '../../story-types'\n\
  \nexport const BROWSE_PRODUCT_CATALOG = {\n  story: `Browse Product Catalog`,\n\
  \  actor: `Customer`,\n\n  acceptance_criteria: [\n    [\n      { when: `the *customer*\
  \ opens the **Product Catalog**` },\n      { then: `the system displays available\
  \ products grouped by **Category**` },\n      { and:  `each row shows at least product\
  \ name and price` },\n    ],\n    [\n      { when: `the *customer* selects a **Category**`\
  \ },\n      { then: `the **Product Catalog** lists only products in that **Category**`\
  \ },\n    ],\n    [\n      { when: `the *customer* selects a product from the **Product\
  \ Catalog**` },\n      { then: `the system shows **Product Detail** for that product`\
  \ },\n    ],\n    [\n      { when: `a product is **Out Of Stock**` },\n      { then:\
  \ `the **Product Catalog** and **Product Detail** show the product cannot be added`\
  \ },\n      { but:  `the *customer* can still browse other products` },\n    ],\n\
  \  ] as const satisfies readonly AcceptanceCriterion[],\n\n  domain_terms: ['Product\
  \ Catalog', 'Category', 'Product Detail', 'Out Of Stock'] as const,\n  evidence:\
  \ [\n    'Order Management Workshop — whiteboard \"Place order\" flow, 2026-03-15',\n\
  \    'Order Management Workshop — \"filter catalog by category\"',\n    'Order Management\
  \ Workshop — \"click through to product detail\"',\n    'Order Management Workshop\
  \ — \"don\\'t block browsing when one SKU is gone\"',\n  ] as const,\n\n  customerOpensProductCatalogSystemDisplays:\
  \ {\n    name: `customer opens product catalog system displays`,\n    steps: [\n\
  \      { when: `the *customer* opens the **Product Catalog**` },\n      { then:\
  \ `the system displays available products grouped by **Category**` },\n      { and:\
  \  `each row shows at least product name and price` },\n    ] as const satisfies\
  \ readonly Step[],\n  },\n\n  customerSelectsCategoryProductCatalogLists: {\n  \
  \  name: `customer selects category product catalog lists`,\n    steps: [\n    \
  \  { when: `the *customer* selects a **Category**` },\n      { then: `the **Product\
  \ Catalog** lists only products in that **Category**` },\n    ] as const satisfies\
  \ readonly Step[],\n  },\n\n  customerSelectsProductProductDetail: {\n    name:\
  \ `customer selects product product detail`,\n    steps: [\n      { when: `the *customer*\
  \ selects a product from the **Product Catalog**` },\n      { then: `the system\
  \ shows **Product Detail** for that product` },\n    ] as const satisfies readonly\
  \ Step[],\n  },\n\n  productOutOfStockProductCatalogShows: {\n    name: `product\
  \ out of stock product catalog shows`,\n    steps: [\n      { when: `a product is\
  \ **Out Of Stock**` },\n      { then: `the **Product Catalog** and **Product Detail**\
  \ show the product cannot be added` },\n      { but:  `the *customer* can still\
  \ browse other products` },\n    ] as const satisfies readonly Step[],\n  },\n\n\
  } as const\n```\n\nThe `acceptance_criteria` array and the named scenario objects\
  \ contain **identical steps** — the criteria drive what the scenarios test.\n\n\n\
  ## md/scenario-outline.md\n\n---\nfidelity: [specification]\nartifact: [story-scenarios]\n\
  format: md\nexample-of: scenario-outline\n---\n\n<!-- Worked example — Scenario\
  \ Outline with normalized Examples tables. -->\n<!-- Shows the shape templates/md/scenario-outline.md\
  \ produces once filled in. -->\n\n## Story: Submit Payment and Validate Against\
  \ Account Limit\n\n**Story type:** user\n\n### Domain terms\n\n- *Account* — enterprise\
  \ sub-account with an activation status\n- *Transactional Limit* — maximum amount\
  \ rule attached to an **Account**\n- *Wire Payment* — payment request submitted\
  \ by the user\n- *Payment Amount* — value entered for the **Wire Payment**\n- *Validation\
  \ Status* — outcome after limit check (*successful* or *rejected*)\n\n### Examples\n\
  \n#### Account:\n\n| scenario      | enterprise_name | account_name       | activation_status\
  \ |\n|---------------|-----------------|--------------------|-------------------|\n\
  | Scenario 1    | Acme Corp       | Acme Operating     | Active            |\n|\
  \ Scenario 2    | Acme Corp       | Acme Payroll       | Active            |\n\n\
  #### Transactional Limit:\n\n| scenario      | account_name       | limit_name \
  \ | max_amount   | currency |\n|---------------|--------------------|-------------|--------------|----------|\n\
  | Scenario 1    | Acme Operating     | daily_wire  | 500000.00    | USD      |\n\
  | Scenario 2    | Acme Payroll       | weekly_wire | 2000000.00   | USD      |\n\
  \n#### Wire Payment:\n\n| scenario      | amount      | currency | formatted_display\
  \ | validation_status |\n|---------------|-------------|----------|-------------------|-------------------|\n\
