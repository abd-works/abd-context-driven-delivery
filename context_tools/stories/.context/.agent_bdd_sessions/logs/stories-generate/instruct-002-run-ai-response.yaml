  \ accept hyphens in module names — see `context_tools/stories/src/formats/code/architecture-context.md`.\n\
  \n\n## py/manage-customer-orders/story_runner.py\n\n\"\"\"Generic scenario runner\
  \ - the ONLY test-framework glue.\n\nEvery tier reuses this function; tier files\
  \ just wire a Story constant, a\nscenario key, and a factory that produces the tier's\
  \ `TierImpl`. The runner:\n\n1. Validates that every step string in the scenario\
  \ has a matching key in\n   `tier.given` / `tier.when` / `tier.then` - missing keys\
  \ fail with the\n   exact string and phase, so the author knows what's unimplemented.\n\
  2. Walks `given`, then each interaction's `when` steps, then dispatches one\n  \
  \ pytest test per `then` step (so each observable outcome is its own row).\n3. Runs\
  \ `cleanup` after every scenario, even on failure.\n\nSync and async step bodies\
  \ both work - the runner awaits when needed.\n\"\"\"\n\nfrom __future__ import annotations\n\
  \nimport asyncio\nimport inspect\nfrom typing import Callable, Dict\n\nimport pytest\n\
  \nfrom story_types import Scenario, StepFn, Story, TierImpl\n\n\ndef _maybe_await(result:\
  \ object) -> None:\n    if inspect.isawaitable(result):\n        asyncio.get_event_loop().run_until_complete(result)\
  \  # type: ignore[arg-type]\n\n\ndef _dispatch(step: str, table: Dict[str, StepFn],\
  \ phase: str) -> None:\n    fn = table.get(step)\n    if fn is None:\n        raise\
  \ KeyError(\n            f\"Tier is missing a {phase!r} implementation for step\
  \ {step!r}. \"\n            f\"Add it to `tier.{phase}[{step!r}]`.\"\n        )\n\
  \    _maybe_await(fn())\n\n\ndef _label(kw: str, index: int, step: str) -> str:\n\
  \    return f\"{kw} {step}\" if index == 0 else step\n\n\ndef run_scenario(\n  \
  \  story_name: str,\n    scenario: Scenario,\n    make_tier: Callable[[], TierImpl],\n\
  ) -> None:\n    \"\"\"Emit one pytest class per scenario; one `test_*` method per\
  \ `then` step.\n\n    Call from a tier test file at module scope; pytest discovers\
  \ the emitted\n    class automatically.\n    \"\"\"\n    tier_holder: Dict[str,\
  \ TierImpl] = {}\n\n    def setup_class() -> None:\n        tier = make_tier()\n\
  \        tier_holder[\"tier\"] = tier\n        for step in scenario[\"given\"]:\n\
  \            _dispatch(step, tier[\"given\"], \"given\")\n        for interaction\
  \ in scenario[\"interactions\"]:\n            for step in interaction[\"when\"]:\n\
  \                _dispatch(step, tier[\"when\"], \"when\")\n\n    def teardown_class()\
  \ -> None:\n        tier = tier_holder.get(\"tier\")\n        if tier is not None:\n\
  \            _maybe_await(tier[\"cleanup\"]())\n\n    methods: Dict[str, Callable[...,\
  \ None]] = {}\n    for interaction_index, interaction in enumerate(scenario[\"interactions\"\
  ]):\n        for then_index, step in enumerate(interaction[\"then\"]):\n       \
  \     method_name = f\"test_then_{interaction_index}_{then_index}\"\n          \
  \  step_value = step\n\n            def _method(self, _step: str = step_value) ->\
  \ None:  # noqa: ANN001\n                _dispatch(_step, tier_holder[\"tier\"][\"\
  then\"], \"then\")\n\n            _method.__doc__ = _label(\"Then\", then_index,\
  \ step_value)\n            methods[method_name] = _method\n\n    cls = type(\n \
  \       f\"Test_{_slug(scenario['name'])}\",\n        (object,),\n        {\n  \
  \          \"setup_class\": staticmethod(setup_class),\n            \"teardown_class\"\
  : staticmethod(teardown_class),\n            **methods,\n        },\n    )\n\n \
  \   # Attach the class to the caller's module so pytest discovers it.\n    frame\
  \ = inspect.stack()[1].frame\n    caller_globals = frame.f_globals\n    caller_globals[cls.__name__]\
  \ = cls\n    cls.__module__ = caller_globals.get(\"__name__\", cls.__module__)\n\
  \n\ndef _slug(name: str) -> str:\n    out = []\n    prev_alnum = False\n    for\
  \ ch in name:\n        if ch.isalnum():\n            out.append(ch)\n          \
  \  prev_alnum = True\n        else:\n            if prev_alnum:\n              \
  \  out.append(\"_\")\n            prev_alnum = False\n    return \"\".join(out).strip(\"\
  _\") or \"scenario\"\n\n\n## py/manage-customer-orders/story_types.py\n\n\"\"\"\
  Story types for Python spec-files.\n\nPython's type system is dynamic - we can't\
  \ produce a compile-time analogue of\nTypeScript's `TierImpl<S>`. Instead the runner\
  \ does runtime step-key\nassertions (see `story_runner.py`): every step string in\
  \ a scenario must\nresolve to a callable in `tier.given` / `tier.when` / `tier.then`;\
  \ missing\nkeys fail the run with a clear message.\n\nThe Story shape mirrors the\
  \ TS reference architecture:\n\n    STORY: Story = {\n        \"story\": \"Submit\
  \ Order\",\n        \"actor\": \"Customer\",\n        \"domain_terms\": (\"Order\"\
  , \"Cart\"),\n        \"evidence\": (\"Checkout workshop 2026-05-04\",),\n\n   \
  \     \"scenario_key\": {\n            \"name\": \"order accepted for a valid cart\
  \ and payment\",\n            \"given\": (\"a Cart CART-9001 containing 3 Items\
  \ totalling 149.98 USD\",),\n            \"interactions\": (\n                {\n\
  \                    \"when\": (\"the Customer submits the Order\",),\n        \
  \            \"then\": (\"an Order is created with status placed\",),\n        \
  \        },\n            ),\n        },\n    }\n\n`given`, and every `when` / `then`\
  \ inside an interaction, is a tuple of\nplain-prose step strings. First step of\
  \ each phase is unprefixed; continuation\nsteps carry their own `\"And \"` / `\"\
  But \"` prefix inside the string, and the\ntier's `given` / `when` / `then` dicts\
  \ use the SAME string as the dispatch key.\n\"\"\"\n\nfrom __future__ import annotations\n\
  \nfrom typing import Any, Awaitable, Callable, Dict, Tuple, TypedDict, Union\n\n\
  \nStepFn = Callable[[], Union[None, Awaitable[None]]]\n\"\"\"One step body. May\
  \ be sync or async - the runner awaits either.\"\"\"\n\n\nclass Interaction(TypedDict):\n\
  \    \"\"\"A when-then block within a scenario.\"\"\"\n\n    when: Tuple[str, ...]\n\
  \    then: Tuple[str, ...]\n\n\nclass Scenario(TypedDict):\n    \"\"\"A behaviour\
  \ walk-through under a story.\"\"\"\n\n    name: str\n    given: Tuple[str, ...]\n\
  \    interactions: Tuple[Interaction, ...]\n\n\n# `Story` is a Story metadata dict\
  \ merged with one Scenario per key. Python\n# can't statically enforce the union\
  \ like TS, so this is documented as a\n# convention: unknown extra keys are treated\
  \ as Scenario values by the runner.\nStory = Dict[str, Any]\n\n\nclass TierImpl(TypedDict):\n\
  \    \"\"\"Tier contract - dispatch tables plus a cleanup hook.\n\n    `given` /\
  \ `when` / `then` are dicts keyed by the EXACT step strings from\n    the scenario.\
  \ `cleanup` runs after every scenario, regardless of outcome.\n    \"\"\"\n\n  \
  \  given: Dict[str, StepFn]\n    when: Dict[str, StepFn]\n    then: Dict[str, StepFn]\n\
  \    cleanup: StepFn\n\n\n## py/manage-customer-orders/track-order-status/send-shipment-notification/send_shipment_notification_stories.py\n\
