  \        (S) Customer --> View Current Order Status\n        (S) System --> Send\
  \ Shipment Notification\n    (E) Cancel Order\n        (S) Customer --> Request\
  \ Order Cancellation\n        (S) System --> Process Cancellation Refund\n\n## What\
  \ to notice\n\n- Epic names are **verb–noun**, no actor in the name\n- Actor goes\
  \ before `-->`, not in the story name\n- Each story is one observable behavior —\
  \ not a task or feature\n- Sub-epics group stories into coherent flows\n\n\n## md/thin-slice.md\n\
  \n---\nfidelity: [discovery]\nartifact: [thin-slice]\nformat: md\nexample-of: thin-slice\n\
  ---\n\n# Thin slicing — PawPlace incremental backlog\n\n## Product / context\n\n\
  **Product:** PawPlace — online pet store with in-store adoption visits.\n\n**Slicing\
  \ intent (by value, store-first):** Each increment must put a working capability\
  \ in the hands of a real store. Earlier increments deliberately leave out polish,\
  \ payment depth, accounts, pets, returns, and marketing so that a store gets a usable\
  \ product on day one and revenue and learning compound with each release. *Pet appointments*\
  \ — the adoption side — are explicitly held back until the e-commerce spine is real.\n\
  \n**Spine vs optional:** The mandatory commerce spine is **catalog → store → cart\
  \ → pay → fulfill**. Pets, accounts, multi-vendor payments, returns, marketing,\
  \ reviews, and admin polish are real work but **not** required for the smallest\
  \ store-supporting slice; they ride later increments.\n\n## Increments\n\n### Increment\
  \ 1: `Walk-in driver — find the store, see what's in stock`\n\n**Outcome:** A customer\
  \ can find their nearest *store*, browse the *product catalog*, see *real-time stock\
  \ availability* for a product at that store, and walk in to ask for it. Drives foot\
  \ traffic with zero checkout, payment, or accounts infrastructure. Store gets value\
  \ on day one.\n\n**Slicing notes:** Single payment-free, account-free vertical slice.\
  \ Manual stock updates by staff via a bare-bones admin form. Categories only — no\
  \ keyword search yet. No cart, no checkout, no notifications. Validates the *catalog*\
  \ data model, the *store* + geo model, the *stock availability* contract, and that\
  \ customers find this useful enough to walk in. Risk validated: real customer traffic\
  \ to real stores.\n\n**Stories in this increment** *(order reflects flow within\
  \ the slice):*\n\n- *View Store Map*\n- *View Store List*\n- *Calculate Distance\
  \ to Store*\n- *View Product Details*\n- *Display Real-Time Stock Availability*\n\
  - *Update Product Stock Levels*\n\n### Increment 2: `Click-and-collect — buy online,\
  \ pick up at the store`\n\n**Outcome:** A customer can put products in a *shopping\
  \ cart*, pay online with a card, and pick the order up at a chosen *store*. The\
  \ store gets online revenue without anyone solving home-delivery logistics. Single\
  \ payment vendor (StripeWave) so the integration is real but bounded.\n\n**Slicing\
  \ notes:** *Guest checkout* only — no accounts yet. Single payment vendor. Confirmation\
  \ email from a static template. No shipping address, no delivery option fan-out\
  \ — pickup is the only fulfillment path. Manual pick-prep by store staff. Validates\
  \ the riskiest payment integration on a real card-present journey end-to-end.\n\n\
  **Stories in this increment:**\n\n- *Add Product to Cart*\n- *Update Cart Quantity*\n\
  - *Remove Product from Cart*\n- *Select Click-and-Collect Store*\n- *Check Out as\
  \ Guest*\n- *Enter Billing Address*\n- *Select Payment Method*\n- *Process Card\
  \ Payment via StripeWave*\n- *Confirm Order and Send Confirmation Email*\n- *Prepare\
  \ Click-and-Collect Orders for Pickup*\n- *Fulfill Click-and-Collect Order*\n\n\
  ### Increment 3: `Ship to home — full standard-delivery e-commerce`\n\n**Outcome:**\
  \ A customer can complete the same purchase journey but have it **shipped** to a\
  \ delivery address. Standard delivery only. Now the store reaches customers outside\
  \ its catchment.\n\n**Slicing notes:** Still *guest checkout*, still StripeWave-only.\
  \ Standard delivery only — defer express and same-day. Manual shipping label creation\
  \ by staff. Validates the order lifecycle past pickup: shipping notifications, tracking,\
  \ and an order-status view.\n\n**Stories in this increment:**\n\n- *Enter Shipping\
  \ Address*\n- *Select Delivery Option*\n- *View and Process Incoming Orders*\n-\
  \ *Send Shipping Notification with Tracking Number*\n- *Track Order Status*\n\n\n\
