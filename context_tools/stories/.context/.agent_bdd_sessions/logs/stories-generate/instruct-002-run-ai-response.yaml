  \n# Manage Customer Orders\n\n**Status:** partially expanded\n\n**Stories in scope:**\n\
  - *Place New Order*\n- *Track Order Status*\n- *Cancel Order*\n\n**Context / notes:**\
  \ Epic-root aggregate for the Python code-example tree that mirrors `examples/md/story-map.md`\
  \ and `examples/ts/manage-customer-orders/`. Story data is pure data (dicts and\
  \ tuples) so a code adapter can read it without importing a test framework. Folder\
  \ names follow the kebab-case slug convention used across the code family; the epic\
