<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kanban board pane</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; height: 100%; box-sizing: border-box; background: #0B0B0B; color: #E8E8ED; font-family: 'Inter', system-ui, sans-serif; font-size: 12px; display: flex; flex-direction: column; gap: 8px; padding: 12px; overflow: hidden">
<div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #9B9BA8">KANBAN BOARD · A PRESS ON A TICKET MAKES IT THE ACTIVE SESSION · ▾ EXPANDS IT</div>
<div style="flex-grow: 1; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; min-height: 0">
<sc-for list="{{vals.columns}}" as="column" hint-placeholder-count="5">
<div style="background: #111113; border: 1px solid #2A2A2A; border-radius: 4px; padding: 8px; display: flex; flex-direction: column; gap: 6px; min-width: 0">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em; color: #9B9BA8">{{column.name}}</span>
<sc-for list="{{column.tickets}}" as="ticket" hint-placeholder-count="2">
<div style="{{ticket.style}}">
<div style="display: flex; align-items: center; gap: 4px">
<button type="button" onClick="{{ticket.pick}}" style="font: inherit; font-weight: 600; flex-grow: 1; text-align: left; color: #E8E8ED; background: transparent; border: 0; padding: 0; cursor: pointer">{{ticket.title}}</button>
<sc-if value="{{ticket.canExpand}}" hint-placeholder-val="{{false}}">
<button type="button" onClick="{{ticket.toggle}}" aria-label="Expand ticket" style="font: inherit; color: #E5531A; background: transparent; border: 0; padding: 0 2px; cursor: pointer">{{ticket.chevron}}</button>
</sc-if>
</div>
<span style="display: flex; gap: 4px; flex-wrap: wrap">
<sc-for list="{{ticket.dots}}" as="dot" hint-placeholder-count="3">
<span style="{{dot.style}}">{{dot.label}} {{dot.count}}</span>
</sc-for>
</span>
<sc-if value="{{ticket.expanded}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 4px; border-top: 1px solid #2A2A2A; padding-top: 6px">
<button type="button" onClick="{{ticket.files}}" style="font: inherit; text-align: left; color: #0B0B0B; background: #E5531A; border: 1px solid #E5531A; border-radius: 3px; padding: 2px 6px; font-weight: 700; cursor: pointer">Files · whole ticket</button>
<div style="display: flex; gap: 4px; flex-wrap: wrap">
<button type="button" onClick="{{ticket.generate}}" style="font: inherit; color: #E8E8ED; background: #1B1B20; border: 1px solid #2A2A2A; border-radius: 3px; padding: 1px 6px; cursor: pointer">▶ generate</button>
<button type="button" onClick="{{ticket.fixAll}}" style="font: inherit; color: #E8E8ED; background: #1B1B20; border: 1px solid #2A2A2A; border-radius: 3px; padding: 1px 6px; cursor: pointer">fix</button>
<button type="button" onClick="{{ticket.openDesign}}" style="font: inherit; color: #E8E8ED; background: #1B1B20; border: 1px solid #2A2A2A; border-radius: 3px; padding: 1px 6px; cursor: pointer">UX design ↗</button>
</div>
<sc-for list="{{ticket.practices}}" as="practice" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 4px">
<span style="{{practice.style}}">{{practice.label}}</span>
<span style="flex-grow: 1; color: #FF6A6A; font-family: 'JetBrains Mono', monospace; font-size: 10px">{{practice.count}}</span>
<button type="button" onClick="{{practice.files}}" style="font: inherit; color: #E8E8ED; background: #1B1B20; border: 1px solid #2A2A2A; border-radius: 3px; padding: 1px 6px; cursor: pointer">Files</button>
</div>
</sc-for>
</div>
</sc-if>
</div>
</sc-for>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"vals":{"editor":null},"$preview":{"width":900,"height":420}}'>
class Component extends DCLogic {
  renderVals() {
    return { vals: this.props.vals ?? { columns: [] } };
  }
}
</script>
</body>
</html>
