<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inspector pane</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; height: 100%; box-sizing: border-box; background: #0B0B0B; color: #E8E8ED; font-family: 'Inter', system-ui, sans-serif; font-size: 12px; display: flex; flex-direction: column; gap: 8px; padding: 12px; overflow: hidden">
<div style="display: flex; align-items: center; gap: 6px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #9B9BA8; flex-grow: 1">INSPECTOR · {{vals.scope}}</span>
<button type="button" onClick="{{vals.toggleOverlay}}" style="{{vals.overlayStyle}}">Show violations {{vals.violationCount}}</button>
</div>
<div style="display: flex; gap: 2px; border-bottom: 1px solid #2A2A2A; overflow: hidden">
<sc-for list="{{vals.files}}" as="file" hint-placeholder-count="3">
<button type="button" onClick="{{file.pick}}" style="{{file.style}}">{{file.name}}<span style="color: #FF6A6A; font-weight: 700"> {{file.count}}</span></button>
</sc-for>
</div>
<div style="flex-grow: 1; display: flex; gap: 10px; min-height: 0">
<div style="flex-grow: 1; background: #111113; border: 1px solid #2A2A2A; border-radius: 4px; padding: 8px; display: flex; flex-direction: column; gap: 0; overflow: hidden; min-width: 0">
<div style="display: flex; align-items: center; gap: 6px; padding-bottom: 4px">
<span style="flex-grow: 1; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #9B9BA8">{{vals.fileName}}</span>
<sc-if value="{{vals.canDiagram}}" hint-placeholder-val="{{false}}">
<button type="button" onClick="{{vals.showDiagram}}" style="{{vals.diagramStyle}}">Diagram</button>
<button type="button" onClick="{{vals.showSource}}" style="{{vals.sourceStyle}}">Source</button>
</sc-if>
</div>
<sc-if value="{{vals.isDiagram}}" hint-placeholder-val="{{false}}">
<div style="position: relative; flex-grow: 1; min-height: 0; background-color: #0B0B0B; background-image: radial-gradient(#2A2A2A 1px, transparent 1px); background-size: 14px 14px; border-radius: 3px">
<sc-for list="{{vals.shapes}}" as="shape" hint-placeholder-count="6">
<button type="button" onClick="{{shape.pick}}" style="{{shape.style}}"><span>{{shape.label}}</span><span style="color: #FF6A6A; font-weight: 700; font-family: 'JetBrains Mono', monospace; font-size: 10px">{{shape.mark}}</span></button>
</sc-for>
</div>
</sc-if>
<sc-if value="{{vals.isSource}}" hint-placeholder-val="{{true}}">
<sc-for list="{{vals.lines}}" as="line" hint-placeholder-count="8">
<div style="{{line.style}}"><span style="width: 34px; flex-shrink: 0; color: #6B6B78">{{line.num}}</span><button type="button" onClick="{{line.fold}}" aria-label="Fold or unfold" style="{{line.foldStyle}}">{{line.foldMark}}</button><span style="flex-grow: 1">{{line.text}}</span><span style="color: #FF6A6A; font-weight: 700">{{line.mark}}</span></div>
</sc-for>
</sc-if>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #9B9BA8; padding-top: 6px">{{vals.trace}}</span>
</div>
<sc-if value="{{vals.cardsShown}}" hint-placeholder-val="{{true}}">
<div style="width: 32%; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px; overflow: hidden">
<sc-if value="{{vals.noViolations}}" hint-placeholder-val="{{false}}">
<div style="color: #6FD39F; font-family: 'JetBrains Mono', monospace">{{vals.noViolationsText}}</div>
</sc-if>
<sc-if value="{{vals.hasViolations}}" hint-placeholder-val="{{true}}">
<div style="display: flex; align-items: center; gap: 6px">
<span style="flex-grow: 1; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em; color: #9B9BA8">BY RULE</span>
<button type="button" onClick="{{vals.toggleFileOnly}}" style="{{vals.fileOnlyStyle}}">This file only</button>
</div>
</sc-if>
<sc-for list="{{vals.rules}}" as="group" hint-placeholder-count="2">
<sc-if value="{{group.isShown}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; gap: 6px">
<button type="button" onClick="{{group.toggle}}" aria-label="Fold or unfold this rule" style="font: inherit; color: #E5531A; background: transparent; border: 0; padding: 0; cursor: pointer">{{group.chevron}}</button>
<span style="flex-grow: 1; font-family: 'JetBrains Mono', monospace; font-weight: 600; color: #FF6A6A">✕ {{group.rule}} <span style="color: #9B9BA8; font-weight: 400">{{group.count}}</span></span>
<button type="button" onClick="{{group.fixRule}}" style="font: inherit; font-weight: 700; color: #0B0B0B; background: #E5531A; border: 1px solid #E5531A; border-radius: 3px; padding: 1px 8px; cursor: pointer">Fix rule</button>
</div>
<sc-if value="{{group.isOpen}}" hint-placeholder-val="{{true}}">
<sc-for list="{{group.cards}}" as="card" hint-placeholder-count="2">
<div style="{{card.style}}">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px">{{card.where}}</span>
<span style="color: #9B9BA8">{{card.what}}</span>
<div style="display: flex; gap: 6px">
<button type="button" onClick="{{card.open}}" style="font: inherit; color: #E8E8ED; background: #1B1B20; border: 1px solid #2A2A2A; border-radius: 3px; padding: 2px 8px; cursor: pointer">Open</button>
<button type="button" onClick="{{card.fix}}" style="font: inherit; color: #E8E8ED; background: #1B1B20; border: 1px solid #2A2A2A; border-radius: 3px; padding: 2px 8px; cursor: pointer">Fix this one</button>
</div>
</div>
</sc-for>
</sc-if>
</div>
</sc-if>
</sc-for>
<sc-if value="{{vals.hasViolations}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{vals.fixAll}}" style="font: inherit; color: #E8E8ED; background: #1B1B20; border: 1px solid #2A2A2A; border-radius: 3px; padding: 4px 8px; cursor: pointer">Fix every violation</button>
</sc-if>
</div>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"vals":{"editor":null},"$preview":{"width":800,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    return { vals: this.props.vals ?? { scope: 'opened alone', files: [], lines: [], rules: [], shapes: [], isSource: true, cardsShown: true, noViolations: true, noViolationsText: 'Opened alone: the options on this page fill this pane.', fileName: '' } };
  }
}
</script>
</body>
</html>
