<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Knowledge graph pane</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; height: 100%; box-sizing: border-box; background: #0B0B0B; color: #E8E8ED; font-family: 'Inter', system-ui, sans-serif; font-size: 12px; display: flex; flex-direction: column; gap: 8px; padding: 12px; overflow: hidden">
<div style="display: flex; align-items: center; gap: 8px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #9B9BA8; flex-grow: 1">KNOWLEDGE GRAPH · {{vals.scope}}</span>
<button type="button" onClick="{{vals.toggleOnly}}" style="{{vals.onlyStyle}}">Only violations</button>
</div>
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<sc-for list="{{vals.filters}}" as="filter" hint-placeholder-count="3">
<span style="{{filter.style}}">{{filter.label}}</span>
</sc-for>
</div>
<sc-if value="{{vals.empty}}" hint-placeholder-val="{{false}}">
<div style="color: #6B6B78; font-family: 'JetBrains Mono', monospace">{{vals.emptyText}}</div>
</sc-if>
<div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; gap: 2px; overflow: hidden">
<sc-for list="{{vals.nodes}}" as="node" hint-placeholder-count="8">
<button type="button" onClick="{{node.pick}}" style="{{node.style}}"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #9B9BA8; width: 70px; flex-shrink: 0">{{node.kind}}</span><span style="flex-grow: 1">{{node.name}}</span><span style="color: #FF6A6A; font-family: 'JetBrains Mono', monospace; font-weight: 700">{{node.mark}}</span></button>
</sc-for>
</div>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #6B6B78">a press on a node with a violation opens it in the Inspector</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"vals":{"editor":null},"$preview":{"width":800,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    return { vals: this.props.vals ?? { scope: 'opened alone', filters: [], nodes: [], empty: true, emptyText: 'Opened alone: the options on this page fill this pane.' } };
  }
}
</script>
</body>
</html>
