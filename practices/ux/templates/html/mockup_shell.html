<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>UX — @@TITLE@@</title>
  <style>
    :root { --ink: #222; --line: #666; --wash: #f0f0f0; --sel: #dbeafe; --emph: #2563eb; --tint: #fecaca; }
    html, body { height: 100%; }
    body { margin: 0; font-family: ui-monospace, Consolas, monospace; color: var(--ink);
           height: 100vh; display: flex; flex-direction: column; overflow: hidden; background: #fafafa; }
    header.shell-bar { display: flex; gap: 0.75rem; align-items: center; padding: 0.75rem 1rem;
                       border-bottom: 1px solid #ccc; background: #fff; }
    header.shell-bar h1 { font-size: 1rem; margin: 0; flex: 1; }
    #shell { display: grid; grid-template-columns: minmax(0, 1fr) 33rem; flex: 1; min-height: 0; overflow: hidden; }
    #story-demo-frame, #explorer-frame { min-height: 0; overflow: auto; overscroll-behavior: contain; }
    #story-demo-frame { padding: 1rem; border-right: 1px solid #ccc; position: relative; }
    #explorer-frame { padding: 0.35rem 0.75rem 0.75rem; }
    .flow-zoom { position: sticky; top: 0.35rem; left: 0.35rem; z-index: 4; display: inline-flex; gap: 0.15rem; align-items: center; width: max-content; margin-bottom: 0.35rem; padding: 0.15rem; background: #fff; border: 1px solid #ccc; }
    .flow-zoom button { font: inherit; min-width: 1.8rem; padding: 0.15rem 0.4rem; cursor: pointer; background: #fff; border: 1px solid #ccc; }
    #mockup { zoom: 1; }
    .screen { border: 1px dashed var(--line); margin-bottom: 1rem; padding: 0.75rem;
               background: #fff; max-width: 52rem; cursor: pointer; }
    .screen[hidden] { display: none; }
    .screen[data-layout="modal"] {
      max-width: 28rem; margin: 2rem auto; border-style: solid;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.12);
    }
    .layout { color: #666; font-size: 0.85rem; margin-top: -0.5rem; }
    .regions { display: flex; flex-direction: column; gap: 0.5rem; }
    .screen[data-layout="sidebar"] .regions { display: grid; grid-template-columns: 12rem 1fr; }
    .screen[data-layout="split-screen"] .regions { display: grid; grid-template-columns: 1fr 1fr; }
    .screen[data-layout="holy-grail"] .regions {
      display: grid; grid-template-columns: 8rem 1fr 8rem;
      grid-template-areas: "header header header" "nav body aside" "footer footer footer";
    }
    .screen[data-layout="holy-grail"] .region[data-slot="header"] { grid-area: header; }
    .screen[data-layout="holy-grail"] .region[data-slot="nav"] { grid-area: nav; }
    .screen[data-layout="holy-grail"] .region[data-slot="body"] { grid-area: body; }
    .screen[data-layout="holy-grail"] .region[data-slot="aside"] { grid-area: aside; }
    .screen[data-layout="holy-grail"] .region[data-slot="footer"] { grid-area: footer; }
    .screen[data-layout="tabbed"] .region[data-slot="tab-bar"] { background: #e8e8e8; }
    .region { margin: 0; padding: 0.5rem; border: 1px solid #ddd; background: var(--wash); }
    .region h3 { margin: 0 0 0.5rem; font-size: 0.9rem; }
    .control { display: block; margin: 0.35rem 0; }
    .control[hidden], .control.hidden { display: none !important; }
    .control.button { display: inline-block; margin-right: 0.35rem;
                       padding: 0.25rem 0.6rem; border: 1px solid var(--ink); background: #eee;
                       cursor: pointer; font: inherit; }
    .control.button.primary { background: #e5e5e5; font-weight: 600; }
    .control.button.emphasized, .control.emphasized { outline: 2px solid var(--emph); background: #eff6ff; }
    .control.button.tinted, .control.tinted { background: var(--tint); }
    .control.selected, .tree-node.selected { background: var(--sel); outline: 1px solid #6c8ebf; }
    .control.disabled, .tree-node.dimmed { opacity: 0.45; }
    .control.error { color: #a00; }
    input[type="text"], select { font: inherit; padding: 0.15rem 0.35rem;
                                   border: 1px solid var(--ink); background: #fff; min-width: 8rem; }
    .tree-node { padding: 0.1rem 0.25rem; cursor: pointer; }
    .tree-node .twist { display: inline-block; width: 1.2rem; }
    .tree-node[data-role="folder"] { font-weight: 600; cursor: default; }
    .screen-stories { font-size: 0.85rem; color: #444; }
    .key { font-size: 0.8rem; color: #555; margin-top: 0.75rem; }
    .panel { border: 1px dashed var(--line); background: #fff; padding: 0.5rem 0.65rem 0.65rem; }
    .panel-head { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.25rem; }
    .panel-head h2 { margin: 0; font-size: 0.95rem; font-weight: 700; flex: 1; min-width: 0; }
    #explorer-tree, #explorer-tree ul { margin: 0.15rem 0 0.15rem 0.8rem; padding: 0; list-style: none; }
    #explorer-tree { margin-left: 0; }
    #explorer-tree { font-size: 16.5px; }
    #explorer-tree .twist, #explorer-tree .node-label { font: inherit; font-weight: 400; background: none; border: 0; padding: 0.02rem 0.12rem; cursor: pointer; text-align: left; }
    #explorer-tree .node-label { display: inline-flex; align-items: center; gap: 0.3rem; }
    #explorer-tree .glyph { width: 1.05rem; height: 1.05rem; flex: none; }
    #explorer-tree .glyph * { fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linejoin: round; stroke-linecap: round; }
    #explorer-tree .twist { display: inline-flex; align-items: center; justify-content: center; width: 0.85rem; height: 0.85rem; padding: 0; vertical-align: middle; }
    #explorer-tree .twist::before { content: ""; width: 0.32rem; height: 0.32rem; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); }
    #explorer-tree .twist[aria-expanded="true"]::before { transform: rotate(45deg); }
    #explorer-tree li.current > .node-label { background: var(--sel); font-weight: 600; }
    #explorer-tree .step { font-size: 15px; font-weight: 400; cursor: pointer; }
    #explorer-tree .step.current { background: var(--sel); }
    #explorer-tree .step-kind.emph { font-weight: 700; }
    #explorer-tree .step u { text-underline-offset: 2px; }
    #explorer-tree .empty { color: #666; font-style: italic; }
    .message { color: #a00; margin-top: 0.75rem; min-height: 1.2rem; }
    .chrome { display: flex; gap: 0.35rem; align-items: center; flex-wrap: wrap; }
    .chrome button { font: inherit; padding: 0.15rem 0.45rem; cursor: pointer; background: #fff; border: 1px solid #ccc; }
    .status { font-size: 0.8rem; color: #555; margin-top: 0.5rem; }
    .toast { position: fixed; right: 1rem; bottom: 1rem; background: #222; color: #fff;
              padding: 0.5rem 0.75rem; font-size: 0.85rem; display: none; z-index: 2; }
    .toast.show { display: block; }
  </style>
</head>
<body data-story-demo-shell>
  <header class="shell-bar">
    <h1>@@TITLE@@</h1>
  </header>

  <div id="shell" data-layout="split-screen">
    <section id="story-demo-frame" aria-label="Product mockup">
      <div class="flow-zoom" aria-label="Flow zoom">
        <button type="button" data-flow-zoom="out" aria-label="Zoom out">−</button>
        <button type="button" data-flow-zoom="reset" aria-label="Reset zoom">100%</button>
        <button type="button" data-flow-zoom="in" aria-label="Zoom in">+</button>
      </div>
      <main id="mockup">
        @@SCREENS@@
      </main>
    </section>

    <section id="explorer-frame" aria-label="Site Map Explorer">
      <div class="panel">
        <div class="panel-head">
          <h2>Site Map Explorer</h2>
          <div class="chrome">
            <button type="button" data-reset>Reset</button>
            <button type="button" data-play-next>▶▶ Play next</button>
          </div>
        </div>
        <ul id="explorer-tree" data-explorer-tree></ul>
        <p class="message" data-explorer-message hidden></p>
      </div>
    </section>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <script id="story-outline" type="application/json">@@STORY_OUTLINE@@</script>
  <script id="screen-stories" type="application/json">@@SCREEN_STORIES@@</script>
@@ENSURE_HINT@@@@STORY_IMPORTS@@
@@OBJECT_IMPORTS@@
  <script src="/practices/ux/story-demo/bind-flow-zoom.js"></script>
  <script>
    bindFlowZoom(document.querySelector('#story-demo-frame'), document.querySelector('#mockup'));
  </script>
  <script type="module" src="/practices/ux/story-demo/mount-generated-mockup.js"></script>
  <script type="module">
    // Generic screen nav (data-goto). Story explorer is mounted by mount-generated-mockup.js.
    const transitions = [
@@TRANSITIONS_JS@@
    ];
    const toast = document.querySelector('#toast');

    function flash(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(flash._t);
      flash._t = setTimeout(() => toast.classList.remove('show'), 1600);
    }

    function showScreen(name) {
      for (const screen of document.querySelectorAll('.screen')) {
        const title = screen.querySelector('h2')?.textContent?.trim();
        screen.hidden = title !== name;
      }
    }

    function visibleScreen() {
      return [...document.querySelectorAll('.screen:not([hidden])')][0];
    }

    document.querySelectorAll('[data-goto]').forEach((el) => {
      el.addEventListener('click', () => {
        const dest = el.getAttribute('data-goto');
        showScreen(dest);
        flash(`→ ${dest}`);
      });
    });

    document.querySelectorAll('[data-trigger]').forEach((el) => {
      el.addEventListener('click', () => {
        if (el.hasAttribute('data-story-steps')) return;
        const trigger = el.getAttribute('data-trigger');
        const from = visibleScreen()?.querySelector('h2')?.textContent?.trim();
        const hit = transitions.find((t) => t.from === from && t.trigger === trigger)
          || transitions.find((t) => t.trigger === trigger);
        if (hit) showScreen(hit.to);
      });
    });
  </script>
  <!-- ux-map-json:
@@MODEL_JSON@@
  -->
</body>
</html>
