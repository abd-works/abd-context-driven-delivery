[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "abd-context-driven-delivery"
version = "0.1.0"
dependencies = [
  "expects>=0.9.0",
  "PyYAML>=6.0",
  "mcp==1.30.0",
  "numpy>=1.26",
  "faiss-cpu>=1.8.0",
  "openai>=1.40.0",
  "anyio>=4.5",
  "httpx>=0.27.1",
  "httpx-sse>=0.4",
  "jsonschema>=4.20.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.5.2",
  "pyjwt>=2.10.1",
  "python-multipart>=0.0.9",
  "pywin32>=310; sys_platform == 'win32'",
  "sse-starlette>=1.6.1",
  "starlette>=0.27",
  "typing-extensions>=4.9.0",
  "typing-inspection>=0.4.1",
  "uvicorn>=0.31.1",
  "mamba>=0.11.3",
  "nltk>=3.9",
  "Jinja2>=3.1.0",
]

[tool.setuptools.packages.find]
# Mirror import_path_entries() in the installer:
#   root → cdd_guidance, tools, harness
#   cdd_guidance/practices, actions, patterns → short catalog imports
where = [".", "harness", "tools", "cdd_guidance/practices", "cdd_guidance/actions", "cdd_guidance/patterns", "cdd_guidance/builders"]
exclude = ["retired*"]
