<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>UX — @@TITLE@@</title>
  <style>
    :root { --ink: #222; --line: #666; --wash: #f0f0f0; --sel: #dbeafe; }
    body { margin: 0; font-family: ui-monospace, Consolas, monospace; color: var(--ink);
           display: grid; grid-template-rows: 1fr auto; min-height: 100vh; background: #fafafa; }
    #mockup { padding: 1rem; overflow: auto; }
    #stories { border-top: 1px solid #ccc; padding: 0.75rem 1rem; background: #f7f7f7; }
    .screen { border: 1px dashed var(--line); margin-bottom: 1rem; padding: 0.75rem;
               background: #fff; max-width: 52rem; }
    .screen[hidden] { display: none; }
    .screen[data-layout="modal"] {
      max-width: 28rem; margin: 2rem auto; border-style: solid;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.12);
    }
    .layout { color: #666; font-size: 0.85rem; margin-top: -0.5rem; }
    .regions { display: flex; flex-direction: column; gap: 0.5rem; }
    .screen[data-layout="sidebar"] .regions { display: grid; grid-template-columns: 12rem 1fr; }
    .screen[data-layout="split-screen"] .regions { display: grid; grid-template-columns: 1fr 1fr; }
    .screen[data-layout="holy-grail"] .regions {
      display: grid; grid-template-columns: 8rem 1fr 8rem;
      grid-template-areas: "header header header" "nav body aside" "footer footer footer";
    }
    .screen[data-layout="holy-grail"] .region[data-slot="header"] { grid-area: header; }
    .screen[data-layout="holy-grail"] .region[data-slot="nav"] { grid-area: nav; }
    .screen[data-layout="holy-grail"] .region[data-slot="body"] { grid-area: body; }
    .screen[data-layout="holy-grail"] .region[data-slot="aside"] { grid-area: aside; }
    .screen[data-layout="holy-grail"] .region[data-slot="footer"] { grid-area: footer; }
    .screen[data-layout="tabbed"] .region[data-slot="tab-bar"] { background: #e8e8e8; }
    .region { margin: 0; padding: 0.5rem; border: 1px solid #ddd; background: var(--wash); }
    .region h3 { margin: 0 0 0.5rem; font-size: 0.9rem; }
    .control { display: block; margin: 0.35rem 0; }
    .control[hidden], .control.hidden { display: none !important; }
    .control.button { display: inline-block; margin-right: 0.35rem;
                       padding: 0.25rem 0.6rem; border: 1px solid var(--ink); background: #eee;
                       cursor: pointer; font: inherit; }
    .control.button.primary { background: #e5e5e5; font-weight: 600; }
    .control.selected, .tree-node.selected { background: var(--sel); outline: 1px solid #6c8ebf; }
    .control.disabled, .tree-node.dimmed { opacity: 0.45; }
    .control.error { color: #a00; }
    input[type="text"], select { font: inherit; padding: 0.15rem 0.35rem;
                                   border: 1px solid var(--ink); background: #fff; min-width: 8rem; }
    .tree-node { padding: 0.1rem 0.25rem; cursor: pointer; }
    .tree-node .twist { display: inline-block; width: 1.2rem; }
    .tree-node[data-role="folder"] { font-weight: 600; cursor: default; }
    .screen-stories { font-size: 0.85rem; color: #444; }
    .key { font-size: 0.8rem; color: #555; margin-top: 0.75rem; }
    .toast { position: fixed; right: 1rem; bottom: 4rem; background: #222; color: #fff;
              padding: 0.5rem 0.75rem; font-size: 0.85rem; display: none; z-index: 2; }
    .toast.show { display: block; }
  </style>
</head>
<body>
  <main id="mockup">
    @@SCREENS@@
    <p class="key">mockup · [____] text · [▾] dropdown · [ btn ] button · ›sel‹ selected · stub interactions wired</p>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <footer id="stories">
    <strong>Stories</strong>
    <ul id="story-list">@@STORIES_LIST@@</ul>
  </footer>
@@ENSURE_HINT@@@@STORY_IMPORTS@@
@@OBJECT_IMPORTS@@
  <script type="module">
    const transitions = [
@@TRANSITIONS_JS@@
    ];
    const toast = document.querySelector('#toast');
    const list = document.querySelector('#story-list');
    const seen = new Set([...list.querySelectorAll('li')].map((li) => li.textContent));

    for (const script of document.querySelectorAll('[data-ux-story-ref]')) {
      try {
        const mod = await import(script.getAttribute('src'));
        const names = mod.storyNames
          || Object.values(mod)
              .filter((value) => value && typeof value === 'object' && value.story)
              .map((value) => value.story);
        for (const name of names || []) {
          if (!name || seen.has(name)) continue;
          seen.add(name);
          const li = document.createElement('li');
          li.textContent = name;
          list.appendChild(li);
        }
      } catch (_err) {
        // Artifact may be missing until Stories transform / JS emit runs.
      }
    }

    function flash(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(flash._t);
      flash._t = setTimeout(() => toast.classList.remove('show'), 1600);
    }

    function showScreen(name) {
      for (const screen of document.querySelectorAll('.screen')) {
        const title = screen.querySelector('h2')?.textContent?.trim();
        screen.hidden = title !== name;
      }
    }

    function visibleScreen() {
      return [...document.querySelectorAll('.screen:not([hidden])')][0];
    }

    function selectedAbilityName() {
      const row = document.querySelector('[data-type="list"].selected');
      if (!row) return 'strength';
      return (row.getAttribute('data-name') || row.textContent || 'strength')
        .split('·')[0].trim().toLowerCase();
    }

    function syncAbilityDropdown(preferred) {
      const select = document.querySelector('[data-name="ability"] select');
      if (!select) return;
      const names = [...document.querySelectorAll('[data-slug="character-sheet"] [data-type="list"]')]
        .map((el) => (el.getAttribute('data-name') || el.textContent.split('·')[0]).trim())
        .filter(Boolean);
      select.innerHTML = '';
      for (const name of names) {
        const opt = document.createElement('option');
        opt.value = name.toLowerCase();
        opt.textContent = name;
        select.appendChild(opt);
      }
      const want = (preferred || selectedAbilityName()).toLowerCase();
      if ([...select.options].some((o) => o.value === want)) select.value = want;
    }

    function hideResult() {
      document.querySelectorAll('[data-name="summary"], [data-name="outcome"]').forEach((el) => {
        el.hidden = true;
      });
    }

    function showResult(summary, outcome) {
      const summaryEl = document.querySelector('[data-name="summary"]');
      const outcomeEl = document.querySelector('[data-name="outcome"]');
      if (summaryEl) { summaryEl.textContent = summary; summaryEl.hidden = false; }
      if (outcomeEl) { outcomeEl.textContent = outcome; outcomeEl.hidden = false; }
    }

    document.querySelectorAll('.tree-node:not([data-role="folder"])').forEach((el) => {
      el.addEventListener('click', () => {
        const tree = el.closest('[data-region]');
        tree?.querySelectorAll('.tree-node').forEach((n) => n.classList.remove('selected'));
        el.classList.add('selected');
      });
    });

    document.querySelectorAll('[data-type="list"]').forEach((el) => {
      el.addEventListener('click', () => {
        const region = el.closest('[data-region]');
        region?.querySelectorAll('[data-type="list"]').forEach((n) => n.classList.remove('selected'));
        el.classList.add('selected');
      });
    });

    document.querySelectorAll('[data-goto]').forEach((el) => {
      el.addEventListener('click', () => {
        const dest = el.getAttribute('data-goto');
        if (dest === 'resolve check') {
          syncAbilityDropdown();
          hideResult();
          const dc = document.querySelector('[data-name="dc"] input');
          if (dc && !dc.value) dc.value = '10';
        }
        showScreen(dest);
      });
    });

    document.querySelectorAll('[data-trigger]').forEach((el) => {
      el.addEventListener('click', () => {
        const trigger = el.getAttribute('data-trigger');
        const effect = (el.getAttribute('data-effect') || '').toLowerCase();
        const from = visibleScreen()?.querySelector('h2')?.textContent?.trim();

        if (trigger === 'create character' || effect.includes('add character')) {
          const tree = document.querySelector('[data-region="character tree"]');
          if (!tree) return;
          const n = tree.querySelectorAll('.tree-node:not([data-role="folder"])').length + 1;
          const node = document.createElement('div');
          node.className = 'tree-node selected';
          node.dataset.type = 'tree';
          node.dataset.name = `Character ${n}`;
          node.innerHTML = `<span class="twist">·</span>Character ${n}`;
          tree.querySelectorAll('.tree-node').forEach((x) => x.classList.remove('selected'));
          tree.appendChild(node);
          node.addEventListener('click', () => {
            tree.querySelectorAll('.tree-node').forEach((x) => x.classList.remove('selected'));
            node.classList.add('selected');
          });
          document.querySelectorAll('[data-slug="character-sheet"] [data-type="list"]').forEach((row) => {
            const ability = row.getAttribute('data-name') || row.textContent.split('·')[0].trim();
            row.textContent = `${ability} · 0`;
            row.setAttribute('data-name', ability);
          });
          flash('Create Character — abilities at rank 0');
          return;
        }

        if (trigger === 'update rank' || effect.includes('bump selected')) {
          const row = document.querySelector('[data-type="list"].selected');
          if (!row) { flash('Select an ability first'); return; }
          const ability = row.getAttribute('data-name') || row.textContent.split('·')[0].trim();
          const parts = row.textContent.split('·').map((s) => s.trim());
          const rank = Number(parts[1] || 0) + 1;
          row.textContent = `${ability} · ${rank}`;
          row.setAttribute('data-name', ability);
          flash(`Update Rank — ${ability} → ${rank} (sheet consistent)`);
          return;
        }

        if (trigger === 'resolve check' || effect.includes('show result')) {
          const select = document.querySelector('[data-name="ability"] select');
          const dcInput = document.querySelector('[data-name="dc"] input');
          const ability = select?.value || selectedAbilityName();
          const dc = Number(dcInput?.value || 10);
          const face = 1 + Math.floor(Math.random() * 10);
          const row = [...document.querySelectorAll('[data-type="list"]')]
            .find((el) => (el.getAttribute('data-name') || '').toLowerCase() === ability);
          const rank = Number((row?.textContent.split('·')[1] || '0').trim()) || 0;
          const total = face + rank;
          const degree = total >= dc ? 1 : 0;
          const outcome = total >= dc ? 'succeeded' : 'failed';
          showResult(`face ${face} · total ${total} · deg ${degree}`, outcome);
          flash(`Resolve Ability Check — ${ability} vs DC ${dc}`);
          return;
        }

        const hit = transitions.find((t) => t.from === from && t.trigger === trigger)
          || transitions.find((t) => t.trigger === trigger);
        if (hit) {
          if (hit.to === 'resolve check') {
            syncAbilityDropdown();
            hideResult();
            const dc = document.querySelector('[data-name="dc"] input');
            if (dc && !dc.value) dc.value = '10';
          }
          showScreen(hit.to);
        }
      });
    });

    hideResult();
    syncAbilityDropdown();
  </script>
  <!-- ux-map-json:
@@MODEL_JSON@@
  -->
</body>
</html>
